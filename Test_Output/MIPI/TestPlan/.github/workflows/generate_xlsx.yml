name: Generate MIPI CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_auto_exec.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: python Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_auto_exec.py

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Auto-generated MIPI_CSI TestPlan XLSX via Agent7"
          git push
