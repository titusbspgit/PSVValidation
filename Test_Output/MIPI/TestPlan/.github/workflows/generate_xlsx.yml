name: Generate MIPI_CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/.github/workflows/generate_xlsx.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261027_173000.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_*.xlsx'
          git commit -m 'Auto-generated MIPI_CSI TestPlan XLSX workbook'
          git push
