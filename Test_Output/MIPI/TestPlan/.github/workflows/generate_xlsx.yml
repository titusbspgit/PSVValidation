name: Generate MIPI_CSI TestPlan XLSX

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python3 auto_gen_push_xlsx.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add '*.xlsx'
          git commit -m 'Generated TestPlan Excel Workbook' || true
          git push
