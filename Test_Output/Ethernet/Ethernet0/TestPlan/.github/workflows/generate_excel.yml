name: Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate workbook
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan
          python Ethernet_TestPlan_Generator_Agent7.py
      - name: Commit and push
        run: |
          git config user.name 'Agent7-Bot'
          git config user.email 'agent7@bot.com'
          git add -A
          git commit -m 'Generated TestPlan Excel Workbook' || true
          git push
