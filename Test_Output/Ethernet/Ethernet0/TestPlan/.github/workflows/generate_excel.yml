name: Generate Ethernet TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/Ethernet_TestPlan_Generator_Final.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl pytz
      - name: Generate Excel
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan
          python Ethernet_TestPlan_Generator_Final.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/Ethernet/Ethernet0/TestPlan/*.xlsx'
          git commit -m 'Generated TestPlan Excel Workbook' || echo 'No changes'
          git push
