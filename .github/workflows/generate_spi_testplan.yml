name: Generate SPI TestPlan Excel (Stage1)

on:
  push:
    paths:
      - 'tools/generate_testplan_excel.py'
      - '.github/workflows/generate_spi_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Compute IST timestamp
        id: ist
        run: |
          echo "ts=$(python - <<'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y%m%d_%H%M%S'))
PY
)" >> $GITHUB_OUTPUT

      - name: Generate Excel
        env:
          TIMESTAMP_IST: ${{ steps.ist.outputs.ts }}
          IP_NAME: SPI
        run: |
          python tools/generate_testplan_excel.py --timestamp "$TIMESTAMP_IST" --ip-name "$IP_NAME"

      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/SPI/TestPlan/SPI_TestPlan_${{ steps.ist.outputs.ts }}.xlsx"
          git commit -m "Add SPI TestPlan Excel generated on ${{ steps.ist.outputs.ts }} IST (IP=SPI, auto-generated by Stage1)"
          git push
