name: Generate SPI Test Plan (Fallback)

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/input_spi_testplan.json'
      - 'tools/gen_spi_testplan.py'
      - '.github/workflows/generate_spi_testplan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel Test Plan
        run: |
          python tools/gen_spi_testplan.py

      - name: Commit Excel to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILENAME=$(cat tools/generated_filename.txt)
          MSG=$(cat tools/commit_message.txt)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILENAME"
          git commit -m "$MSG" || echo "No changes to commit"
          git push
