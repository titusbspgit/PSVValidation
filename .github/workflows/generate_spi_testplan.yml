name: Generate SPI TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_spi_testplan.py'
      - '.github/workflows/generate_spi_testplan.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate SPI TestPlan (XLSX)
        run: |
          python tools/generate_spi_testplan.py
      - name: Commit generated TestPlan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/SPI/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No XLSX changes to commit."
          else
            git commit -m "Add generated SPI TestPlan (.xlsx) [auto]"
            git push
          fi
