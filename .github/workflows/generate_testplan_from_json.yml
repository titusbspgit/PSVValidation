name: Generate TestPlan Excel from JSON (Batch 2)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_testplan_from_json.yml
  workflow_dispatch: {}

jobs:
  build-and-commit-excel:
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILE_PATH: Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
      INPUT_JSON: |
        {
          "TC4": {
            "Index": 4,
            "SS / Module": "GPIO",
            "Feature": "Interrupts can be generated based on negative edge detection at GPIO input",
            "Test Case Name": "test_gpio_negedge_intr_en",
            "Test Description": "Validates that a falling edge on GPIO inputs generates an interrupt and that raw and group statuses can be cleared. The test iterates across multiple GPIO pads and checks status and clear behavior per event.",
            "Speed": "NA",
            "Mode": "Interrupt",
            "Memory Start Offset": "0xA0243ffc",
            "Memory End Offset": "0xA0243ffc",
            "Remarks": "Input mode and negative-edge detection are enabled for GPIOs 8–39 as stated in comments. The test drives GPIO input changes using memory at 0xA0243ffc. One of two GPIO interrupt sources may be selected at build time, which determines the interrupt ID to enable and clear.",
            "Test Steps / Procedure": "1) Enable the GPIO interrupt source in intr_en1 and enable the corresponding platform interrupt.\n2) Initialize memory at 0xA0243ffc to all ones to establish a known state.\n3) For each GPIO pad from the first per‑GPIO register (gpio_8) through the next 31 pads, set input mode and enable negative‑edge detection.\n4) For the current pad, enable its bit in intr1_intr_en1 to allow group interrupt signaling.\n5) Drive memory at 0xA0243ffc to all ones, then drive only the current pad bit low to create a falling edge.\n6) Wait until the interrupt service routine completes.\n7) In the handler, read the current per‑GPIO register (starting at gpio_8) and confirm the input status indicates an active level and the raw status is set.\n8) Read intr1_intr_sts1 and confirm the bit for the current pad is set.\n9) Clear the pad’s raw status by writing the clear value to its per‑GPIO register and verify the per‑GPIO readback indicates the cleared state.\n10) Read intr1_intr_sts1 and confirm the group status is cleared for the pad.\n11) Clear the selected GPIO system raw interrupt via gpio_intr_raw_stclr1 and clear the platform interrupt.",
            "Impacted Registers": [
              "gpio_8",
              "intr1_intr_en1",
              "intr1_intr_sts1",
              "intr_en1",
              "gpio_intr_raw_stclr1"
            ],
            "Validation / Acceptance Criteria": "1) After the falling edge, the per‑GPIO input status indicates an active level; pass if active, otherwise fail.\n2) After the falling edge, the per‑GPIO raw status is set; pass if set, otherwise fail.\n3) After the falling edge, intr1_intr_sts1 has the bit for the active pad set; pass if set, otherwise fail.\n4) After writing the per‑GPIO clear value, the per‑GPIO readback reflects the cleared state; pass if cleared, otherwise fail.\n5) After clearing, intr1_intr_sts1 shows the group status cleared; pass if cleared, otherwise fail.",
            "Code Generation (Required / Not)": "",
            "Hidden_Test_Case_Name": "test_gpio_negedge_intr_en",
            "Hidden_Test_Description": "The test enables the system interrupt source for either GPIO0 or GPIO1 (build-time selection), initializes SRAM at 0xA0243ffc, and for 32 GPIO pads (mapped from base register MIZAR_GPIO_GP0_GPIO_8), programs input mode and negative-edge interrupt (comment: 20th and 18th bits set). For each pad, it enables the corresponding bit in MIZAR_GPIO_GP0_INTR1_INTR_EN1, drives a falling edge by writing ~(1<<i) to 0xA0243ffc, then waits for the interrupt. In the ISR, it verifies the per-pad DIN bit and raw interrupt bit, checks the group status in MIZAR_GPIO_GP0_INTR1_INTR_STS1, clears the per-pad raw status by writing 0x00110001 (comment: 16th bit set) to the per-pad GPIO register, verifies per-pad readback (0x100001), checks group status is cleared, writes to MIZAR_LSS_SYSREG_RAW_STCR1 to clear the system raw interrupt for the selected source, and clears the platform interrupt. Sources: program.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/program.c), test_define.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/test_define.c), Makefile (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/Makefile).",
            "Hidden_Remarks": "Comments indicate enabling input mode and negative-edge interrupt on GPIOs 8–39 by writing 0x00140000 to each per-pad register and clearing raw status by writing 0x00110001 (16th bit set). The group interrupt disable write is present but commented out. System raw status clear (MIZAR_LSS_SYSREG_RAW_STCR1) is written but not read back for verification. The Makefile defines DEBUG_RW_MSG only; DEBUG_DISPLAY prints are compiled out.",
            "Hidden_Test_Steps_Procedure": "Files: program.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/program.c), test_define.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/test_define.c), Makefile (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_negedge_intr_en/Makefile).\n1. test_case entry; set test_err = 0.\n2. If GPIO0 defined: GIC_EnableIRQ(87).\n3. If GPIO1 defined: GIC_EnableIRQ(88).\n4. If GPIO0 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR).\n5. If GPIO1 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).\n6. write_reg(0xA0243ffc, 0xffffffff).\n7. For i = 0..31:\n   7.1. addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n   7.2. write_reg(addr1, 0x00140000). // comment: program Input Mode and enable negedge (20th and 18th bits as '1')\n   7.3. wait_on(50).\n   7.4. wr_val = 1 << i.\n   7.5. write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val). // enable group interrupt bit for current pad\n   7.6. wait_on(10).\n   7.7. write_reg(0xA0243ffc, 0xffffffff).\n   7.8. wait_on(30).\n   7.9. write_reg(0xA0243ffc, ~(wr_val)). // drive only current pad bit low to create falling edge\n   7.10. int_pend = 1.\n   7.11. while (int_pend) { wait_on(10); }\n8. finish(test_err).\n9. Default_IRQHandler entry:\n   9.1. Declare rdata_grp, raddr, raddr2.\n   9.2. int_pend = 0.\n   9.3. write_reg(0xA0243ffc, 0xffffffff). // restore memory to all ones\n   9.4. raddr = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n   9.5. rdata = read_reg(raddr).\n   9.6. If ((rdata & 0x1) != 0x0) { /* DIN matches expected */ } else { test_err++; }\n   9.7. If ((rdata & 0x2) != 0x0) {\n        9.7.1. rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n        9.7.2. If ((rdata_grp & (wr_val)) != 0) { /* group interrupt raised */ } else { test_err = test_err + 1; }\n        9.7.3. raddr2 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n        9.7.4. write_reg(raddr2, 0x00110001). // clear raw status (16th bit as '1')\n        9.7.5. rdata = read_reg(raddr2).\n        9.7.6. If (rdata == 0x100001) { /* clear success */ } else { test_err = test_err + 1; }\n        9.7.7. rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n        9.7.8. If (rdata_grp == 0x0) { /* group cleared */ } else { test_err = test_err + 1; }\n        9.7.9. If GPIO0 defined: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87).\n        9.7.10. If GPIO1 defined: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88).\n      }\n   9.8. Else { /* (rdata & 0x2) == 0 */ test_err++; }\nNotes: The line to disable group interrupt (write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000)) is commented out. DEBUG_DISPLAY prints are compiled out; only DEBUG_RW_MSG is defined.",
            "Hidden_Impacted_Registers": [
              "MIZAR_LSS_SYSREG_INTR_EN1",
              "MIZAR_GPIO_GP0_GPIO_8",
              "MIZAR_GPIO_GP0_INTR1_INTR_EN1",
              "MIZAR_GPIO_GP0_INTR1_INTR_STS1",
              "MIZAR_LSS_SYSREG_RAW_STCR1"
            ],
            "Hidden_Validation_Acceptance_Criteria": [
              "If ((rdata & 0x1) != 0x0) after read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4)), treat as success for DIN value; else increment test_err.",
              "If ((rdata & 0x2) != 0x0) then proceed; else increment test_err (Interrupt Not occured).",
              "After read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1), if ((rdata_grp & wr_val) != 0) treat as group interrupt occurred; else increment test_err.",
              "After write_reg(raddr2, 0x00110001) and readback, if rdata == 0x100001 treat as raw status cleared; else increment test_err.",
              "After clearing, if read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1) == 0x0 treat as group status cleared; else increment test_err."
            ]
          },
          "TC5": {
            "Index": 5,
            "SS / Module": "GPIO",
            "Feature": "gpio_data_out –GPIO output data to be driven to IO pad in output mode.",
            "Test Case Name": "test_gpio_op_mode_all_pad_en",
            "Test Description": "Verifies GPIO output mode by driving each pad high and low and checking the observed pad state through a pad-status memory mirror.",
            "Speed": "NA",
            "Mode": "NA",
            "Memory Start Offset": "0xA0243ffc",
            "Memory End Offset": "0xA0243ffc",
            "Remarks": "Output mode for GPIOs 8–39 is enabled using group IO control registers. Pad state is checked via memory at 0xA0243ffc. Build-time switches may enable and clear different interrupt IDs; any unexpected interrupt is treated as an error.",
            "Test Steps / Procedure": "1) If required by build configuration, enable the platform interrupt for the selected GPIO source.\n2) Configure the IO control groups to place GPIOs 8–39 in output mode.\n3) Enable the GPIO group interrupt mask for the bank (not used for functional checking).\n4) For each GPIO from 8 to 39, write the per-GPIO control (starting at gp0_gpio_8 with an index-based offset) to drive the output high, then read the pad-status mirror to verify the corresponding bit is 1.\n5) Wait briefly, then write the same per-GPIO control to drive the output low, and read the pad-status mirror to verify the corresponding bit is 0.\n6) Ensure no unexpected interrupt occurs during the sequence; if one occurs, the test fails.",
            "Impacted Registers": [
              "gp0_gpio_8"
            ],
            "Validation / Acceptance Criteria": "1) When a GPIO output is set high, the corresponding bit in the pad-status mirror reads 1; pass if it reads 1, otherwise fail.\n2) When a GPIO output is set low, the corresponding bit in the pad-status mirror reads 0; pass if it reads 0, otherwise fail.\n3) No unexpected interrupt is taken while toggling outputs; pass if none occurs, otherwise fail.",
            "Code Generation (Required / Not)": "",
            "Hidden_Test_Case_Name": "test_gpio_op_mode_all_pad_en",
            "Hidden_Test_Description": "The test enables output mode for GPIOs 8–39 via group IO control, then for each of 32 GPIOs (base MIZAR_GPIO_GP0_GPIO_8 with +4-byte stride) writes 0x00200000 to drive DOUT=1 and verifies the pad state by reading 0xA0243ffc, then writes 0x00000000 to drive DOUT=0 and verifies the pad state again. It optionally enables/clears platform interrupts based on GPIO0/GPIO1 defines and treats any default IRQ entry as an error. Sources: program.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/program.c), test_define.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/test_define.c), Makefile (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/Makefile).",
            "Hidden_Remarks": "- Group IO control writes (0x00FF00FF) are used to enable output mode for GPIOs 8–39 per code comment.\n- Per-GPIO writes use 0x00200000 to drive output high and 0x00000000 to drive low.\n- The pad state is validated using read_reg(0xA0243ffc).\n- GIC interrupts (IDs 87/88) are enabled/cleared conditionally; any Default_IRQHandler entry increments test_err and indicates failure.\n- Group interrupt enable (MIZAR_GPIO_GP0_INTR1_INTR_EN1 = 0xFFFFFFFF) is set but not functionally consumed by the test.",
            "Hidden_Test_Steps_Procedure": "Files: program.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/program.c), test_define.c (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/test_define.c), Makefile (https://github.com/titusbspgit/PSVValidation/blob/main/TestRepo/gpio/test_gpio_op_mode_all_pad_en/Makefile).\n1. Entry to test_case; declare int i; set test_err = 0.\n2. If GPIO0 is defined: GIC_EnableIRQ(87).\n3. If GPIO1 is defined: GIC_EnableIRQ(88).\n4. Write group IO control to enable output mode for GPIOs 8–39:\n   4.1. write_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, 0x00FF00FF).\n   4.2. write_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP2, 0x00FF00FF).\n   4.3. write_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP3, 0x00FF00FF).\n   4.4. write_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP4, 0x00FF00FF).\n5. wait_on(10).\n6. Enable group interrupt bits: write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF).\n7. For (i = 0; i < 32; i++):\n   7.1. write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00200000) to drive output high.\n   7.2. gp0_flag_dout_one = 1.\n   7.3. call check_for_pad_value(i).\n   7.4. wait_on(20).\n   7.5. write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00000000) to drive output low.\n   7.6. gp0_flag_dout_zero = 1.\n   7.7. call check_for_pad_value(i).\n8. finish(test_err).\n9. Function check_for_pad_value(unsigned int gpio_pad_num):\n   9.1. If DEBUG_DISPLAY defined: printf entry message.\n   9.2. rdata = read_reg(0xA0243ffc).\n   9.3. If (gp0_flag_dout_one == 1):\n       9.3.1. If ((rdata & (1 << gpio_pad_num)) != 0): (optional success print).\n       9.3.2. Else: printf(\"ERROR: GPIO_NUM = %0d DOUT_ONE:: GPIO Pad value does not match with dout value %x\\n\", gpio_pad_num, rdata); test_err++.\n       9.3.3. gp0_flag_dout_one = 0.\n   9.4. If (gp0_flag_dout_zero == 1):\n       9.4.1. If ((rdata & (1 << gpio_pad_num)) == 0): (optional success print).\n       9.4.2. Else: printf(\"ERROR: GPIO_NUM = %0d DOUT_ZERO:: GPIO Pad value does not match with dout value %x\\n\", gpio_pad_num, rdata); test_err++.\n       9.4.3. gp0_flag_dout_zero = 0.\n   9.5. If GPIO0 defined: GIC_ClearIRQ(87).\n   9.6. If GPIO1 defined: GIC_ClearIRQ(88).\n10. Default_IRQHandler(): printf(\"ERROR:: Entered Default IRQ_Handler.. :( \\n \" ); test_err++ ."
          }
        }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON and format
        env:
          INPUT_JSON: ${{ env.INPUT_JSON }}
          OUTPUT_FILE_PATH: ${{ env.OUTPUT_FILE_PATH }}
        run: |
          python - << 'PY'
          import json, os, sys, io, re, zipfile
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, Alignment, PatternFill, Border, Side
          from openpyxl.worksheet.datavalidation import DataValidation
          from openpyxl.utils import get_column_letter
          # Read input JSON (object with TC keys) and convert to array
          raw = os.environ['INPUT_JSON']
          data_obj = json.loads(raw)
          rows_in = list(data_obj.values())
          out_path = os.environ.get('OUTPUT_FILE_PATH')
          os.makedirs(os.path.dirname(out_path), exist_ok=True)
          existing_rows = []
          if os.path.exists(out_path):
              wb_old = load_workbook(out_path, data_only=True)
              if 'TestPlan' in wb_old.sheetnames:
                  ws_old = wb_old['TestPlan']
                  headers = [c.value for c in ws_old[1]]
                  for r in ws_old.iter_rows(min_row=2, values_only=True):
                      if all(v is None for v in r):
                          continue
                      d = {}
                      for h, v in zip(headers, r):
                          d[h] = "" if v is None else (v if isinstance(v, (int, float)) else str(v))
                      existing_rows.append(d)
          # Merge preserving first-seen key order
          key_order = []
          merged = []
          def add_keys(d):
              for k in d.keys():
                  if k not in key_order:
                      key_order.append(k)
          for d in existing_rows:
              add_keys(d)
              merged.append(d)
          for d in rows_in:
              add_keys(d)
              merged.append(d)
          # Base workbook with 'Data' sheet
          wb = Workbook()
          ws = wb.active
          ws.title = 'Data'
          for col, key in enumerate(key_order, start=1):
              c = ws.cell(row=1, column=col, value=key)
              c.font = Font(bold=True)
              c.alignment = Alignment(horizontal='center', vertical='center')
          ws.freeze_panes = 'A2'
          for r_idx, rec in enumerate(merged, start=2):
              for c_idx, key in enumerate(key_order, start=1):
                  val = rec.get(key, "")
                  ws.cell(row=r_idx, column=c_idx, value=val)
          # Column widths on Data
          from openpyxl.utils import get_column_letter
          for c_idx, key in enumerate(key_order, start=1):
              col_letter = get_column_letter(c_idx)
              max_len = len(str(key)) + 2
              for r in range(2, ws.max_row+1):
                  v = ws.cell(row=r, column=c_idx).value
                  l = len(str(v)) if v is not None else 0
                  if l > max_len:
                      max_len = l
              ws.column_dimensions[col_letter].width = min(max(10, max_len*0.9), 120)
          # Meta_data_sheet
          meta_cols = [
              "Hidden_Test_Case_Name",
              "Hidden_Test_Description",
              "Hidden_Remarks",
              "Hidden_Test_Steps_Procedure",
              "Hidden_Impacted_Registers",
              "Hidden_Validation_Acceptance_Criteria"
          ]
          ws_meta = wb.create_sheet('Meta_data_sheet')
          for col, key in enumerate(meta_cols, 1):
              ws_meta.cell(row=1, column=col, value=key)
          for r_idx, rec in enumerate(merged, start=2):
              for c_idx, key in enumerate(meta_cols, start=1):
                  ws_meta.cell(row=r_idx, column=c_idx, value=rec.get(key, ""))
          ws_meta.sheet_state = 'veryHidden'
          # Normalize main (remove META, order columns), rename to TestPlan
          ws_main = ws
          main_order = [
              "Index",
              "SS / Module",
              "Feature",
              "Test Case Name",
              "Test Description",
              "Speed",
              "Mode",
              "Memory Start Offset",
              "Memory End Offset",
              "Remarks",
              "Test Steps / Procedure",
              "Impacted Registers",
              "Validation / Acceptance Criteria",
              "Code Generation (Required / Not)"
          ]
          headers_now = [ws_main.cell(row=1, column=i).value for i in range(1, ws_main.max_column+1)]
          keep_cols = [h for h in main_order if h in headers_now]
          rows_out = [keep_cols]
          for r in range(2, ws_main.max_row+1):
              row_vals = []
              empty = True
              for h in keep_cols:
                  idx = headers_now.index(h) + 1
                  v = ws_main.cell(row=r, column=idx).value
                  row_vals.append(v if v is not None else "")
                  if v not in (None, ""):
                      empty = False
              if not empty:
                  rows_out.append(row_vals)
          ws_main.delete_rows(1, ws_main.max_row)
          for c_idx, h in enumerate(keep_cols, 1):
              ws_main.cell(row=1, column=c_idx, value=h)
          for r_idx, row in enumerate(rows_out[1:], start=2):
              for c_idx, v in enumerate(row, start=1):
                  ws_main.cell(row=r_idx, column=c_idx, value=v)
          ws_main.title = 'TestPlan'
          # Format TestPlan
          blue_fill = PatternFill(start_color="FFBDD7EE", end_color="FFBDD7EE", fill_type="solid")
          for c in ws_main[1]:
              c.font = Font(bold=True)
              c.alignment = Alignment(horizontal='center', vertical='center', wrap_text=True)
              c.fill = blue_fill
          wrap_cols = ["Test Description", "Remarks", "Test Steps / Procedure", "Validation / Acceptance Criteria"]
          wrap_idx = [keep_cols.index(h)+1 for h in wrap_cols if h in keep_cols]
          thin = Side(style='thin', color="FF000000")
          border = Border(left=thin, right=thin, top=thin, bottom=thin)
          for r in ws_main.iter_rows(min_row=2, max_row=ws_main.max_row, min_col=1, max_col=ws_main.max_column):
              for cell in r:
                  if cell.column in wrap_idx:
                      cell.alignment = Alignment(wrap_text=True, vertical='top', horizontal='left')
                  else:
                      header = keep_cols[cell.column - 1]
                      if header == "Index":
                          cell.alignment = Alignment(vertical='top', horizontal='center')
                      else:
                          cell.alignment = Alignment(vertical='top', horizontal='left')
                  cell.border = border
          for c_idx in range(1, ws_main.max_column+1):
              header = ws_main.cell(row=1, column=c_idx).value
              col_letter = get_column_letter(c_idx)
              max_len = len(str(header)) + 2
              for r in range(2, ws_main.max_row+1):
                  v = ws_main.cell(row=r, column=c_idx).value
                  l = len(str(v)) if v is not None else 0
                  if l > max_len:
                      max_len = l
              ws_main.column_dimensions[col_letter].width = min(max(10, max_len*0.9), 120)
          # Row heights
          for r in range(2, ws_main.max_row+1):
              max_lines = 1
              for c_idx in wrap_idx:
                  v = ws_main.cell(row=r, column=c_idx).value
                  if v is None:
                      continue
                  lines = str(v).count("\n") + 1
                  if lines > max_lines:
                      max_lines = lines
              ws_main.row_dimensions[r].height = min(15 * max_lines, 409)
          # Renumber list fields
          def renumber(text):
              if text is None or str(text).strip()=="":
                  return text
              parts = str(text).splitlines()
              out = []
              pat = re.compile(r'^\s*\d+[\.)]\s*')
              for i, p in enumerate(parts, 1):
                  p2 = pat.sub('', p.strip())
                  out.append(f"{i}. {p2}")
              return "\n".join(out)
          for col_name in ["Test Steps / Procedure", "Validation / Acceptance Criteria"]:
              if col_name in keep_cols:
                  cidx = keep_cols.index(col_name)+1
                  for r in range(2, ws_main.max_row+1):
                      v = ws_main.cell(row=r, column=cidx).value
                      ws_main.cell(row=r, column=cidx, value=renumber(v))
          # Validation for Code Generation (Required / Not)
          if "Code Generation (Required / Not)" in keep_cols:
              col_idx = keep_cols.index("Code Generation (Required / Not)")+1
              dv = DataValidation(type="list", formula1='"Required,Blank,Not Required"', allow_blank=True, showDropDown=True)
              ws_main.add_data_validation(dv)
              rng = f"{get_column_letter(col_idx)}2:{get_column_letter(col_idx)}{ws_main.max_row}"
              dv.add(rng)
          # Ensure no Data sheet remains
          if 'Data' in wb.sheetnames and wb['Data'] != ws_main:
              wb.remove(wb['Data'])
          # Save and validate
          wb.save(out_path)
          ok = False
          try:
              with zipfile.ZipFile(out_path, 'r') as z:
                  ok = any(n == 'xl/workbook.xml' for n in z.namelist())
          except Exception as e:
              ok = False
          if not ok:
              print('XLSX validation failed', file=sys.stderr)
              sys.exit(2)
          PY
      - name: Commit Excel
        env:
          OUTPUT_FILE_PATH: ${{ env.OUTPUT_FILE_PATH }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$OUTPUT_FILE_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push origin HEAD:main
          fi
