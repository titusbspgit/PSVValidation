name: Generate MIPI CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/gen_mipi_csi_testplan_current.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python gen_mipi_csi_testplan_current.py

      - name: Commit and push XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          XLSX_FILE=$(ls -t MIPI_CSI_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -n "$XLSX_FILE" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$XLSX_FILE"
            git commit -m 'Added generated TestPlan Excel'
            git push
          fi
