name: Generate MIPI CSI TestPlan XLSX
on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_xlsx_final.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate XLSX
        run: cd Test_Output/MIPI/TestPlan && python generate_mipi_csi_testplan_xlsx_final.py
      - name: Commit XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
