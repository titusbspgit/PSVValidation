name: Generate MIPI_CSI TestPlan Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: |
          cd Test_Output/Testing_new_usecase/TestPlan
          python3 -c "
          import base64, io, os, sys
          from datetime import datetime, timezone, timedelta
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side

          IP_NAME = 'MIPI_CSI'
          MODULE_NAME = 'MIPI CSI-2'
          FEATURE = 'Test Pattern Generator'
          TESTCASE_NAME = 'mipi_csi2_test_pattern_generator'

          TEST_DESCRIPTION = ('Configures and validates the MIPI CSI-2 internal test pattern generator. '
              'The test initializes the CSI-2 subsystem with virtual channel configuration, '
              'D-PHY initialization, DMA setup, enables the pattern generator, and verifies '
              'DMA transfer completion. Validates end-to-end data path from CSI-2 pattern '
              'generator through DMA to memory.')

          TEST_STEPS = '''Step 1: Declare global variables (data_rd, data_wr, def_fail_cnt, wr_fail_cnt, vcid_csi2_wrap_reg, gdma_path, csi_ctrl_data, gdma_int_rsts, gdma_ch0_rsts, gdma_ch1_rsts, tx_trnsfr_size, gdma_reg_base)
          Step 2: [INIT] Set int_pend = 1, configure vcid = 3, compute vcid_unselected_path = ((vcid + 1) & 0xf)
          Step 3: [INIT] Select GDMA path based on compile-time defines and compute vcid_csi2_wrap_reg
          Step 4: [INIT] Compute gdma_reg_base = 0xE6A00000 + (gdma_path * 0x1000)
          Step 5: [INIT] Write MIZAR_MIPI_CSI2_RB_REG_VIRTUAL_CHANNEL with vcid_csi2_wrap_reg
          Step 6: [INIT] Write MIZAR_MIPI_CSI2_RB_REG_CONTROL_DATA with 0
          Step 7: [INIT] Call csi2_subsys_enable_interrupt()
          Step 8: [INIT] Call snps_phy_init() to initialize SNPS D-PHY
          Step 9: [RUN] Read MIZAR_MIPI_CSI2_HOST_PHY_STOPSTATE register
          Step 10: [RUN] Poll PHY_STOPSTATE until value equals 0x1000f (timeout 100000)
          Step 11: [RUN] Set hres=320, vres=16, valid_bits_per_pixel=24
          Step 12: [RUN] Compute csi2_data_trnsfr_size with 8-byte alignment
          Step 13: [RUN] Write DMA higher-order address registers
          Step 14: [RUN] Enable fracdiv output: write (RB_REG_BASE + 0xf4) = 0x1
          Step 15: [RUN] Set dma_ch0_pc = 0xE6000000, configure incr_flag
          Step 16: [RUN] Call dma_trnsfr_instn_preload_incr_addr()
          Step 17: [RUN] Call DMAGO_CSI() for channel 0
          Step 18: [RUN] Call csi2_ctrlr_pg_enable(): VRES=0x10, HRES=0x70140, CONFIG=0xe401, ENABLE=1
          Step 19: [RUN] Busy-wait delay
          Step 20: [RUN] Disable pattern generator: PG_ENABLE = 0
          Step 21: [RUN] Read DMA INTMIS
          Step 22: [RUN] Poll DMA INTMIS bit 0 (timeout 100000)
          Step 23: [RUN] Busy-wait delay
          Step 24: [RUN] Set out->status = 0 (PASS)
          Step 25: [TEARDOWN] No cleanup, return 0'''

          IMPACTED_REGISTERS = '''MIZAR_MIPI_CSI2_HOST_PPI_PG_PATTERN_VRES
          MIZAR_MIPI_CSI2_HOST_PPI_PG_PATTERN_HRES
          MIZAR_MIPI_CSI2_HOST_PPI_PG_CONFIG
          MIZAR_MIPI_CSI2_HOST_PPI_PG_ENABLE
          MIZAR_MIPI_CSI2_HOST_INT_ST_MAIN
          MIZAR_MIPI_CSI2_HOST_INT_MSK_PHY_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_PKT_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_PHY
          MIZAR_MIPI_CSI2_HOST_INT_MSK_LINE
          MIZAR_MIPI_CSI2_HOST_INT_MSK_BNDRY_FRAME_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_SEQ_FRAME_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_CRC_FRAME_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_PLD_CRC_FATAL
          MIZAR_MIPI_CSI2_HOST_INT_MSK_DATA_ID
          MIZAR_MIPI_CSI2_HOST_INT_MSK_ECC_CORRECTED
          MIZAR_MIPI_CSI2_HOST_PHY_STOPSTATE
          MIZAR_MIPI_CSI2_RB_REG_VIRTUAL_CHANNEL
          MIZAR_MIPI_CSI2_RB_REG_CONTROL_DATA
          MIZAR_MIPI_CSI2_RB_REG_DMA_M0_ADDR_AR_CH0_DATA
          MIZAR_MIPI_CSI2_RB_REG_DMA_M0_ADDR_AR_CH0_INSTRUCTION
          MIZAR_MIPI_CSI2_RB_REG_DMA_M0_ADDR_AW_CH0_DATA
          MIZAR_MIPI_CSI2_RB_REG_DMA_M0_ADDR_AW_CH0_INSTRUCTION
          MIZAR_MIPI_CSI2_RB_REG_BASE + 0xf4
          gdma_reg_base + MIPI_CSI2_DMA_INTMIS_OFFSET'''

          VALIDATION_CRITERIA = '''1. PHY_STOPSTATE must reach 0x1000f within 100000 iterations
          2. DMA transfer size correctly computed with 8-byte alignment (hres=320, vres=16, bpp=24)
          3. Pattern generator enabled (PG_ENABLE=1) and disabled (PG_ENABLE=0)
          4. DMA INTMIS bit 0 set within 100000 iterations
          5. All interrupt mask registers programmed correctly
          6. Test returns status=0 (PASS) on success
          7. Test returns status=-1 (FAIL) on timeout
          8. NULL output pointer rejected with return -1'''

          META_HEADERS = '''#include <test.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include \"test_common.h\"
          #include \"mipi_csi2.h\"
          #include \"log.h\"
          #include \"reg_access.h\"
          #include \"mipi_csi2_test_pattern_generator.h\"'''

          META_MACROS = '''#define GDMA_CSI2_DATA_DEST_ADDR2 0xE6040080
          #define GDMA_CTRL_DATA_DEST_ADDR2 0xE6040000'''

          META_ARRAYS = '''int data_rd, data_wr;
          int def_fail_cnt = 0, wr_fail_cnt = 0;
          int vcid_csi2_wrap_reg;
          int gdma_path;
          long int csi_ctrl_data;
          int gdma_int_rsts, gdma_ch0_rsts, gdma_ch1_rsts;
          extern int int_pend;
          unsigned int tx_trnsfr_size;
          static unsigned long int gdma_reg_base;'''

          REMARKS = ('MANUAL_REVIEW items: extern int_pend type, gdma_reg_base scope, '
              'csi2_subsys_enable_interrupt() external. Conditionals: GDMA3/2/1/0_PATH, FPS60.')

          CODE_GEN = 'See generated files: mipi_csi2_test_pattern_generator.c, mipi_csi2_test_pattern_generator.h'

          IST = timezone(timedelta(hours=5, minutes=30))
          now_ist = datetime.now(IST)
          ts = now_ist.strftime('%Y%m%d_%H%M%S')
          fname = f'MIPI_CSI_TestPlan_{ts}.xlsx'

          wb = Workbook()
          ws_tp = wb.active
          ws_tp.title = 'TestPlan'
          tp_h = ['Index','SS / Module','Feature','Test Case Name','Test Description','Speed','Mode','Memory Start Offset','Memory End Offset','Remarks','Test Steps / Procedure','Impacted Registers','Validation / Acceptance Criteria','Code Generation']
          ws_tp.append(tp_h)
          ws_tp.append([1, MODULE_NAME, FEATURE, TESTCASE_NAME, TEST_DESCRIPTION, '', '', '', '', REMARKS, TEST_STEPS, IMPACTED_REGISTERS, VALIDATION_CRITERIA, CODE_GEN])

          ws_md = wb.create_sheet('MetaData')
          md_h = ['Index','Test Case Name','Meta Test Description','Meta Test Steps / Procedure','Meta Impacted Registers','Meta Validation / Acceptance Criteria','Meta Headers','Meta Macros','Meta Arrays']
          ws_md.append(md_h)
          ws_md.append([1, TESTCASE_NAME, TEST_DESCRIPTION, TEST_STEPS, IMPACTED_REGISTERS, VALIDATION_CRITERIA, META_HEADERS, META_MACROS, META_ARRAYS])

          hf = Font(bold=True, color='FFFFFF', size=11)
          hfill = PatternFill(start_color='4472C4', end_color='4472C4', fill_type='solid')
          ha = Alignment(horizontal='center', vertical='center', wrap_text=True)
          ca = Alignment(vertical='top', wrap_text=True)
          tb = Border(left=Side(style='thin'), right=Side(style='thin'), top=Side(style='thin'), bottom=Side(style='thin'))

          for ws in [ws_tp, ws_md]:
              for cell in ws[1]:
                  cell.font = hf; cell.fill = hfill; cell.alignment = ha; cell.border = tb
              for row in ws.iter_rows(min_row=2):
                  for cell in row:
                      cell.alignment = ca; cell.border = tb
              ws.freeze_panes = 'A2'
              for col_cells in ws.columns:
                  mx = 0; cl = col_cells[0].column_letter
                  for c in col_cells:
                      if c.value:
                          for ln in str(c.value).split(chr(10)):
                              mx = max(mx, len(ln))
                  ws.column_dimensions[cl].width = max(min(mx + 4, 60), 12)

          ws_md.sheet_state = 'veryHidden'
          wb.save(fname)

          # Validate
          wb2 = load_workbook(fname)
          assert 'TestPlan' in wb2.sheetnames
          assert 'MetaData' in wb2.sheetnames
          fsize = os.path.getsize(fname)
          assert fsize > 0
          print(f'GENERATED:{fname}:SIZE:{fsize}')
          "

      - name: Commit generated XLSX
        run: |
          cd Test_Output/Testing_new_usecase/TestPlan
          XLSX_FILE=$(ls -1 MIPI_CSI_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Found: $XLSX_FILE"
          cd ../../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/Testing_new_usecase/TestPlan/$XLSX_FILE"
          git commit -m "Added generated TestPlan Excel"
          git push
