name: Generate MIPI_CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20251010.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python3 generate_mipi_csi_testplan_20251010.py

      - name: Commit and push XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
