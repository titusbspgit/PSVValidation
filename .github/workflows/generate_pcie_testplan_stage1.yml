name: Generate PCIE TestPlan (Stage1)

on:
  push:
    paths:
      - .github/workflows/generate_pcie_testplan_stage1.yml
      - scripts/gen_stage1_testplan_excel.py
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set IST timezone and timestamps
        id: ist
        run: |
          sudo ln -fs /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
          echo "timestamp=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
          echo "human=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel (Stage1 formatting)
        env:
          IST_STAMP: ${{ steps.ist.outputs.timestamp }}
          IST_HUMAN: ${{ steps.ist.outputs.human }}
        run: |
          python3 scripts/gen_stage1_testplan_excel.py --ist-stamp "$IST_STAMP" --ist-human "$IST_HUMAN"
      - name: Commit Excel
        env:
          IST_HUMAN: ${{ steps.ist.outputs.human }}
          IST_STAMP: ${{ steps.ist.outputs.timestamp }}
        run: |
          git config user.name "MPSoC TestPlan Bot"
          git config user.email "mpsoc-bot@psvvalidation.com"
          git add Test_Output/PCIE/TestPlan/PCIE_TestPlan_${IST_STAMP}.xlsx
          git commit -m "Add PCIE Test Plan (Stage1) autogenerated on ${IST_HUMAN}" || echo "No changes to commit"
          git push
