name: Agent7 Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/generate_and_push.py'

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel Workbook
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan
          python -c "
import generate_and_push as g
import base64, datetime, os
b64 = g.generate()
raw = base64.b64decode(b64)
now = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
ts = now.strftime('%Y%m%d_%H%M%S')
fname = f'Ethernet_TestPlan_{ts}.xlsx'
with open(fname, 'wb') as f:
    f.write(raw)
print(f'Generated: {fname}')
print(f'Size: {os.path.getsize(fname)} bytes')
"

      - name: Commit and push generated workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/Ethernet/Ethernet0/TestPlan/*.xlsx'
          git diff --cached --quiet || git commit -m 'Generated TestPlan Excel Workbook'
          git push
