name: Agent7 Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/agent7_generate_xlsx.py'
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/agent7_testplan_data.json'
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/agent7_metadata.json'

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel Workbook
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan
          python agent7_generate_xlsx.py

      - name: Commit and push generated workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/Ethernet/Ethernet0/TestPlan/Ethernet_TestPlan_*.xlsx'
          git diff --cached --quiet || git commit -m 'Generated TestPlan Excel Workbook'
          git push
