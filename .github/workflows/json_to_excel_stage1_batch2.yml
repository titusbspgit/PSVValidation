name: JSON to Excel (Stage1 Batch2)

on:
  push:
    paths:
      - .github/workflows/json_to_excel_stage1_batch2.yml
      - scripts/json_to_excel.py
      - tools/json/payloads/Stage1_Batch2_GPIO.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2
      - name: Generate Excel from JSON
        env:
          JSON_INPUT_PATH: tools/json/payloads/Stage1_Batch2_GPIO.json
          OUTPUT_FILE_PATH: Test_Output/GPIO/TestPlan/
          OUTPUT_FILE_NAME: GPIO_TestPlan_WORKING.xlsx
        run: |
          python scripts/json_to_excel.py
      - name: Commit Excel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Final formatted Excel generated from JSON input
          file_pattern: Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
