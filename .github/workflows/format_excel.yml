name: Format GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/**'
      - 'tools/format_excel.py'
      - '.github/workflows/format_excel.yml'

jobs:
  format:
    if: "!contains(github.event.head_commit.message, ' TestPlan Generated and Pushed to Github')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz
      - name: Run formatter
        run: |
          python tools/format_excel.py \
            --input-dir "Test_Output/GPIO/TestPlan" \
            --output-rule "GPIO_TestPlan_<YYYYMMDD>_<HHMMSS>.xlsx"
      - name: Commit formatted Excel
        run: |
          if git status --porcelain | grep -E '\\.xlsx$'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m " TestPlan Generated and Pushed to Github"
            git push
          fi
