name: Generate GPIO Test Plan Excel (Fallback)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/json_to_excel_gpio.yml'
      - 'tools/generate_excel_from_json_gpio.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel from JSON
        run: |
          python tools/generate_excel_from_json_gpio.py

      - name: Commit Excel output
        run: |
          set -e
          FILEPATH=$(cat Test_Output/GPIO/TestPlan/generated_path.txt)
          echo "Generated file: $FILEPATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILEPATH"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push
