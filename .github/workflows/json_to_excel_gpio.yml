name: Generate GPIO Test Plan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_input.json'
      - '.github/workflows/json_to_excel_gpio.yml'
      - '.github/scripts/json_to_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (GPIO)
        run: |
          python .github/scripts/json_to_excel.py \
            --input "Test_Output/GPIO/TestPlan/GPIO_TestPlan_input.json" \
            --output-dir "Test_Output/GPIO/TestPlan" \
            --ip-name "GPIO" \
            --sheet-name "TestPlan"

      - name: Commit and push generated Excel
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Add auto-generated GPIO Test Plan Excel (single-sheet)"
            git push
          else
            echo "No changes to commit."
          fi
