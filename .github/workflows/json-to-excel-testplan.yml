name: Generate GPIO TestPlan Excel
on:
  push:
    branches:
      - chore/json-excel-testplan-**
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        id: gen
        run: |
          python tools/scripts/json_to_excel_testplan.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/${{ steps.gen.outputs.filename }}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add gpio TestPlan Excel generated on IST timestamp (${{ steps.gen.outputs.ist_pretty }})"
            git push
          fi
