name: Format GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/format_gpio_excel.yml'
      - '.github/scripts/format_gpio_excel.py'
      - 'Test_Output/GPIO/TestPlan/**'
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Run formatter
        run: |
          python .github/scripts/format_gpio_excel.py
      - name: Commit formatted Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx
          git commit -m "Format GPIO Test Plan Excel as per standards" || echo "No changes to commit"
          git push
