name: Stage1 Generate I2C TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - .github/testplan_artifacts/I2C_TestPlan.json
      - .github/scripts/stage1_generate_excel.py
      - .github/workflows/stage1_generate_i2c_testplan.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'feat(testplan): add I2C TestPlan generated') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (Stage1 formatting)
        env:
          INPUT_JSON_PATH: .github/testplan_artifacts/I2C_TestPlan.json
          OUTPUT_DIR: Test_Output/I2C/TestPlan
          IP_NAME: I2C
        run: |
          python .github/scripts/stage1_generate_excel.py

      - name: Commit formatted Excel
        run: |
          export TZ=Asia/Kolkata
          IST_NOW="$(date +'%Y-%m-%d %H:%M:%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/I2C/TestPlan/"*.xlsx
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
            exit 0
          fi
          git commit -m "feat(testplan): add I2C TestPlan generated (IST ${IST_NOW})"
          git push
