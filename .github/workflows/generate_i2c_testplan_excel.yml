name: Generate I2C TestPlan Excel

on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata

      - name: Generate Excel from JSON (I2C)
        run: |
          python tools/generate_i2c_testplan_excel.py

      - name: Read generated file path
        id: readpath
        run: |
          echo "file_path=$(cat .generated_excel_path.txt)" >> $GITHUB_OUTPUT

      - name: Commit and push Excel
        env:
          FILE_PATH: ${{ steps.readpath.outputs.file_path }}
        run: |
          if [ -f "$FILE_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE_PATH"
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          else
            echo "Generated file not found at $FILE_PATH" >&2
            exit 1
          fi
