name: Generate Ethernet3 TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_ethernet3_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        run: python Test_Output/Ethernet/Ethernet3/TestPlan/generate_testplan_excel.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/Ethernet/Ethernet3/TestPlan/*.xlsx"
          git status
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
