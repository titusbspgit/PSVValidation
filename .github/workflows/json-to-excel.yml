name: JSON to Excel (IST)

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/input.json'
      - 'tools/json_to_excel.py'
      - '.github/workflows/json-to-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install --upgrade pip openpyxl
      - name: Generate Excel from JSON (IST)
        run: |
          python tools/json_to_excel.py --input "Test_Output/GPIO/TestPlan/input.json" --ip-name "GPIO" --outdir "Test_Output/GPIO/TestPlan"
      - name: Commit and push Excel
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated Excel file from JSON input"
            git push
          fi
