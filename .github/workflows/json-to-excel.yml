name: JSON to Excel Generator\n\non:\n  push:\n    branches: [ main ]\n    paths:\n      - 'tools/json_to_excel.py'\n      - '.github/workflows/json-to-excel.yml'\n  workflow_dispatch: {}\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          persist-credentials: true\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.x'\n\n      - name: Install dependencies\n        run: |\n          python -m pip install --upgrade pip\n          pip install openpyxl\n\n      - name: Generate Excel from JSON\n        run: |\n          python tools/json_to_excel.py\n\n      - name: Commit Excel artifact if changed\n        run: |\n          git config user.name \'github-actions[bot]\'\n          git config user.email \'41898282+github-actions[bot]@users.noreply.github.com\'\n          if [ -n "$(git status --porcelain -- TestRepo/gpio/test_gpio_negedge_intr_en.xlsx)" ]; then\n            git add TestRepo/gpio/test_gpio_negedge_intr_en.xlsx\n            git commit -m "Add generated Excel file from JSON input"\n            git push origin HEAD:main\n          else\n            echo 'No changes to commit.'\n          fi\n