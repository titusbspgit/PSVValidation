name: JSON to Excel (GPIO)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/data/gpio_testcases.json
      - scripts/json_to_excel.py
      - .github/workflows/json-to-excel.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Convert JSON to Excel
        run: |
          python scripts/json_to_excel.py \
            --input .github/data/gpio_testcases.json \
            --output Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx

      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add autogenerated GPIO test plan Excel (GPIO_TestPlan_1.xlsx) from repo analysis"
            git push
          fi
