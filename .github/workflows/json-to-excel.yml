name: JSON to Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'data/input.json'
      - 'scripts/convert_json_to_xlsx.py'
      - '.github/workflows/json-to-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openpyxl
      - name: Run converter
        run: |
          python scripts/convert_json_to_xlsx.py
      - name: Commit Excel output
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "TestRepo/gpio/json_testing2.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated Excel file from JSON input"
            git push origin "${GITHUB_REF_NAME}"
          fi

