name: Generate JSON Excel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/json_to_excel.py"
      - ".github/workflows/json-to-excel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install --no-input --upgrade pip openpyxl

      - name: Generate Excel
        run: python scripts/json_to_excel.py

      - name: Commit and push Excel if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -E "^( M|\?\?)" >/dev/null; then
            git add "TestRepo/gpio/TESTER_JSON.xlsx"
            git commit -m "Add generated Excel file from JSON input"
            git push origin main
          else
            echo "No changes to commit"
