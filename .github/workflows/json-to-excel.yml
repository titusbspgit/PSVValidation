name: JSON to Excel (GPIO Test Plan)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/json_to_excel.py'
      - 'Test_Output/GPIO/TestPlan/input.json'
      - '.github/workflows/json-to-excel.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/json_to_excel.py Test_Output/GPIO/TestPlan/input.json Test_Output/GPIO/TestPlan/GPIO_TestPlan_new.xlsx
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/GPIO/TestPlan/GPIO_TestPlan_new.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[MPSoC-TestPlan] Add GPIO Test Plan Excel (auto-generated)"
            git push
          fi
