name: Generate GPIO TestPlan Excel (Stage1)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/gpio-testplan-stage1.yml
      - tools/gpio_stage1_generate.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Generate Stage1-formatted GPIO TestPlan Excel
        run: |
          python tools/gpio_stage1_generate.py

      - name: Commit Excel artifact
        run: |
          set -e
          FILE_PATH=$(cat .stage1_generated_path.txt)
          echo "Generated: $FILE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Add autogenerated GPIO Test Plan Excel (Stage1 formatted)" || echo "No changes to commit"
          git push
