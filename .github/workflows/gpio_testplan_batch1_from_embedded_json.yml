name: Generate GPIO TestPlan WORKING from embedded JSON (Batch 1)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gpio_testplan_batch1_from_embedded_json.yml
      - tools/generate_gpio_batch1_excel.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Generate Excel from embedded JSON
        run: |
          python tools/generate_gpio_batch1_excel.py

      - name: Commit final Excel only (if changed)
        run: |
          if [ -f "Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Final formatted Excel generated from JSON input"
              git push
            fi
          else
            echo "ERROR: Excel file not generated" >&2
            exit 1
          fi
