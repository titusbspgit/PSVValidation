name: Generate and Push GPIO TestPlan XLSX

on:
  push:
    paths:
      - .github/workflows/generate_push_testplan.yml
      - scripts/create_testplan_xlsx.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate XLSX
        run: |
          python scripts/create_testplan_xlsx.py

      - name: Commit and push XLSX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILE_PATH=$(cat generated_path.txt)
          TS=$(cat generated_timestamp.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Add GPIO TestPlan Excel autogenerated at $TS" || echo "No changes to commit."
          git push

