name: JSON to Excel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/json_to_xlsx.py"
      - ".github/workflows/json-to-xlsx.yml"
      - "data.json"

env:
  JSON_INPUT_PATH: data.json
  OUTPUT_FILE_NAME: employees.xlsx
  OUTPUT_FILE_PATH: Test_Output/PCIE
  BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          mkdir -p "${{ env.OUTPUT_FILE_PATH }}"
          python .github/scripts/json_to_xlsx.py \
            --input "${{ env.JSON_INPUT_PATH }}" \
            --output "${{ env.OUTPUT_FILE_PATH }}/${{ env.OUTPUT_FILE_NAME }}" \
            --sheet-name "Data"

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "${{ env.OUTPUT_FILE_PATH }}/${{ env.OUTPUT_FILE_NAME }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated Excel file from JSON input"
            git push origin "HEAD:${{ env.BRANCH }}"
          fi
