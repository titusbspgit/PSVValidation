name: Generate Excel from JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.json'
      - 'scripts/json_to_xlsx.py'
      - '.github/workflows/json-to-xlsx.yml'
  workflow_dispatch:
    inputs:
      input_json_path:
        description: 'Path to input JSON'
        required: false
        default: 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.json'
      output_xlsx_path:
        description: 'Path to output XLSX'
        required: false
        default: 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.xlsx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --upgrade pip openpyxl
      - name: Convert JSON to XLSX
        run: |
          IN="${{ github.event.inputs.input_json_path }}"
          OUT="${{ github.event.inputs.output_xlsx_path }}"
          if [ -z "$IN" ]; then IN="Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.json"; fi
          if [ -z "$OUT" ]; then OUT="Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.xlsx"; fi
          python scripts/json_to_xlsx.py "$IN" "$OUT"
      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated Excel file from JSON input"
            git push origin HEAD:main
          fi
