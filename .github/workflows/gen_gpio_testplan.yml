name: Generate GPIO TestPlan Excel (Stage1)

on:
  push:
    paths:
      - '.github/workflows/gen_gpio_testplan.yml'
      - 'tools/gen_testplan_excel.py'
      - 'tools/data/gpio_testplan.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel and Commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/gen_testplan_excel.py \
            --json tools/data/gpio_testplan.json \
            --ip GPIO \
            --outdir Test_Output/GPIO/TestPlan \
            --branch main > gen_env.txt

          source gen_env.txt
          echo "Generated: $OUTFILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTFILE"
          git commit -m "Add GPIO TestPlan (Stage1) autogenerated on $TIMESTAMP_IST" || echo "No changes to commit"
          git push || echo "No changes pushed"
