name: AI Generate GPIO TestPlan
on:
  push:
    branches: ["main"]
    paths:
      - 'tools/generate_gpio_testplan.py'
      - '.github/workflows/ai_generate_excel_gpio.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [ai-generate-excel-gpio]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/generate_gpio_testplan.py
