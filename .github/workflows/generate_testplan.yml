name: Generate Ethernet TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/generate_testplan.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python Test_Output/Ethernet/Ethernet0/TestPlan/generate_testplan.py

      - name: Commit generated Excel
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes"
          git push
