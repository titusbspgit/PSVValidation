name: Generate GPIO TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_testplan.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/GPIO/TestPlan
          python3 generate_testplan.py

      - name: Commit XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel"
          git push

      - name: Cleanup generator
        run: |
          git rm Test_Output/GPIO/TestPlan/generate_testplan.py
          git rm .github/workflows/generate_testplan.yml
          git commit -m "Cleanup: remove generator script and workflow"
          git push
