name: Generate TestPlan Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install --upgrade pip openpyxl
      - name: Generate Excel from JSON
        run: python tools/generate_testplan.py
      - name: Commit and push Excel
        run: |
          set -e
          FILE_PATH=$(cat Test_Output/GPIO/TestPlan/.last_generated_name)
          TS=$(cat Test_Output/GPIO/TestPlan/.last_generated_ts)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated GPIO testplan $TS"
            git push
          fi
