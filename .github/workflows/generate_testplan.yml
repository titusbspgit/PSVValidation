name: Generate and Commit TestPlan Excel

on:
  push:
    paths:
      - 'tools/json_input.json'
      - 'tools/generate_testplan.py'
      - '.github/workflows/generate_testplan.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan.py --input tools/json_input.json --output "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260511_000000.xlsx"
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260511_000000.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push origin "${GITHUB_REF#refs/heads/}"
          fi
