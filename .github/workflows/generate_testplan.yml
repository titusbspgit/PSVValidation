name: Generate and Commit TestPlan Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Write input.json
        run: |
          cat > input.json << 'JSON_EOF'
          {
            "json_data": [
              {
                "Index": "1",
                "SS / Module": "GPIO",
                "Feature": "AHB 32-bit register interface",
                "Test Case Name": "gpio_reg_wr_rd_test",
                "Test Description": "Validate GPIO register block by checking default reset values and verifying masked write/read behavior across a predefined register address list. The test iterates the unresolved register macro series MIZAR_GPIO_GP0_GPIO_8 through MIZAR_GPIO_GP0_GPIO_27, applies per-register write/read masks, writes data patterns, and confirms readback matches the expected value derived from masks and defaults. Test outcome is pass if no mismatches are detected; otherwise fail.",
                "Meta Test Description": "test_case(): calls chk_rst_val(); then calls chk_rd_wr(); finally calls finish(1) if (def_fail_cnt > 0 || wr_fail_cnt > 0) else finish(0).\n\nchk_rst_val():\n- for (i = 0; i < CNT; i++):\n  - addr = addr_array[i]  // addr_array contains {MIZAR_GPIO_GP0_GPIO_8 .. MIZAR_GPIO_GP0_GPIO_27}\n  - if (skip_rst_array[i] == 1): continue\n  - if (read_mask_array[i] == 0x00000000): continue\n  - data_rd = read_reg(addr)\n  - data = (data_rd & 0xfffffffe)\n  - if (data == default_value_array[i]): PASS else { def_fail_cnt++; printf failure }\n\nchk_rd_wr():\n- unsigned int chk_val[6] = {0xffffffff,0xaaaaaaaa,0x55555555,0xf5f5f5f5,0xA5A5A5A5,0xffff0000}\n- for each pattern j in chk_val:\n  - data_wr = chk_val[j]\n  - Write phase for all i in [0..CNT-1]:\n    - addr = addr_array[i]\n    - if (skip_array[i] == 1): continue\n    - if (write_mask_array[i] == 0x00000000): continue\n    - write_reg(addr, (data_wr & write_mask_array[i]))\n  - Read/verify phase for all i in [0..CNT-1]:\n    - addr = addr_array[i]\n    - if (skip_array[i] == 1): continue\n    - if (write_mask_array[i] == 0x00000000): continue\n    - if (read_mask_array[i] == 0x00000000): continue\n    - data_rd = (read_reg(addr) & read_mask_array[i])\n    - wr_n = (write_mask_array[i] ^ 0xffffffff)\n    - exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i]))\n    - if (data_rd == exp_val) PASS else { wr_fail_cnt++; printf failure }\n\nsoft_reset_chk(): disabled under #ifdef 0; would write/read SOFT_RST_REG_ADDRESS with SOFT_RST_REG_DATA and waits if enabled.",
                "Speed": "NA",
                "Mode": "NA",
                "Memory Start Offset": "NA",
                "Memory End Offset": "NA",
                "Remarks": "Commented note in source: when reading default values the DIN value can become 1 automatically if not forced; forcing zero to DIN may set level select high causing read mismatch against expected.",
                "Test Steps / Procedure": "1. Initialize test by preparing the register address list and associated default, read-mask, and write-mask tables for the GPIO block (addresses unresolved).\n2. For each address in the list, if readable by mask, read the register and compare the masked value against the expected default; record any mismatches.\n3. For each of six data patterns, write masked values to each writable register address in the list, skipping those marked to skip or not writable.\n4. Read back each addressed register using the read mask and compute the expected value from the previous write, the write mask, and the default; record any mismatches.\n5. Declare test PASS if no default-value mismatches and no write-read mismatches were recorded; otherwise declare FAIL.",
                "Meta Test Steps / Procedure": "1) test_case():\n   - chk_rst_val();\n   - chk_rd_wr();\n   - if (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0);\n\n2) chk_rst_val():\n   - for (i = 0; i < CNT; i++):\n     - addr = addr_array[i]  // addr_array uses {MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_GPIO_9, ..., MIZAR_GPIO_GP0_GPIO_27}\n     - if (skip_rst_array[i] == 1) continue;\n     - if (read_mask_array[i] == 0x00000000) continue;\n     - data_rd = read_reg(addr);\n     - data = (data_rd & 0xfffffffe);\n     - if (data == default_value_array[i]) PASS else { def_fail_cnt++; printf failure };\n\n3) chk_rd_wr():\n   - chk_val = {0xffffffff,0xaaaaaaaa,0x55555555,0xf5f5f5f5,0xA5A5A5A5,0xffff0000};\n   - for each data_wr in chk_val:\n     - Write loop for i in [0..CNT-1]:\n       - addr = addr_array[i]; if (skip_array[i] == 1) continue;\n       - if (write_mask_array[i] == 0x00000000) continue;\n       - write_reg(addr, (data_wr & write_mask_array[i]));\n     - Read/verify loop for i in [0..CNT-1]:\n       - addr = addr_array[i]; if (skip_array[i] == 1) continue;\n       - if (write_mask_array[i] == 0x00000000) continue;\n       - if (read_mask_array[i] == 0x00000000) continue;\n       - data_rd = (read_reg(addr) & read_mask_array[i]);\n       - wr_n = (write_mask_array[i] ^ 0xffffffff);\n       - exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i]));\n       - if (data_rd == exp_val) PASS else { wr_fail_cnt++; printf failure };\n\n4) soft_reset_chk(): disabled under #ifdef 0; would interact with SOFT_RST_REG_ADDRESS and SOFT_RST_REG_DATA if enabled.",
                "Impacted Registers": "UNRESOLVED(MIZAR_GPIO_GP0_GPIO_8); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_9); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_10); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_11); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_12); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_13); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_14); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_15); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_16); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_17); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_18); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_19); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_20); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_21); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_22); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_23); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_24); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_25); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_26); UNRESOLVED(MIZAR_GPIO_GP0_GPIO_27); UNRESOLVED(GPIO_GP0_GPIO_8_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_9_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_10_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_11_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_12_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_13_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_14_DEFAULT VAL); UNRESOLVED(GPIO_GP0_GPIO_15_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_16_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_17_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_18_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_19_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_20_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_21_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_22_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_23_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_24_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_25_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_26_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_27_DEFAULT_VAL); UNRESOLVED(GPIO_GP0_GPIO_8_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_9_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_10_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_11_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_12_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_13_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_14_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_15_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_16_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_17_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_18_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_19_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_20_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_21_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_22_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_23_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_24_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_25_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_26_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_27_READ_MASK); UNRESOLVED(GPIO_GP0_GPIO_8_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_9_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_10_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_11_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_12_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_13_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_14_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_15_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_16_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_17_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_18_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_19_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_20_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_21_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_22_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_23_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_24_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_25_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_26_WRITE_MASK); UNRESOLVED(GPIO_GP0_GPIO_27_WRITE_MASK",
                "Meta Impacted Registers": "MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_GPIO_9; MIZAR_GPIO_GP0_GPIO_10; MIZAR_GPIO_GP0_GPIO_11; MIZAR_GPIO_GP0_GPIO_12; MIZAR_GPIO_GP0_GPIO_13; MIZAR_GPIO_GP0_GPIO_14; MIZAR_GPIO_GP0_GPIO_15; MIZAR_GPIO_GP0_GPIO_16; MIZAR_GPIO_GP0_GPIO_17; MIZAR_GPIO_GP0_GPIO_18; MIZAR_GPIO_GP0_GPIO_19; MIZAR_GPIO_GP0_GPIO_20; MIZAR_GPIO_GP0_GPIO_21; MIZAR_GPIO_GP0_GPIO_22; MIZAR_GPIO_GP0_GPIO_23; MIZAR_GPIO_GP0_GPIO_24; MIZAR_GPIO_GP0_GPIO_25; MIZAR_GPIO_GP0_GPIO_26; MIZAR_GPIO_GP0_GPIO_27; GPIO_GP0_GPIO_8_DEFAULT_VAL; GPIO_GP0_GPIO_9_DEFAULT_VAL; GPIO_GP0_GPIO_10_DEFAULT_VAL; GPIO_GP0_GPIO_11_DEFAULT_VAL; GPIO_GP0_GPIO_12_DEFAULT_VAL; GPIO_GP0_GPIO_13_DEFAULT_VAL; GPIO_GP0_GPIO_14_DEFAULT_VAL; GPIO_GP0_GPIO_15_DEFAULT_VAL; GPIO_GP0_GPIO_16_DEFAULT_VAL; GPIO_GP0_GPIO_17_DEFAULT_VAL; GPIO_GP0_GPIO_18_DEFAULT_VAL; GPIO_GP0_GPIO_19_DEFAULT_VAL; GPIO_GP0_GPIO_20_DEFAULT_VAL; GPIO_GP0_GPIO_21_DEFAULT_VAL; GPIO_GP0_GPIO_22_DEFAULT_VAL; GPIO_GP0_GPIO_23_DEFAULT_VAL; GPIO_GP0_GPIO_24_DEFAULT_VAL; GPIO_GP0_GPIO_25_DEFAULT_VAL; GPIO_GP0_GPIO_26_DEFAULT_VAL; GPIO_GP0_GPIO_27_DEFAULT_VAL; GPIO_GP0_GPIO_8_READ_MASK; GPIO_GP0_GPIO_9_READ_MASK; GPIO_GP0_GPIO_10_READ_MASK; GPIO_GP0_GPIO_11_READ_MASK; GPIO_GP0_GPIO_12_READ_MASK; GPIO_GP0_GPIO_13_READ_MASK; GPIO_GP0_GPIO_14_READ_MASK; GPIO_GP0_GPIO_15_READ_MASK; GPIO_GP0_GPIO_16_READ_MASK; GPIO_GP0_GPIO_17_READ_MASK; GPIO_GP0_GPIO_18_READ_MASK; GPIO_GP0_GPIO_19_READ_MASK; GPIO_GP0_GPIO_20_READ_MASK; GPIO_GP0_GPIO_21_READ_MASK; GPIO_GP0_GPIO_22_READ_MASK; GPIO_GP0_GPIO_23_READ_MASK; GPIO_GP0_GPIO_24_READ_MASK; GPIO_GP0_GPIO_25_READ_MASK; GPIO_GP0_GPIO_26_READ_MASK; GPIO_GP0_GPIO_27_READ_MASK; GPIO_GP0_GPIO_8_WRITE_MASK; GPIO_GP0_GPIO_9_WRITE_MASK; GPIO_GP0_GPIO_10_WRITE_MASK; GPIO_GP0_GPIO_11_WRITE_MASK; GPIO_GP0_GPIO_12_WRITE_MASK; GPIO_GP0_GPIO_13_WRITE_MASK; GPIO_GP0_GPIO_14_WRITE_MASK; GPIO_GP0_GPIO_15_WRITE_MASK; GPIO_GP0_GPIO_16_WRITE_MASK; GPIO_GP0_GPIO_17_WRITE_MASK; GPIO_GP0_GPIO_18_WRITE_MASK; GPIO_GP0_GPIO_19_WRITE_MASK; GPIO_GP0_GPIO_20_WRITE_MASK; GPIO_GP0_GPIO_21_WRITE_MASK; GPIO_GP0_GPIO_22_WRITE_MASK; GPIO_GP0_GPIO_23_WRITE_MASK; GPIO_GP0_GPIO_24_WRITE_MASK; GPIO_GP0_GPIO_25_WRITE_MASK; GPIO_GP0_GPIO_26_WRITE_MASK; GPIO_GP0_GPIO_27_WRITE_MASK",
