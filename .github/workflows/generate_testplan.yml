name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/generate_testplan_excel.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python .github/scripts/generate_testplan_excel.py

      - name: Commit and push generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/LPDDR4/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
