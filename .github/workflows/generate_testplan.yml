      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate workbook
        run: |
          python scripts/generate_testplan_excel.py | tee generated_path.txt

      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f generated_path.txt ]; then
            GEN_PATH=$(cat generated_path.txt | tail -n 1)
            if [ -f "$GEN_PATH" ]; then
              git add "$GEN_PATH"
              git diff --staged --quiet || git commit -m "Added generated TestPlan Excel"
              git push origin main
              echo "Committed $GEN_PATH"
            else
              echo "Generated file not found: $GEN_PATH" && exit 1
            fi
          else
            echo "generated_path.txt not found" && exit 1
          fi
