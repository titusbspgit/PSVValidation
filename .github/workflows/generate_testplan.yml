name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate_testplan.yml'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python .github/scripts/generate_testplan_excel.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel"
          git push origin main
