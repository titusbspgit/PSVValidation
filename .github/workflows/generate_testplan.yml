name: Generate and Commit TestPlan Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel
        run: |
          python scripts/generate_testplan.py

      - name: Commit generated workbook
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
