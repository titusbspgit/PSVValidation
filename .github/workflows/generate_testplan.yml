name: Generate USB TestPlan Excel
on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_testplan.py'
      - 'Test_Output/USB/TestPlan/run_generator.py'
      - '.github/workflows/generate_testplan.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate XLSX
        run: |
          cd Test_Output/USB/TestPlan
          python generate_testplan.py
          ls -la *.xlsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/USB/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
