name: Generate TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_excel.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python Test_Output/USB/TestPlan/generate_excel.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Output/USB/TestPlan/*.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
