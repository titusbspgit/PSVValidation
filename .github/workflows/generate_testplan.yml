name: Generate PCIE TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_testplan.yml
      - .github/scripts/generate_testplan.py
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Generate Excel from JSON
        run: |
          python .github/scripts/generate_testplan.py

      - name: Commit Excel
        run: |
          git config user.name "Ag-Emb-Mpsoc-Stage1"
          git config user.email "noreply@agent.local"
          git add Test_Output/PCIE/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
