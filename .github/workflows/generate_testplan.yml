name: Generate and commit PCIE TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_testplan.yml'
      - 'tools/generate_testplan.py'
      - 'tools/testplan_payload.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan.py
      - name: Debug listing and verify XLSX
        run: |
          set -e
          echo "Workspace root: $(pwd)"
          echo "--- .gitignore (if present) ---"; (test -f .gitignore && cat .gitignore) || echo "(none)"
          echo "--- Tree under Test_Output ---"
          mkdir -p Test_Output || true
          find Test_Output -maxdepth 4 -type f -printf "%p\n" || true
          echo "--- last_output_path.txt content ---"
          cat tools/last_output_path.txt
          FILE=$(cat tools/last_output_path.txt)
          echo "git check-ignore -v $FILE (if ignored):"; git check-ignore -v "$FILE" || true
          python - << 'PY'
import sys, zipfile, os
p = open('tools/last_output_path.txt','r',encoding='utf-8').read().strip()
assert os.path.isfile(p), f"Not found: {p}"
assert zipfile.is_zipfile(p), f"Not a zip-based xlsx: {p}"
with zipfile.ZipFile(p,'r') as z:
    names = set(z.namelist())
    assert '[Content_Types].xml' in names, 'Missing [Content_Types].xml'
    assert 'xl/workbook.xml' in names, 'Missing xl/workbook.xml'
print('XLSX structure verified for', p)
PY
      - name: Show git status before commit
        run: |
          git status --porcelain
      - name: Commit Excel (force add if ignored)
        run: |
          set -e
          OUTPUT_PATH=$(cat tools/last_output_path.txt)
          echo "Output path: $OUTPUT_PATH"
          if [ -f "$OUTPUT_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$OUTPUT_PATH"
            git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
            git push
          else
            echo "Output file not found at $OUTPUT_PATH"
            exit 1
