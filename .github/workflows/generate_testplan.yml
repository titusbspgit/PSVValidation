name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_testplan.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install openpyxl
      
      - name: Generate Excel
        run: python Test_Output/PCIE/TestPlan/generate_testplan.py
      
      - name: Commit and push
        run: |
          cd Test_Output/PCIE/TestPlan
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
