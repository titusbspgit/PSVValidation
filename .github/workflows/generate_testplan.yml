name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "data/final_testplan.json"
      - "tools/generate_testplan.py"
      - ".github/workflows/generate_testplan.yml"
      - "ci/triggers/**"

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl

      - name: Generate Excel from JSON
        env:
          JSON_PATH: data/final_testplan.json
          OUTPUT_DIR: TestOutput/PCIE/TestPlan
          SOURCE_OWNER: titusbspgit
          SOURCE_REPO: PSVValidation
          SOURCE_BRANCH: main
          SOURCE_SUBDIR: TestRepo/pcie
          IP_NAME: PCIE
          TOTAL_TESTCASES: '7'
        run: |
          python tools/generate_testplan.py

      - name: Commit and push generated Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TestOutput/PCIE/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push origin HEAD:main
          fi
