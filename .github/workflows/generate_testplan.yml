name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_excel.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Excel
        run: python Test_Output/GPIO/TestPlan/generate_excel.py

      - name: Commit Excel
        run: |
          cd Test_Output/GPIO/TestPlan
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
