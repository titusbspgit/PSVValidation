name: Generate LPDDR4 TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/TestPlan/generate_excel.py'

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: |
          cd Test_Output/TestPlan
          python generate_excel.py

      - name: Commit and push Excel file
        run: |
          cd Test_Output/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel"
          git push
