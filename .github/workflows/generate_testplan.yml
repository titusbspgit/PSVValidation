name: Generate TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_testplan.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Excel
        run: python Test_Output/GPIO/TestPlan/generate_testplan.py

      - name: Remove generator script
        run: rm -f Test_Output/GPIO/TestPlan/generate_testplan.py

      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git rm --cached Test_Output/GPIO/TestPlan/generate_testplan.py || true
          git commit -m "Added generated TestPlan Excel"
          git push
