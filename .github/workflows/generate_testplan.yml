                "Meta Validation / Acceptance Criteria": "- Default check: for each i, data = (read_reg(addr_array[i]) & 0xfffffffe); pass if data == default_value_array[i]; else def_fail_cnt++.\n- Write/Read check for each pattern in {0xffffffff,0xaaaaaaaa,0x55555555,0xf5f5f5f5,0xA5A5A5A5,0xffff0000} and each i:\n  - Only if (write_mask_array[i] != 0) and (read_mask_array[i] != 0) and skip_array[i] == 0.\n  - data_rd = (read_reg(addr_array[i]) & read_mask_array[i]).\n  - wr_n = (write_mask_array[i] ^ 0xffffffff).\n  - exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])).\n  - pass if (data_rd == exp_val); else wr_fail cnt++.\n- Final decision: finish(1) if (def_fail_cnt > 0 || wr_fail_cnt > 0); else finish(0).",
