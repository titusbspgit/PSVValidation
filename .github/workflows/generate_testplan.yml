name: Generate TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/Testing_new_usecase/TestPlan/generate_testplan.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        run: python Test_Output/Testing_new_usecase/TestPlan/generate_testplan.py

      - name: Commit and push Excel
        run: |
          cd Test_Output/Testing_new_usecase/TestPlan/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
