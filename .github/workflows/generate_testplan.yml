name: Generate GPIO TestPlan XLSX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2
      - name: Generate XLSX
        run: |
          python tools/generate_testplan.py
          echo "Generated: $(cat tools/last_output_path.txt)"
      - name: Commit XLSX
        run: |
          set -e
          OUT=$(cat tools/last_output_path.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Final formatted Excel generated from JSON input" || exit 0
          git push
