name: Generate GPIO TestPlan Excel

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_testplan.py
      - .github/workflows/generate_testplan.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from embedded JSON
        id: gen
        run: |
          python scripts/generate_testplan.py --ip "GPIO" --output-dir "Test_Output/GPIO/TestPlan"

      - name: Commit final Excel only
        run: |
          set -e
          FILE_PATH="${{ steps.gen.outputs.output_path }}"
          echo "Committing: ${FILE_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "${FILE_PATH}"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push
