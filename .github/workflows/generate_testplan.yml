name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_testplan.yml'
      - 'scripts/generate_testplan_excel.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel
        run: |
          python scripts/generate_testplan_excel.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel [skip ci]"
            git push origin main
          fi
