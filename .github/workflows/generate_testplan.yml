name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestOutput/PCIE/TestPlan/input/testplan_input.json'
      - 'scripts/generate_testplan.py'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        env:
          TP_INPUT_JSON: ${{ github.workspace }}/TestOutput/PCIE/TestPlan/input/testplan_input.json
          TP_OUTPUT_DIR: ${{ github.workspace }}/TestOutput/PCIE/TestPlan
        run: |
          python scripts/generate_testplan.py | tee excel_path.txt

      - name: Commit Excel
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add TestOutput/PCIE/TestPlan/testplan_*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
