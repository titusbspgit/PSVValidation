name: Generate Ethernet1 TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet1/TestPlan/gen_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        working-directory: Test_Output/Ethernet/Ethernet1/TestPlan
        run: python gen_testplan.py

      - name: Commit and push Excel file
        run: |
          cd Test_Output/Ethernet/Ethernet1/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push

      - name: Clean up generator script
        run: |
          cd Test_Output/Ethernet/Ethernet1/TestPlan
          rm -f gen_testplan.py
          git add -A
          git commit -m "Remove temporary generator script" || echo "No changes"
          git push
