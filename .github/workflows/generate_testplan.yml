name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate_testplan.yml
      - scripts/generate_testplan.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan.py
      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/PCIE/TestPlan/PCIE_TestPlan_20260511_000000.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
