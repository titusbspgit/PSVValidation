name: Generate TestPlan Excel\n\non:\n  push:\n    paths:\n      - 'Test_Output/USB/TestPlan/generate_excel.py'\n\njobs:\n  generate:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Install dependencies\n        run: pip install openpyxl\n      - name: Generate Excel\n        run: python Test_Output/USB/TestPlan/generate_excel.py\n      - name: Commit and push\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email 'github-actions[bot]@users.noreply.github.com'\n          git add Test_Output/USB/TestPlan/*.xlsx\n          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'\n          git push\n