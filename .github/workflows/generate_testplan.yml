name: Generate GPIO TestPlan from JSON (fallback)

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan.py'
      - '.github/workflows/generate_testplan.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      IP_NAME: GPIO
      OUTPUT_DIR: Test_Output/GPIO/TestPlan
      COMMIT_CHANGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate and commit Excel
        run: |
          python3 scripts/generate_testplan.py
