name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/testplan.json'
      - 'scripts/gen_testplan.py'
      - '.github/workflows/generate_testplan.yml'

permissions:
  contents: write

jobs:
  build-testplan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          TZ: Asia/Kolkata
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
          IP_NAME: PCIE
        run: |
          python scripts/gen_testplan.py \
            --json automation/testplan.json \
            --output-dir "$OUTPUT_DIR" \
            --ip-name "$IP_NAME"

      - name: Validate XLSX (ZIP structure)
        env:
          TZ: Asia/Kolkata
        run: |
          set -e
          latest_file=$(ls -1t Test_Output/PCIE/TestPlan/PCIE_TestPlan_*.xlsx | head -n1)
          echo "Latest generated file: $latest_file"
          echo "LATEST=$latest_file" >> "$GITHUB_ENV"
          python - << 'PY'
import os, zipfile, sys
p = os.environ['LATEST']
if not zipfile.is_zipfile(p):
    print('Not a valid XLSX (zip) ->', p)
    sys.exit(1)
print('Validated XLSX zip structure:', p)
PY

      - name: Commit Excel
        if: success()
        run: |
          latest_file=$(ls -1t Test_Output/PCIE/TestPlan/PCIE_TestPlan_*.xlsx | head -n1)
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$latest_file"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push || echo "Nothing to push"
