name: Generate and commit PCIE TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_testplan.yml'
      - 'tools/generate_testplan.py'
      - 'tools/testplan_payload.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan.py
      - name: Commit Excel
        run: |
          set -e
          OUTPUT_PATH=$(cat tools/last_output_path.txt)
          echo "Output path: $OUTPUT_PATH"
          if [ -f "$OUTPUT_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$OUTPUT_PATH"
            git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
            git push
          else
            echo "Output file not found at $OUTPUT_PATH"
            exit 1

