name: Generate and commit TestPlan XLSX

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_testplan.py'
      - '.github/workflows/generate_testplan.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Generate TestPlan Excel
        run: |
          python tools/generate_testplan.py

      - name: Commit Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260512_000000.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
