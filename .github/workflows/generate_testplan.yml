name: Generate GPIO TestPlan Excel
on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_testplan.py'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        id: gen
        run: |
          cd $GITHUB_WORKSPACE
          output=$(python Test_Output/GPIO/TestPlan/generate_testplan.py)
          filepath=$(echo "$output" | grep "GENERATED:" | cut -d: -f2-)
          filename=$(echo "$output" | grep "FILENAME:" | cut -d: -f2-)
          echo "filepath=$filepath" >> $GITHUB_OUTPUT
          echo "filename=$filename" >> $GITHUB_OUTPUT
      - name: Commit Excel and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/*.xlsx"
          git rm "Test_Output/GPIO/TestPlan/generate_testplan.py"
          git rm ".github/workflows/generate_testplan.yml"
          git commit -m "Added generated TestPlan Excel"
          git push
