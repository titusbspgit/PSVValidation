name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - '.github/scripts/generate_pcie_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        id: generate
        run: |
          python .github/scripts/generate_pcie_testplan.py | tee output.log
          echo "filename=$(grep FILENAME= output.log | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "output_path=$(grep OUTPUT_PATH= output.log | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/PCIE/TestPlan/*.xlsx"
          git commit -m "Added generated TestPlan Excel"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCIE-TestPlan
          path: ${{ steps.generate.outputs.output_path }}
