name: Generate MIPI_DSI TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        id: generate
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_testplan.py
          XLSX_FILE=$(ls -t MIPI_DSI_TestPlan_*.xlsx | head -1)
          echo "xlsx_file=$XLSX_FILE" >> $GITHUB_OUTPUT
          echo "Generated: $XLSX_FILE"

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd Test_Output/MIPI/TestPlan
          XLSX_FILE=${{ steps.generate.outputs.xlsx_file }}
          git add "$XLSX_FILE"
          git commit -m "Added generated TestPlan Excel: $XLSX_FILE"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testplan-excel
          path: Test_Output/MIPI/TestPlan/MIPI_DSI_TestPlan_*.xlsx
