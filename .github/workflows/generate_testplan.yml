name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_testplan.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        run: python Test_Output/GPIO/TestPlan/generate_testplan.py

      - name: Commit generated Excel
        run: |
          cd Test_Output/GPIO/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push

      - name: Cleanup generator script
        run: |
          git rm Test_Output/GPIO/TestPlan/generate_testplan.py
          git rm .github/workflows/generate_testplan.yml
          git commit -m "Cleanup: remove generator script and workflow after Excel generation"
          git push
