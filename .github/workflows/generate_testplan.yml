name: Generate LPDDR4 TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/LPDDR4/TestPlan/generate_testplan.py'
      - '.github/workflows/generate_testplan.yml'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        run: python Test_Output/LPDDR4/TestPlan/generate_testplan.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/LPDDR4/TestPlan/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push

      - name: Cleanup generator script
        run: |
          cd Test_Output/LPDDR4/TestPlan/
          git rm generate_testplan.py
          git commit -m "Cleanup: Remove generator script after Excel generation" || echo "No changes to commit"
          git push
