name: Generate GPIO Test Plan XLSX (Stage1)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_testplan_xlsx.py'
      - '.github/workflows/generate_testplan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          BRANCH: main
        run: |
          python scripts/generate_testplan_xlsx.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --staged --quiet; then
            echo "No XLSX changes to commit";
          else
            git commit -m "Add GPIO Test Plan (Stage1): Final formatted Excel generated from JSON input"
            git push origin HEAD:main
          fi
