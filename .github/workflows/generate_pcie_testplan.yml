name: Generate PCIE TestPlan XLSX

on:
  push:
    paths:
      - '.github/workflows/generate_pcie_testplan.yml'
      - 'Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250717_120000_generator.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: python Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250717_120000_generator.py

      - name: Verify XLSX
        run: |
          ls -la Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250717_120000.xlsx
          python -c "from openpyxl import load_workbook; wb=load_workbook('Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250717_120000.xlsx'); print('Sheets:', wb.sheetnames); print('TestPlan rows:', wb['TestPlan'].max_row-1); print('MetaData rows:', wb['MetaData'].max_row-1); print('VALIDATION PASSED')"

      - name: Commit and push XLSX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250717_120000.xlsx
          git diff --cached --quiet || git commit -m 'Added generated PCIE TestPlan Excel - PCIE_TestPlan_20250717_120000.xlsx'
          git push
