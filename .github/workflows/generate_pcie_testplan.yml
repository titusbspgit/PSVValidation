name: Generate PCIE TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250716_174500_generator.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: python Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250716_174500_generator.py

      - name: Commit XLSX
        run: |
          cd Test_Output/PCIE/TestPlan/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PCIE_TestPlan_20250716_174500.xlsx
          git commit -m "Added generated TestPlan Excel - PCIE_TestPlan_20250716_174500.xlsx"
          git push

      - name: Cleanup generator
        run: |
          git rm Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250716_174500_generator.py
          git rm .github/workflows/generate_pcie_testplan.yml
          git commit -m "Cleanup: remove generator script and workflow"
          git push
