name: Generate PCIE TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/.generator/PCIE_TestPlan_20260824_161300_generator.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: python Test_Output/PCIE/TestPlan/.generator/PCIE_TestPlan_20260824_161300_generator.py

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/PCIE_TestPlan_20260824_161300.xlsx
          git commit -m "Added generated PCIE TestPlan Excel workbook - PCIE_TestPlan_20260824_161300.xlsx" || echo "No changes to commit"
          git push
