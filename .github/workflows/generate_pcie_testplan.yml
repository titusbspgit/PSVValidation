name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python Test_Output/PCIE/TestPlan/generate_testplan.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/PCIE/TestPlan/
          XLSX_FILE=$(ls -t PCIE_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Generated file: $XLSX_FILE"
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/PCIE/TestPlan/$XLSX_FILE"
          git rm -f Test_Output/PCIE/TestPlan/generate_testplan.py || true
          git rm -f .github/workflows/generate_pcie_testplan.yml || true
          git commit -m "Added generated TestPlan Excel: $XLSX_FILE"
          git push
