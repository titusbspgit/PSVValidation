name: Generate PCIE TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/PCIE/TestPlan/FULL_JSON_STRUCTURE.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        run: |
          python scripts/gen_testplan_excel.py --json Test_Output/PCIE/TestPlan/FULL_JSON_STRUCTURE.json --outdir Test_Output/PCIE/TestPlan --ipname PCIE
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ts=$(python - <<'PY'
from datetime import datetime
try:
    from zoneinfo import ZoneInfo
except Exception:
    ZoneInfo = None
from datetime import timezone, timedelta
if ZoneInfo:
    tz = ZoneInfo('Asia/Kolkata')
else:
    tz = timezone(timedelta(hours=5, minutes=30))
print(datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S IST'))
PY
)
          git add Test_Output/PCIE/TestPlan/*.xlsx || true
          if git commit -m "Add PCIE TestPlan ${ts}"; then
            git push
          else
            echo "No changes to commit"
          fi
