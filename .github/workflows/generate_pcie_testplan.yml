name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/.generator/generate_xlsx.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        id: generate
        run: |
          cd Test_Output/PCIE/TestPlan
          python .generator/generate_xlsx.py 2>&1 | tee output.log
          FILENAME=$(grep 'GENERATED:' output.log | cut -d: -f2)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Commit and push Excel file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          FILENAME=${{ steps.generate.outputs.filename }}
          git add "Test_Output/PCIE/TestPlan/$FILENAME"
          git commit -m "Added generated TestPlan Excel"
          git push
