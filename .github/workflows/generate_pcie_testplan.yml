name: Generate PCIE TestPlan Excel
on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_pcie_testplan.py'
      - 'Test_Output/PCIE/TestPlan/PCIE_TestPlan_*_data.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate Excel
        run: python Test_Output/PCIE/TestPlan/generate_pcie_testplan.py
      - name: Commit Excel
        run: |
          cd Test_Output/PCIE/TestPlan
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Auto-generated PCIE TestPlan Excel workbook" || echo "No changes"
          git push
