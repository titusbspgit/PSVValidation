name: Generate PCIE Test Plan Excel

on:
  push:
    paths:
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_pcie_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_testplan_excel.py
      - name: Commit Excel
        shell: bash
        run: |
          FNAME=$(cat .testplan_fname)
          TS=$(cat .testplan_ts)
          if [ ! -f "$FNAME" ]; then
            echo "Expected Excel file not found: $FNAME" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FNAME"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add PCIE Test Plan Excel generated on $TS"
            git push
          fi
