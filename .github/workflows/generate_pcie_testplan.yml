name: Generate PCIE TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_final_xlsx.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate XLSX
        run: python Test_Output/PCIE/TestPlan/generate_final_xlsx.py
      - name: Commit and push XLSX
        run: |
          cd Test_Output/PCIE/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes"
          git push
