name: Generate PCIE TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_pcie_testplan.yml
      - scripts/gen_pcie_testplan.py

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python scripts/gen_pcie_testplan.py

      - name: Read generated path and IST timestamp
        id: info
        run: |
          FILEPATH=$(cat generated_path.txt)
          IST_TS=$(cat ist_timestamp.txt)
          echo "file_path=$FILEPATH" >> $GITHUB_OUTPUT
          echo "ist_ts=$IST_TS" >> $GITHUB_OUTPUT

      - name: Commit Excel file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Ag-Emb-Mpsoc-Stage1"
          git config user.email "actions@localhost"
          git add "${{ steps.info.outputs.file_path }}"
          git commit -m "Add PCIE TestPlan Excel generated on IST ${{ steps.info.outputs.ist_ts }}" || echo "No changes to commit"
          git push
