name: Generate PCIE TestPlan XLSX

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_PCIE_TestPlan_20250710.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/PCIE/TestPlan
          python3 generate_PCIE_TestPlan_20250710.py
          ls -la *.xlsx

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Output/PCIE/TestPlan/PCIE_TestPlan_20250710_033000.xlsx
          git commit -m 'Added generated PCIE TestPlan Excel workbook'
          git push
