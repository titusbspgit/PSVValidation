name: Generate PCIE TestPlan Excel
on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_excel.py'
    branches: [main]
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate Excel
        run: |
          cd Test_Output/PCIE/TestPlan
          python generate_excel.py
      - name: Commit Excel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/PCIE/TestPlan/*.xlsx'
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
