name: Generate PCIE TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_pcie_testplan.py'
      - 'Test_Output/PCIE/TestPlan/pcie_testcases.json'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: python Test_Output/PCIE/TestPlan/generate_pcie_testplan.py

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/*.xlsx
          git rm Test_Output/PCIE/TestPlan/generate_pcie_testplan.py || true
          git rm Test_Output/PCIE/TestPlan/pcie_testcases.json || true
          git rm .github/workflows/generate_pcie_testplan.yml || true
          git commit -m "Added generated PCIE TestPlan Excel - Auto-generated by Agent 7"
          git push
