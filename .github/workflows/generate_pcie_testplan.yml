name: Generate PCIE TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_pcie_testplan.yml'
      - 'tools/generate_testplan_excel.py'
      - 'Test_Input/PCIE/pcie_testplan_input.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        env:
          INPUT_JSON_PATH: Test_Input/PCIE/pcie_testplan_input.json
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
          IP_NAME: PCIE
        run: |
          python tools/generate_testplan_excel.py

      - name: Commit Excel
        env:
          IP_NAME: PCIE
        run: |
          set -e
          FILE=$(ls -t Test_Output/PCIE/TestPlan/${IP_NAME}_TestPlan_*.xlsx | head -n1)
          if [ -n "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
