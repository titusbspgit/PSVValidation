name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - '.github/scripts/excel_generator_pcie.py'
      - '.github/workflows/generate_pcie_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Generate xlsx
        id: gen
        env:
          TZ: Asia/Kolkata
        run: |
          python .github/scripts/excel_generator_pcie.py

      - name: Commit generated xlsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes"
          git push
