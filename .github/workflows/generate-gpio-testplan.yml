name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate-gpio-testplan.yml
      - .github/scripts/generate_testplan_xlsx.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Stage1-formatted Excel
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python .github/scripts/generate_testplan_xlsx.py

      - name: Commit and push Excel
        run: |
          set -e
          FILE=$(ls -1t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1)
          echo "Committing $FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Final formatted Excel generated from JSON input"
          git push
