name: Generate GPIO TestPlan

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-gpio-testplan.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel TestPlan
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          # Input constants
          owner = "titusbspgit"
          repo = "PSVValidation"
          branch = "main"
          output_directory = "Test_Output/GPIO/TestPlan/"
          ip_name = "GPIO"

          final_json = [
            {
              "Index": "1",
              "SS / Module": "GPIO",
              "Feature": "NA",
              "Test Case Name": "gpio_reg_wr_rd_test",
              "Test Description": "Verify write/read integrity of GPIO GP0 registers gp0_gpio_8 through gp0_gpio_27.",
              "Meta Test Description": "Register write/read verification for GPIO GP0 register block. Resolved addresses use base 0xA001A000 with offsets 0x0 to 0x4C for MIZAR_GPIO_GP0_GPIO_8 to MIZAR_GPIO_GP0_GPIO_27 per provided resolution data. SOFT_RST_REG_ADDRESS is present but unresolved in the provided data. The test iterates the resolved registers, performs writes, reads back, and compares results to confirm data retention.",
              "Speed": "NA",
              "Mode": "NA",
              "Memory Start Offset": "0x0",
              "Memory End Offset": "0x4C",
              "Remarks": "NA",
              "Test Steps / Procedure": "1. Identify the target GPIO GP0 registers gp0_gpio_8 through gp0_gpio_27.\n2. For each register, write a test value.\n3. Read back the value from each register.\n4. Compare the read value with the written value.\n5. Record any mismatch and summarize the results.",
              "Meta Test Steps / Procedure": "1) Define the ordered macro list: MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_GPIO_9; MIZAR_GPIO_GP0_GPIO_10; MIZAR_GPIO_GP0_GPIO_11; MIZAR_GPIO_GP0_GPIO_12; MIZAR_GPIO_GP0_GPIO_13; MIZAR_GPIO_GP0_GPIO_14; MIZAR_GPIO_GP0_GPIO_15; MIZAR_GPIO_GP0_GPIO_16; MIZAR_GPIO_GP0_GPIO_17; MIZAR_GPIO_GP0_GPIO_18; MIZAR_GPIO_GP0_GPIO_19; MIZAR_GPIO_GP0_GPIO_20; MIZAR_GPIO_GP0_GPIO_21; MIZAR_GPIO_GP0_GPIO_22; MIZAR_GPIO_GP0_GPIO_23; MIZAR_GPIO_GP0_GPIO_24; MIZAR_GPIO_GP0_GPIO_25; MIZAR_GPIO_GP0_GPIO_26; MIZAR_GPIO_GP0_GPIO_27; SOFT_RST_REG_ADDRESS.\n2) For each macro with resolution_status=\"resolved\" in the provided resolution data, compute effective_addr = 0xA001A000 + offset_value (offsets observed: 0x0, 0x4, 0x8, 0xC, 0x10, 0x14, 0x18, 0x1C, 0x20, 0x24, 0x28, 0x2C, 0x30, 0x34, 0x38, 0x3C, 0x40, 0x44, 0x48, 0x4C). Write a test value V to effective_addr, read back R, and compare. If R != V, record a failure condition; otherwise record success.\n3) For SOFT_RST_REG_ADDRESS, the resolution_status is \"unresolved\" (no base/offset available in the provided data).\n4) After iterating all resolved registers, if any mismatch was recorded, mark the test as FAIL; otherwise mark as PASS.",
              "Impacted Registers": "gp0_gpio_8; gp0_gpio_9; gp0_gpio_10; gp0_gpio_11; gp0_gpio_12; gp0_gpio_13; gp0_gpio_14; gp0_gpio_15; gp0_gpio_16; gp0_gpio_17; gp0_gpio_18; gp0_gpio_19; gp0_gpio_20; gp0_gpio_21; gp0_gpio_22; gp0_gpio_23; gp0_gpio_24; gp0_gpio_25; gp0_gpio_26; gp0_gpio_27",
              "Meta Impacted Registers": "MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_GPIO_9; MIZAR_GPIO_GP0_GPIO_10; MIZAR_GPIO_GP0_GPIO_11; MIZAR_GPIO_GP0_GPIO_12; MIZAR_GPIO_GP0_GPIO_13; MIZAR_GPIO_GP0_GPIO_14; MIZAR_GPIO_GP0_GPIO_15; MIZAR_GPIO_GP0_GPIO_16; MIZAR_GPIO_GP0_GPIO_17; MIZAR_GPIO_GP0_GPIO_18; MIZAR_GPIO_GP0_GPIO_19; MIZAR_GPIO_GP0_GPIO_20; MIZAR_GPIO_GP0_GPIO_21; MIZAR_GPIO_GP0_GPIO_22; MIZAR_GPIO_GP0_GPIO_23; MIZAR_GPIO_GP0_GPIO_24; MIZAR_GPIO_GP0_GPIO_25; MIZAR_GPIO_GP0_GPIO_26; MIZAR_GPIO_GP0_GPIO_27; SOFT_RST_REG_ADDRESS",
              "Validation / Acceptance Criteria": "All reads must match the written values for gp0_gpio_8 through gp0_gpio_27.",
              "Meta Validation / Acceptance Criteria": "For each resolved register address (base 0xA001A000 with offsets 0x0 to 0x4C), after writing value V, a subsequent read must return V. Any mismatch constitutes a failure. Overall PASS only if all write/read comparisons for the resolved registers match; otherwise FAIL.",
              "Code Generation (Required / Not)": "Required",
              "Meta Headers": "NA",
              "Meta Macros": "#define GPIO0 1",
              "Meta Arrays": "NA"
            }
          ]

          # Prepare IST timestamp and filename
          ist = ZoneInfo('Asia/Kolkata')
          now_ist = datetime.now(ist)
          ts_date = now_ist.strftime('%Y%m%d')
          ts_time = now_ist.strftime('%H%M%S')
          filename = f"{ip_name}_TestPlan_{ts_date}_{ts_time}.xlsx"

          # Ensure output directory exists
          out_dir = output_directory.rstrip('/')
          os.makedirs(out_dir, exist_ok=True)
          out_path = os.path.join(out_dir, filename)

          # Build workbook
          wb = Workbook()
          ws = wb.active
          ws.title = 'TestPlan'

          headers = [
            "Index","SS / Module","Feature","Test Case Name","Test Description","Meta Test Description","Speed","Mode","Memory Start Offset","Memory End Offset","Remarks","Test Steps / Procedure","Meta Test Steps / Procedure","Impacted Registers","Meta Impacted Registers","Validation / Acceptance Criteria","Meta Validation / Acceptance Criteria","Code Generation (Required / Not)","Meta Headers","Meta Macros","Meta Arrays"
          ]

          ws.append(headers)
          for item in final_json:
            row = [str(item.get(h, "")) for h in headers]
            ws.append(row)

          # Header formatting
          header_fill = PatternFill(fill_type='solid', fgColor='FFE699')
          for cell in ws[1]:
            cell.font = Font(bold=True)
            cell.fill = header_fill

          # Wrap text and align
          for r in ws.iter_rows(min_row=2):
            for c in r:
              c.alignment = Alignment(wrap_text=True, vertical='top')

          # Freeze top row
          ws.freeze_panes = 'A2'

          # Reasonable column widths
          for col_idx, header in enumerate(headers, start=1):
            max_len = len(str(header))
            for row_idx in range(2, ws.max_row+1):
              val = ws.cell(row=row_idx, column=col_idx).value
              if val is None:
                continue
              max_len = max(max_len, len(str(val)))
            width = min(max(12, max_len + 2), 80)
            ws.column_dimensions[get_column_letter(col_idx)].width = width

          # MetaData sheet
          meta = {
            'owner': owner,
            'repo': repo,
            'branch': branch,
            'output_directory': output_directory,
            'IP_NAME': ip_name,
            'timestamp_ist': now_ist.isoformat()
          }

          ws_meta = wb.create_sheet('MetaData')
          ws_meta.append(['Key','Value'])
          for cell in ws_meta[1]:
            cell.font = Font(bold=True)
            cell.fill = header_fill
          for k, v in meta.items():
            ws_meta.append([k, str(v)])
          ws_meta.append(['final_json', json.dumps(final_json, ensure_ascii=False)])
          for r in ws_meta.iter_rows(min_row=2):
            for c in r:
              c.alignment = Alignment(wrap_text=True, vertical='top')
          ws_meta.freeze_panes = 'A2'
          ws_meta.sheet_state = 'veryHidden'

          # Save workbook
          wb.save(out_path)
          print(out_path)
          PY
      - name: Commit generated Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/*.xlsx'
          message: 'Add GPIO TestPlan Excel (IST timestamp)'
          default_author: github_actions
