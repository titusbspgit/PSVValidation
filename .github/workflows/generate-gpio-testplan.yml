name: Generate GPIO Test Plan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/source/GPIO_TestPlan_input.json'
      - '.github/scripts/json_to_excel.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (IST filename)
        run: |
          python .github/scripts/json_to_excel.py \
            --input 'Test_Output/GPIO/TestPlan/source/GPIO_TestPlan_input.json' \
            --output-dir 'Test_Output/GPIO/TestPlan/' \
            --ip-name 'GPIO' \
            --timezone 'Asia/Kolkata'

      - name: Commit generated Excel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add autogenerated GPIO Test Plan Excel (IST timestamp)"
          file_pattern: Test_Output/GPIO/TestPlan/*.xlsx
