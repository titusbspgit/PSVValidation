name: Generate GPIO Test Plan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/input/GPIO_TestPlan.json'
      - '.github/workflows/generate-gpio-testplan.yml'
      - 'scripts/generate_gpio_testplan_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (GPIO)
        id: build
        env:
          INPUT_JSON: Test_Output/GPIO/TestPlan/input/GPIO_TestPlan.json
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          SHEET_NAME: GPIO_TestPlan
        run: |
          python scripts/generate_gpio_testplan_excel.py \
            --input "$INPUT_JSON" \
            --output-dir "$OUTPUT_DIR" \
            --ip-name "GPIO" \
            --sheet-name "$SHEET_NAME" \
            --naming-rule "<IP_NAME>_TestPlan_<YYYYMMDD>_<HHMMSS>.xlsx"

      - name: Commit Excel artifact
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            Test_Output/GPIO/TestPlan/*.xlsx
          message: ${{ steps.build.outputs.commit_message }}
          default_author: github_actions
