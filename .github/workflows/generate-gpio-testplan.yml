name: Generate and Commit GPIO Test Plan (Stage1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from canonical JSON
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python .github/scripts/generate_gpio_testplan.py

      - name: Commit Excel to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$OUTPUT_XLSX" ]; then echo "No output path from generator"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_XLSX"
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0;
          fi
          git commit -m "GPIO: Add Test Plan autogenerated on $IST_HUMAN"
          git push origin HEAD:main
