name: Generate GPIO Test Plan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/input/GPIO_TestPlan.json'
      - 'scripts/generate_gpio_testplan_excel.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_gpio_testplan_excel.py --input 'Test_Output/GPIO/TestPlan/input/GPIO_TestPlan.json' --output-dir 'Test_Output/GPIO/TestPlan'
      - name: Commit and push Excel
        env:
          INPUT_JSON_PATH: Test_Output/GPIO/TestPlan/input/GPIO_TestPlan.json
        run: |
          set -e
          FILE=$(ls -1t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1 || true)
          if [ -f "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            IST_TS=$(python - <<'PY'
import json, datetime, os
with open(os.environ['INPUT_JSON_PATH'],'r',encoding='utf-8') as f:
    data=json.load(f)
ts = (data.get('metadata') or {}).get('generated_on')
try:
    dt = datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))
except Exception:
    dt = datetime.datetime.now(datetime.timezone.utc)
ist = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
print(dt.astimezone(ist).strftime('%Y-%m-%d %H:%M:%S IST'))
PY
)
            git commit -m "Add GPIO Test Plan Excel autogenerated on $IST_TS" || echo "No changes to commit"
            git push
          else
            echo "No Excel file generated"
            exit 1
