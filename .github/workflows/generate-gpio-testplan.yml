name: Generate GPIO Test Plan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/input_gpio_testplan.json'
      - 'tools/generate_testplan.py'
      - '.github/workflows/generate-gpio-testplan.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        id: gen
        run: |
          python tools/generate_testplan.py \
            --input tools/input_gpio_testplan.json \
            --output-dir Test_Output/GPIO/TestPlan \
            --ip-name GPIO

      - name: Read output metadata
        id: meta
        run: |
          PY_TS=$(python - <<'PY'
import json
with open('tools/testplan_output_meta.json','r',encoding='utf-8') as f:
    m=json.load(f)
print(m['ist_timestamp'])
PY
          )
          PY_FN=$(python - <<'PY'
import json
with open('tools/testplan_output_meta.json','r',encoding='utf-8') as f:
    m=json.load(f)
print(m['filename'])
PY
          )
          echo "IST_TS=$PY_TS" >> $GITHUB_ENV
          echo "OUTFILE=$PY_FN" >> $GITHUB_ENV

      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/${OUTFILE}"
          if git diff --cached --quiet; then
            echo "No changes to commit. Exiting."
            exit 0
          fi
          git commit -m "Add GPIO Test Plan Excel generated on ${IST_TS} (IST) via Ag-Emb-Mpsoc-Stage1"
          git push
