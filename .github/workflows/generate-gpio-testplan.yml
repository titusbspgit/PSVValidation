name: Generate GPIO TestPlan Excel
on:
  workflow_dispatch:
  push:
    paths:
      - tools/aggregated_testplan.json
      - .github/workflows/generate-gpio-testplan.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        env:
          OWNER: titusbspgit
          REPO: PSVValidation
          BRANCH: main
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
        run: python tools/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add autogenerated TestPlan for GPIO"
            git push origin HEAD:main
          fi
