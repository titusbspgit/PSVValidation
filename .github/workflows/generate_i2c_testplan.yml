JSON

      - name: Generate Excel
        shell: bash
        run: |
          python .github/scripts/generate_testplan_excel.py \
            --json-file .github/scripts/input_testplan.json \
            --outdir "Test_Output/I2C/TestPlan" \
            --ip "I2C" \
            --git_message_out .github/scripts/commit_message.txt \
            --output_path_out .github/scripts/last_output_path.txt

      - name: Commit Excel to repo
        shell: bash
        run: |
          set -e
          OUT_PATH=$(cat .github/scripts/last_output_path.txt)
          COMMIT_MSG=$(cat .github/scripts/commit_message.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
