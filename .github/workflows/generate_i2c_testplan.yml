name: Generate I2C TestPlan XLSX

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_i2c_testplan.py'
      - '.github/workflows/generate_i2c_testplan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Stage1-formatted Excel
        run: |
          python scripts/generate_i2c_testplan.py

      - name: Commit Excel to repository
        shell: bash
        run: |
          set -e
          META="scripts/.gen_meta.json"
          if [ ! -f "$META" ]; then
            echo "Generator meta file not found; failing job." >&2
            exit 1
          fi
          COMMIT_MESSAGE=$(jq -r '.commit_message' "$META")
          OUTPUT_PATH=$(jq -r '.output_path' "$META")
          echo "Committing $OUTPUT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git commit -m "$COMMIT_MESSAGE" || echo "No changes to commit"
          git push
