    {"Index":2,"SS / Module":"I2C","Feature":"Set the High Speed High Count and Low Count registers...","Test Case Name":"test_i2c0_mst_i2c1_slv_dma_hs_md/","Test Description":"Transfers a small block of data ... high-speed timing ...","Speed":"High-speed","Mode":"DMA, Interrupt","Memory Start Offset":"0xA0243E00","Memory End Offset":"0xA0243F10","Remarks":"The interconnect slave interface is explicitly configured ...","Test Steps / Procedure":["Entry: the test starts...","Configure system interconnect...","Enable two relevant interrupt lines ...","Enable I2C-related interrupts ...","Initialize both controller instances ...","Program addressing ...","Set byte count to five ...","Program timing ...","Program master code ...","Configure transmit and receive FIFO thresholds ...","Enable DMA on the initiator-side instance ...","Prepare data in memory ...","Configure the first DMA channel ...","Wait for the first DMA channel to complete ...","Start the I2C transfer ...","Poll the current byte-count register ...","Wait in a loop for the transfer-complete interrupt ...","Enable DMA reception ...","Configure the second DMA channel ...","Wait for the second DMA channel to complete ...","Verify end-to-end data integrity ...","Delay briefly and finish ...","Interrupt service: upon entry ..."],"Impacted Registers":"NA","Validation / Acceptance Criteria":["During ISR: the initiator’s interrupt status must indicate transfer completion ...","After the second DMA completes ...","Overall result: Pass if no errors ..."],"Code Generation (Required / Not)":"","Hidden_Test_Case_Name":"test_i2c0_mst_i2c1_slv_dma_hs_md/","Hidden_Test_Description":"Prints banner ... HS timing is set via ...","Hidden_Remarks":"Precondition: Set multiple 0xA17000xx ...","Hidden_Test_Steps_Procedure":["void test_case(): int_pend=1;","Write sequence: write_reg(0xA1700008,1), ...","GIC_EnableIRQ(80); GIC_EnableIRQ(81);","write_reg(MIZAR_LSS_SYSREG_INTR_EN0, ...);","I2C init: write_reg(MIZAR_I2C0_FF,0x3); ...","Clear interrupts: write_reg(MIZAR_I2C0_INTR_CLR,0xFFFFFFFF); ...","Device control: write_reg(MIZAR_I2C0_DEV_CTRL,0x38A); ...","Addressing: write_reg(MIZAR_I2C1_SLV_ADDR,0x37); ...","Byte count: write_reg(MIZAR_I2C0_I2C_BYTE_CNT,0x5); ...","Timing: write_reg(MIZAR_I2C0_SF_LCNT,0x2C); ...","Master code & mask: write_reg(MIZAR_I2C0_I2C_MSTR_CODE,0x2); ...","FIFO thresholds: write_reg(MIZAR_I2C0_TX_FIFO_THLD,0x5); ...","Enable DMA on I2C0: write_reg(MIZAR_I2C0_DMA_CTRL,0x2);","src_addr=SRAM_ADDR_1(0xA0243F00); dest_addr=MIZAR_I2C0_SMB_HST_BLOCK_DATA;","Data preload: for(i=0,addr=src_addr; i<5; i++, addr+=4){ ... }","DMA CH0 setup: write_reg(MIZAR_DMA_CH0_CTRL,0x8028028); ...","dma_disable(): while(read_reg(MIZAR_DMA_DMA_CH_EN)) { wait_on(100); }","Start I2C transfer: write_reg(MIZAR_I2C0_TSFR_CTRL,0x2);","Poll TX bytes: data_rd=read_reg(MIZAR_I2C0_I2C_CURRENT_BYTECNT); ...","Wait for interrupt: while(int_pend){ wait_on(10);} ","Initiate receive DMA: write_reg(MIZAR_I2C1_DMA_CTRL,0x1); ...","DMA CH1 setup: write_reg(MIZAR_DMA_CH1_CTRL,0x8024028); ...","dma_disable(): while(read_reg(MIZAR_DMA_DMA_CH_EN)) { wait_on(100); }","Data check loop: for(i=0;i<5;i"){ ... }","wait_on(100); finish(test_err);","void Default_IRQHandler(): int_pend=0; int_status=read_reg(MIZAR_I2C0_INTR_STS); if(int_status==0x0010){ ... } else { test_err++; }
