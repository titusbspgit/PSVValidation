name: Generate I2C Test Plan

on:
  push:
    paths:
      - 'tools/generate_testplan_i2c.py'
      - 'TestPlan_Input/I2C_TestPlan.json'
      - '.github/workflows/generate_i2c_testplan.yml'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (Stage1 rules)
        run: |
          python tools/generate_testplan_i2c.py

      - name: Commit Excel output
        run: |
          set -e
          if [ ! -f Test_Output/I2C/TestPlan/.latest ]; then
            echo ".latest file not found; nothing to commit" && exit 0
          fi
          fname=$(grep '^filename=' Test_Output/I2C/TestPlan/.latest | cut -d= -f2)
          ist=$(grep '^ist=' Test_Output/I2C/TestPlan/.latest | cut -d= -f2)
          if [ ! -f "Test_Output/I2C/TestPlan/${fname}" ]; then
            echo "Expected output file not found: Test_Output/I2C/TestPlan/${fname}" && exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "Test_Output/I2C/TestPlan/${fname}"
          git commit -m "Add I2C Test Plan (${fname}) generated on ${ist} for IP I2C" || echo "No changes to commit"
          git push
