name: Generate I2C TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate_i2c_testplan.yml"
      - "tools/generate_testplan.py"
      - "tools/i2c_testplan_json.json"

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate formatted Excel from JSON (I2C)
        run: |
          python tools/generate_testplan.py \
            --json tools/i2c_testplan_json.json \
            --output-dir Test_Output/I2C/TestPlan \
            --ip-name I2C \
            --source-path "TestRepo/i2c"

      - name: Read output file path
        id: read_out
        run: |
          echo "outfile=$(cat tools/output_path.txt)" >> $GITHUB_OUTPUT

      - name: Commit Excel artifact
        env:
          OUTFILE: ${{ steps.read_out.outputs.outfile }}
        run: |
          ist_ts=$(python - << 'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S'))
PY
)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTFILE"
          git commit -m "Add auto-generated I2C TestPlan Excel from TestRepo/i2c at ${ist_ts}" || echo "No changes to commit"
          git push
