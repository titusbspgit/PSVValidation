name: Generate and Commit I2C TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_i2c_testplan.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate and commit Excel
        run: |
          python .github/scripts/generate_testplan_excel.py
