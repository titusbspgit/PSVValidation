IZAR_I2C0_INTR_CLR,0xFFFFFFFF); ...","write_reg(MIZAR_I2C0_DEV_CTRL,0x382); ...","write_reg(MIZAR_I2C1_SLV_ADDR,0x37); ...","write_reg(MIZAR_I2C0_I2C_BYTE_CNT,0x5); ...","write_reg(MIZAR_I2C0_SF_LCNT,0x12C); write_reg(MIZAR_I2C0_SF_HCNT,0xC8);","write_reg(MIZAR_I2C0_MASK_INTR,0XFFFFFFEF);","write_reg(MIZAR_I2C0_TX_FIFO_THLD,0x5); ...","write_reg(MIZAR_I2C0_DMA_CTRL,0x2);","src_addr=0xA0243FC0; dest_addr=MIZAR_I2C0_SMB_HST_BLOCK_DATA;","for(i=0,addr=src_addr; i<5; i++, addr+=4){ ... }","DMA CH0: write_reg(MIZAR_DMA_CH0_CTRL,0x8028028); ...","dma_disable(): while(read_reg(MIZAR_DMA_DMA_CH_EN)) { wait_on(100); }","write_reg(MIZAR_I2C0_TSFR_CTRL,0x2);","data_rd=read_reg(MIZAR_I2C0_I2C_CURRENT_BYTECNT); ...","int_pend=1; while(int_pend){ wait_on(10);} ","write_reg(MIZAR_I2C1_DMA_CTRL,0x1); src_addr=MIZAR_I2C1_SMB_HST_BLOCK_DATA; dest_addr=0xA0243FE0;","DMA CH1: write_reg(MIZAR_DMA_CH1_CTRL,0x8024028); ...","dma_disable(): while(read_reg(MIZAR_DMA_DMA_CH_EN)) { wait_on(100); }","addr=0xA0243FC0; addr1=0xA0243FE0; for(i=0;i<5;i"){ ... }","wait_on(100); finish(test_err);","void Default_IRQHandler(): int_pend=0; int_status=read_reg(MIZAR_I2C0_INTR_STS); if(int_status==0x0010){ ... } else { test_err++; }
      ],"Hidden_Impacted_Registers":"MIZAR_LSS_SYSREG_INTR_EN0, ... MIZAR_LSS_SYSREG_RAW_STCR0","Hidden_Validation_Acceptance_Criteria":["ISR: require int_status==0x0010; ...","Memory integrity: for i=0..4, ...","finish(test_err) passes when test_err==0."]}
