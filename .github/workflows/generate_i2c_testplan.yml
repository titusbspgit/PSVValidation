name: Generate I2C TestPlan Excel (Stage1)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/triggers/i2c_testplan.run"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata

      - name: Write TestPlan JSON input
        shell: bash
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/input_testplan.json << 'JSON'
{
  "context_folder_list": [
    "i2c_reg_rd_wr_test/ – https://github.com/titusbspgit/PSVValidation/tree/main/TestRepo/i2c/i2c_reg_rd_wr_test",
    "test_i2c0_mst_i2c1_slv_dma_hs_md/ – https://github.com/titusbspgit/PSVValidation/tree/main/TestRepo/i2c/test_i2c0_mst_i2c1_slv_dma_hs_md",
    "test_i2c0_mst_i2c1_slv_dma_st_md/ – https://github.com/titusbspgit/PSVValidation/tree/main/TestRepo/i2c/test_i2c0_mst_i2c1_slv_dma_st_md"
  ],
