name: Generate GPIO TestPlan Excel (Batch 2)

on:
  push:
    paths:
      - tools/batch2_input.json
      - .github/workflows/generate_gpio_testplan_batch2.yml
      - tools/generate_testplan_excel.py
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        run: |
          python tools/generate_testplan_excel.py \
            --input tools/batch2_input.json \
            --output "Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx"
      - name: Commit and push Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git status --porcelain | grep -E "^\s?M|^\?\?\s+Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx"
            git commit -m "Final formatted Excel generated from JSON input (Batch 2)"
            git push
          else
            echo "No Excel changes to commit."
          fi
