name: generate_testplan_excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_testplan_excel.py'
      - 'scripts/testplan_input.json'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'chore(testplan): add')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --no-cache-dir openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py \
            --json scripts/testplan_input.json \
            --output-dir "Test_Output/PCIE/TestPlan" \
            --ip-name "PCIE" \
            --out-flag-file testplan_output_path.txt
      - name: Commit and push Excel
        run: |
          set -e
          FILE_PATH=$(cat testplan_output_path.txt)
          echo "Generated: $FILE_PATH"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$FILE_PATH"
          BASENAME=$(basename "$FILE_PATH")
          git commit -m "chore(testplan): add $BASENAME" || echo "No changes to commit"
          git push