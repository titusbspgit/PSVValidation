name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_testplan_excel.py
      - scripts/testplan_input.json
      - .github/workflows/generate_testplan_excel.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          set -e
          FILE_PATH=$(cat scripts/testplan_output_path.txt)
          echo "Generated: $FILE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "chore(testplan): add $(basename "$FILE_PATH")" || echo "No changes to commit"
          git push
