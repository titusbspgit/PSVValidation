name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'
      - 'data/testplan_data.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          JSON_PATH: data/testplan_data.json
        run: |
          python scripts/generate_testplan_excel.py --json "$JSON_PATH" --outdir "$OUTPUT_DIR"

      - name: Commit generated Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Added generated TestPlan Excel"
            git push
          else
            echo "No changes to commit."
          fi
