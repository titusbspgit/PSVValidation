name: Generate TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_testplan_excel.yml'
      - 'scripts/generate_testplan_excel.py'
      - 'scripts/testplan_input.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py --input scripts/testplan_input.json --outdir "Test_Output/PCIE/TestPlan" --ip-name "PCIE"
      - name: Commit and push Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILEPATH=$(cat testplan_output_path.txt)
          echo "Generated: $FILEPATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILEPATH"
          git commit -m "chore(testplan): add $(basename "$FILEPATH")" || exit 0
          git push origin HEAD:${{ github.ref_name }}
