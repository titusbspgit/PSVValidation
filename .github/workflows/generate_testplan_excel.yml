name: Generate TestPlan Excel

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/generate_testplan_excel.py"
      - "Test_Output/GPIO/TestPlan/testplan_data.json"
      - ".github/workflows/generate_testplan_excel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
