name: Generate TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/excel_generator.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/MIPI/TestPlan/excel_generator.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git rm Test_Output/MIPI/TestPlan/excel_generator.py || true
          git rm .github/workflows/generate_testplan_excel.yml || true
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
