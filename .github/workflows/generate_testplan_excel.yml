name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/testplan_input.json'
      - '.github/workflows/generate_testplan_excel.yml'
      - 'scripts/generate_testplan_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-input openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py
      - name: Read output path
        id: out
        run: echo "OUTPUT_PATH=$(cat testplan_output_path.txt)" >> $GITHUB_ENV
      - name: Commit and push Excel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(testplan): add $(basename \"$OUTPUT_PATH\")"
          git push
