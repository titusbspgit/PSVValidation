name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_testplan_excel.yml'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: |
          cd Test_Output/MIPI/TestPlan
          python run_generator.py

      - name: Commit and push Excel file
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx"
          git commit -m "Added generated TestPlan Excel"
          git push
