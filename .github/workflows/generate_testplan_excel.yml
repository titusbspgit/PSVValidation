name: Generate TestPlan Excel

on:
  push:
    paths:
      - .github/workflows/generate_testplan_excel.yml
      - .github/scripts/generate_testplan_excel.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Write input JSON
        env:
          JSON_DATA: |-
            [
              {
                "Index": "1",
                "SS / Module": "PCIE",
                "Feature": "Testable: writeAsRead",
                "Test Case Name": "pcie0_dbi_dsp_reg_wr_rd_test",
                "Test Description": "Verify PCIe0 DBI DSP register reset defaults and masked write/read behavior across all enumerated DBI DSP registers. Registers marked non-readable or non-writable are skipped; a small set of registers is excluded from default-value checks. The test iterates over multiple data patterns and validates readback against mask-based expectations. Test passes only if no mismatches are detected.",
                "Meta Test Description": "program.c performs two main checks over CNT (775) DBI DSP register addresses provided by addr_array in test_define.c. 1) Default value check (chk_rst_val): For each index i, read the address addr = addr_array[i]. If read_mask_array[i] == 0, skip. Also skip three specific addresses: mizar_PCIE0_DBI_DSP_CAP_ID_NXT_PTR_REG, mizar_PCIE0_DBI_DSP_DEVICE_CONTROL_DEVICE_STATUS, and mizar_PCIE0_DBI_DSP_PL_DEBUG1_OFF. Otherwise, data_rd = read_reg(addr); compare against default_value_array[i]; if mismatch, increment def_fail_cnt and log failure; else log pass (when DEBUG_DISPLAY enabled). 2) Write/read check (chk_rd_wr): Iterate j over 6 patterns: {0xffffffff, 0xaaaaaaaa, 0x55555555, 0x00000000, 0xA5A5A5A5, 0xffff0000}. For (j=0..5): data_wr = chk_val[j]; 2a) Write phase: for (i=0; i<CNT; i++): addr=addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0) continue; write_reg(addr, data_wr); 2b) Read/verify phase: for (i=0; i<CNT; i++): addr=addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0) continue; if (read_mask_array[i] == 0) continue; data_rd = read_reg(addr); wr_n = (write_mask_array[i] ^ 0xffffffff); exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])); if (data_rd == exp_val) log pass; else increment wr_fail_cnt and log failure. soft_reset_chk() exists but is commented out in test_case(); it would write SOFT_RST_REG_DATA to SOFT_RST_REG_ADDRESS, wait, then restore original value and wait again. At end of test_case(), if (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1) else finish(0).",
                "Speed": "NA",
                "Mode": "Polling",
                "Memory Start Offset": "NA",
                "Memory End Offset": "NA",
                "Remarks": "Registers not readable or not writable (per masks) are skipped. Default-value checks exclude: PCIE_CAP_ID_PCIE_NEXT_CAP_PTR_PCIE_CAP_REG, DBI_DSP_DEVICE_CONTROL_DEVICE_STATUS, DBI_DSP_PL_DEBUG1_OFF. Write-read validation respects write/read masks; only writable and readable bits are validated; unwritable bits are expected to retain their reset defaults.",
                "Test Steps / Procedure": "1) Initialize the test context and counters. 2) Perform reset default checks over all DBI DSP registers: read each register that is readable and not in the excluded list and compare against its specified reset default. 3) For each of the six data patterns, write the pattern to every DBI DSP register that is permitted for writes. 4) Read back each written register that is readable and verify the value matches the mask-based expected result (writable bits from the pattern; non-writable bits remain at reset default). 5) Record any mismatches during default and write-read checks. 6) Report PASS if no mismatches are found; otherwise report FAIL.",
                "Meta Test Steps / Procedure": "1) Call chk_rst_val(): for (i=0; i<CNT; i++): addr = addr_array[i]; if (read_mask_array[i] == 0) continue; if (addr == mizar_PCIE0_DBI_DSP_CAP_ID_NXT_PTR_REG || addr == mizar_PCIE0_DBI_DSP_DEVICE_CONTROL_DEVICE_STATUS || addr == mizar_PCIE0_DBI_DSP_PL_DEBUG1_OFF) continue; data_rd = read_reg(addr); if (data_rd == default_value_array[i]) {log pass} else {def_fail_cnt++; log fail}. 2) Call chk_rd_wr(): patterns chk_val[6] = {0xffffffff, 0xaaaaaaaa, 0x55555555, 0x00000000, 0xA5A5A5A5, 0xffff0000}. For (j=0..5): data_wr = chk_val[j]; 2a) Write phase: for (i=0; i<CNT; i++): addr=addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0) continue; write_reg(addr, data_wr); 2b) Read/verify phase: for (i=0; i<CNT; i++): addr=addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0) continue; if (read_mask_array[i] == 0) continue; data_rd = read_reg(addr); wr_n = (write_mask_array[i] ^ 0xffffffff); exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])); if (data_rd == exp_val) {log pass} else {wr_fail_cnt++; log fail}. 3) soft_reset_chk() present but not invoked: default_value = read_reg(SOFT_RST_REG_ADDRESS); write_reg(SOFT_RST_REG_ADDRESS, SOFT_RST_REG_DATA); wait_on(1000); write_reg(SOFT_RST_REG_ADDRESS, default_value); wait_on(1000). 4) In test_case(): if (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0).",
                "Impacted Registers": "PCIE_CAP_ID_PCIE_NEXT_CAP_PTR_PCIE_CAP_REG; DBI_DSP_DEVICE_CONTROL_DEVICE_STATUS; DBI_DSP_PL_DEBUG1_OFF; DBI_DSP_TYPE1_DEV_ID_VEND_ID_REG; DBI_DSP_TYPE1_STATUS_COMMAND_REG; DBI_DSP_LINK_CONTROL_LINK_STATUS_REG; DBI_DSP_DMA_WRITE_ENGINE_EN_OFF; DBI_DSP_DMA_READ_ENGINE_EN_OFF; DBI_DSP_AER_EXT_CAP_HDR_OFF; DBI_DSP_IATU_REGION_CTRL_1_OFF_OUTBOUND_0; DBI_DSP_IATU_REGION_CTRL_2_OFF_INBOUND_0; MSI_CAP_OFF_10H_REG",
                "Meta Impacted Registers": "mizar_PCIE0_DBI_DSP_CAP_ID_NXT_PTR_REG; mizar_PCIE0_DBI_DSP_DEVICE_CONTROL_DEVICE_STATUS; mizar_PCIE0_DBI_DSP_PL_DEBUG1_OFF; mizar_PCIE0_DBI_DSP_TYPE1_DEV_ID_VEND_ID_REG; mizar_PCIE0_DBI_DSP_TYPE1_STATUS_COMMAND_REG; mizar_PCIE0_DBI_DSP_LINK_CONTROL_LINK_STATUS_REG; mizar_PCIE0_DBI_DSP_DMA_WRITE_ENGINE_EN_OFF; mizar_PCIE0_DBI_DSP_DMA_READ_ENGINE_EN_OFF; mizar_PCIE0_DBI_DSP_AER_EXT_CAP_HDR_OFF; mizar_PCIE0_DBI_DSP_IATU_REGION_CTRL_1_OFF_OUTBOUND_0; mizar_PCIE0_DBI_DSP_IATU_REGION_CTRL_2_OFF_INBOUND_0; mizar_PCIE0_DBI_DSP_PCI_MSI_CAP_ID_NEXT_CTRL_REG",
