name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/input/**'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        id: gen
        run: |
          python scripts/ggenerate_testplan_excel.py --input "Test_Output/GPIO/TestPlan/input/testplan.json" --output-dir "Test_Output/GPIO/TestPlan" 2>&1 | tee gen.log || true
          # Fallback if script name typo or failure; try correct path
          if ! grep -q 'testplan_' gen.log; then
            python scripts/generate_testplan_excel.py --input "Test_Output/GPIO/TestPlan/input/testplan.json" --output-dir "Test_Output/GPIO/TestPlan" | tee gen2.log
          fi

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
