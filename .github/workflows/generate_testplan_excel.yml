name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/testplan.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py --json Test_Output/PCIE/TestPlan/testplan.json --outdir Test_Output/PCIE/TestPlan
      - name: Commit Excel
        run: |
          set -e
          OUT_PATH=$(cat Test_Output/PCIE/TestPlan/.last_output_path.txt)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT_PATH"
          git commit -m "Added generated TestPlan Excel: $(basename "$OUT_PATH")" || echo "No changes to commit"
          git push
