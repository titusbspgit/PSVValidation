name: Generate and Commit USB TestPlan Excel (v2)

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/testplan.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl
      - name: Generate Excel
        id: gen
        env:
          IP_NAME: USB
          OUTPUT_DIR: Test_Output/USB/TestPlan
        run: |
          python scripts/generate_testplan_excel.py | tee gen.out
          echo "file=$(grep -oP '^OUTPUT_FILE=\K.*' gen.out)" >> $GITHUB_OUTPUT
      - name: Commit Excel
        if: steps.gen.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gen.outputs.file }}"
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push origin HEAD:main

# trigger