name: Generate PCIE TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate_testplan_excel.yml
      - scripts/generate_excel_from_json.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from embedded JSON
        env:
          IP_NAME: PCIE
          OUTPUT_DIR: Test_Output/PCIE/TestPlan/
        run: |
          python scripts/generate_excel_from_json.py \
            --ip-name "${IP_NAME}" \
            --output-dir "${OUTPUT_DIR}"

      - name: Commit Excel to repository
        env:
          GIT_AUTHOR_NAME: "Ag-Emb-Mpsoc-Stage1 Bot"
          GIT_AUTHOR_EMAIL: "stage1-bot@titus.local"
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add Test_Output/PCIE/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            TS=$(TZ=Asia/Kolkata date +"%Y-%m-%d %H:%M:%S %Z")
            git commit -m "Add PCIE test plan Excel generated on ${TS}"
            git push
          fi
