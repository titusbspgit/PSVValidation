name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: python scripts/generate_testplan_excel.py

      - name: Commit generated Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/testplan_*.xlsx || true
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push || echo "Push skipped"
