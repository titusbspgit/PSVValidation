name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_excel.py'
      - 'scripts/testplan_input.json'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-input --upgrade openpyxl

      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
        run: |
          python scripts/generate_testplan_excel.py

      - name: Commit generated Excel
        run: |
          set -e
          path="$(cat scripts/.testplan_output_path)"
          filename="$(basename "$path")"
          echo "Committing $path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "chore(testplan): add ${filename}" || echo "No changes to commit"
          git push
