name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        id: gen
        run: |
          python scripts/generate_testplan_excel.py
      - name: Commit Excel
        env:
          FILE_PATH: ${{ steps.gen.outputs.output_file }}
        run: |
          if [ -z "$FILE_PATH" ]; then
            echo "No output file path from previous step" >&2
            exit 1
          fi
          echo "Committing $FILE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push origin HEAD:main
