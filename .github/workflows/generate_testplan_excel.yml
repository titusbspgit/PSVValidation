name: Generate TestPlan Excel (USB)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_testplan_xlsx.py

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        run: |
          python scripts/generate_testplan_xlsx.py

      - name: Commit and push generated Excel
        shell: bash
        run: |
          set -e
          if [ ! -f generated_excel_path.txt ]; then
            echo "generated_excel_path.txt not found; script may have failed"
            exit 1
          fi
          FILE_PATH=$(cat generated_excel_path.txt)
          echo "Generated file: ${FILE_PATH}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE_PATH}"
          git commit -m "Added generated TestPlan Excel: ${FILE_PATH}" || echo "No changes to commit."
          # Push to main explicitly
          git push origin HEAD:main
