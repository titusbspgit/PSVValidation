name: Generate Ethernet TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/Ethernet/TestPlan/generate_excel.py'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/Ethernet/TestPlan/generate_excel.py

      - name: Find generated Excel file
        id: find_excel
        run: |
          EXCEL_FILE=$(ls Test_Output/Ethernet/TestPlan/Ethernet_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$EXCEL_FILE" ]; then
            echo "ERROR: No Excel file generated"
            exit 1
          fi
          echo "excel_file=$EXCEL_FILE" >> $GITHUB_OUTPUT
          echo "Found: $EXCEL_FILE"

      - name: Commit and push Excel file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/Ethernet/TestPlan/Ethernet_TestPlan_*.xlsx'
          git rm --cached 'Test_Output/Ethernet/TestPlan/generate_excel.py' || true
          git commit -m 'Added generated Ethernet TestPlan Excel'
          git push

      - name: Cleanup generator script
        run: |
          git rm 'Test_Output/Ethernet/TestPlan/generate_excel.py'
          git rm '.github/workflows/generate_testplan_excel.yml'
          git commit -m 'Cleanup: Remove TestPlan generator script and workflow'
          git push
