name: Generate and Commit TestPlan Excel

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: 'Path to JSON file in the repo (e.g., data/testplan.json)'
        required: true
        default: 'testplan.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        id: gen
        run: |
          python scripts/generate_testplan_excel.py --json-path "${{ github.event.inputs.json_path }}" --output-dir "Test_Output"

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/*.xlsx || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push origin main
          fi
