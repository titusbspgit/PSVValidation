name: Generate TestPlan Excel

on:
  workflow_dispatch:
    inputs:
      json_payload:
        description: 'Paste your Test Plan JSON array (must be a valid JSON array)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        env:
          JSON_PAYLOAD: ${{ github.event.inputs.json_payload }}
        run: |
          python scripts/generate_testplan_excel.py --outdir "Test_Output/GPIO/TestCode"
      - name: Commit Excel
        run: |
          set -e
          FILE=$(ls -t Test_Output/GPIO/TestCode/testplan_*.xlsx | head -n 1)
          echo "Generated file: $FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
