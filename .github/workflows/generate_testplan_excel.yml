name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - .github/triggers/run_gpio_testplan.txt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade pip && pip install openpyxl

      - name: Generate Excel (GPIO)
        run: |
          python scripts/json_to_testplan_xlsx.py \
            --json data/GPIO_FULL_JSON_STRUCTURE.json \
            --ipname GPIO \
            --outdir Test_Output/GPIO/TestPlan/

      - name: Commit Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Ag-Emb-Mpsoc-Stage1 Bot"
          git config user.email "ci-bot@psvvalidation.local"
          if [ -z "${OUTPUT_FILE}" ]; then
            # Fallback: pick most recent
            OUTPUT_FILE=$(ls -t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1)
          fi
          echo "OUTPUT_FILE=${OUTPUT_FILE}"
          git add "$OUTPUT_FILE"
          TS=$(python - <<'PY'
from datetime import datetime, timedelta, timezone
ist = timezone(timedelta(hours=5, minutes=30))
print(datetime.now(ist).strftime('%Y-%m-%d %H:%M:%S'))
PY
)
          git commit -m "Add autogenerated GPIO TestPlan Excel for GPIO (IST ${TS})" || echo "No changes to commit"
          git push || echo "Nothing to push"
