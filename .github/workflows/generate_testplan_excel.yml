name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - tools/generate_testplan_excel.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        run: |
          python tools/generate_testplan_excel.py
      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
