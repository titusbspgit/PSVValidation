name: Generate Test Plan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate_testplan_excel.yml'
      - 'scripts/generate_testplan_excel.py'
      - 'scripts/testplan_input.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-input openpyxl

      - name: Generate Excel
        run: python scripts/generate_testplan_excel.py

      - name: Commit Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT_PATH=$(cat testplan_output_path.txt)
          git add "$OUT_PATH"
          git commit -m "chore(testplan): add $(basename "$OUT_PATH")" || echo "No changes to commit"
          git push
