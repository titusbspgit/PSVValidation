name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        run: |
          python3 scripts/generate_testplan_excel.py

      - name: Read output path
        id: out
        run: |
          if [ ! -f testplan_output_path.txt ]; then
            echo "::error::testplan_output_path.txt not found" && exit 1
          fi
          FILE_PATH=$(cat testplan_output_path.txt)
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT

      - name: Commit generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          FILENAME=$(basename "$FILE_PATH")
          git commit -m "chore(testplan): add $FILENAME" || echo "No changes to commit"
          git push
