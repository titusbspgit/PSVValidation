name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'input/testplan.json'
      - 'tools/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        env:
          IP_NAME: PCIE
          OWNER: titusbspgit
          REPO: PSVValidation
          BRANCH: main
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
        run: |
          python tools/generate_testplan_excel.py \
            --input input/testplan.json \
            --ip-name "$IP_NAME" \
            --owner "$OWNER" \
            --repo "$REPO" \
            --branch "$BRANCH" \
            --output-dir "$OUTPUT_DIR"

      - name: Commit Excel to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Added generated TestPlan Excel"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
