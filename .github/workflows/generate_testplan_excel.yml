name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python .github/scripts/generate_testplan_excel.py

      - name: Commit Excel
        run: |
          set -e
          FILE=$(ls -1 Test_Output/GPIO/TestPlan/testplan_*.xlsx | tail -n 1 || true)
          if [ -n "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
            git push
          else
            echo "No Excel file generated."
            exit 1
          fi
