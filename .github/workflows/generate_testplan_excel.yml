# ============================================================
# GitHub Actions Workflow: Generate GPIO TestPlan Excel
# ============================================================
# Triggers:
#   - On push when the generator script or JSON data changes
#   - Manual dispatch (workflow_dispatch)
#
# What it does:
#   1. Checks out the repo
#   2. Installs Python 3.11 + openpyxl
#   3. Runs generate_testplan_excel.py
#   4. Commits and pushes the generated .xlsx back to the repo
# ============================================================

name: Generate TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_testplan_excel.py'
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Excel workbook
        id: generate
        run: python Test_Output/GPIO/TestPlan/generate_testplan_excel.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'Test_Output/GPIO/TestPlan/testplan_*.xlsx'
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new Excel file to commit."
          else
            git commit -m "chore(testplan): add autogenerated GPIO test plan Excel [skip ci]"
            git push origin main
            echo "Excel file committed and pushed successfully."
          fi
