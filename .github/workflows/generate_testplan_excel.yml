name: Generate TestPlan Excel (PCIE)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/testplan_input.json'
      - 'tools/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          IP_NAME: PCIE
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
          INPUT_JSON: tools/testplan_input.json
        run: |
          python tools/generate_testplan_excel.py --ip-name "$IP_NAME" --input "$INPUT_JSON" --output-dir "$OUTPUT_DIR"

      - name: Commit and push generated Excel
        id: commit_excel
        run: |
          set -e
          FILE_PATH="$(cat tools/generated_file_path.txt)"
          FILE_NAME="$(cat tools/generated_filename.txt)"
          echo "Generated: $FILE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Add $FILE_NAME (IST)" || echo "No changes to commit"
          git push origin HEAD:main
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
