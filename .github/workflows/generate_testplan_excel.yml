name: Generate TestPlan Excel (GPIO)

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/testplans/GPIO/final_json.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        env:
          IP_NAME: GPIO
        run: python scripts/generate_testplan_excel.py
      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          git commit -m "Add generated TestPlan Excel for GPIO" || echo "No changes to commit"
          git push