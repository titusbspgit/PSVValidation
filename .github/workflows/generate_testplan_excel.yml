name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_excel.py'
      - 'scripts/testplan_input.json'
      - '.github/workflows/generate_testplan_excel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        run: |
          python scripts/generate_testplan_excel.py
      - name: Commit generated Excel
        run: |
          set -e
          OUT_PATH=$(cat scripts/testplan_output_path.txt)
          FILE_NAME=$(basename "$OUT_PATH")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_PATH"
          git commit -m "chore(testplan): add $FILE_NAME" || echo "No changes to commit"
          git push
