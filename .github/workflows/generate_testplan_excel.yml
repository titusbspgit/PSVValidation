name: Generate and Commit TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/testplan/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel
        run: python automation/testplan/generate_testplan_excel.py

      - name: Commit Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/*.xlsx'
          message: 'Added generated TestPlan Excel'