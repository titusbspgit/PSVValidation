name: Generate TestPlan Excel (JSON → XLSX)

on:
  workflow_dispatch:
    inputs:
      json_data:
        description: 'JSON array for TestPlan rows (each object = one row)'
        required: true
      output_file_path:
        description: 'Repository path to save Excel (e.g., Test_Output/GPIO/TestPlan/)'
        required: true
      output_file_name:
        description: 'Excel file name (e.g., GPIO_TestPlan_YYYYMMDD_HHMMSS.xlsx)'
        required: true
      branch:
        description: 'Target branch to commit the Excel file'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Materialize JSON input
        env:
          JSON_DATA: ${{ github.event.inputs.json_data }}
        run: |
          cat > input.json << 'JSON_EOF'
          ${JSON_DATA}
          JSON_EOF
          python - << 'PY'
          import json,sys
          try:
              data=json.load(open('input.json','r',encoding='utf-8'))
              assert isinstance(data,list) and len(data)>=1
          except Exception as e:
              print('Invalid or empty JSON array:',e)
              sys.exit(2)
          PY

      - name: Generate Excel from JSON
        env:
          OUT_PATH: ${{ github.event.inputs.output_file_path }}
          OUT_NAME: ${{ github.event.inputs.output_file_name }}
        run: |
          python scripts/generate_testplan_excel.py \
            --json input.json \
            --output-path "$OUT_PATH" \
            --output-name "$OUT_NAME"

      - name: Validate XLSX (OOXML ZIP + loadable)
        env:
          OUT_PATH: ${{ github.event.inputs.output_file_path }}
          OUT_NAME: ${{ github.event.inputs.output_file_name }}
        run: |
          python - << 'PY'
          import os,sys,zipfile,openpyxl
          p=os.path.join(os.getcwd(), os.environ['OUT_PATH'])
          f=os.path.join(p, os.environ['OUT_NAME'])
          if not os.path.isfile(f):
              print('Excel not found:',f)
              sys.exit(3)
          if not zipfile.is_zipfile(f):
              print('Not a ZIP-based OOXML workbook:',f)
              sys.exit(4)
          with zipfile.ZipFile(f,'r') as z:
              names=z.namelist()
              if '[Content_Types].xml' not in names:
                  print('Missing OOXML content types file')
                  sys.exit(5)
          try:
              wb=openpyxl.load_workbook(f, data_only=True)
              assert 'TestPlan' in wb.sheetnames and 'Meta_data_sheet' in wb.sheetnames
              # Ensure Meta_data_sheet is Very Hidden
              meta = wb['Meta_data_sheet']
              assert meta.sheet_state == 'veryHidden'
          except Exception as e:
              print('Openpyxl load/structure check failed:',e)
              sys.exit(6)
          print('XLSX validation passed for', f)
          PY

      - name: Commit Excel (only)
        if: ${{ success() }}
        env:
          OUT_PATH: ${{ github.event.inputs.output_file_path }}
          OUT_NAME: ${{ github.event.inputs.output_file_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force "$OUT_PATH/$OUT_NAME"
          git commit -m "Final formatted Excel generated from JSON input"
          git push origin HEAD:${{ github.event.inputs.branch }}
