name: Generate LPDDR4 TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/LPDDR4/TestPlan/generate_testplan.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        id: generate
        env:
          OUTPUT_DIR: Test_Output/LPDDR4/TestPlan
        run: python Test_Output/LPDDR4/TestPlan/generate_testplan.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/LPDDR4/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LPDDR4-TestPlan-Excel
          path: Test_Output/LPDDR4/TestPlan/*.xlsx
          retention-days: 30
