name: Generate and Commit TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_testplan_excel.yml
      - scripts/generate_testplan.py
      - data/testplan_input.json
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel
        run: |
          python scripts/generate_testplan.py

      - name: Read generated path
        id: readpath
        run: |
          echo "OUTPUT_PATH=$(cat data/generated_output_path.txt)" >> $GITHUB_ENV
          echo "Output path: $(cat data/generated_output_path.txt)"

      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Added generated TestPlan Excel"
            git push
          fi
