name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - '.github/scripts/generate_testplan.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        env:
          OUTPUT_DIR: Test_Output/MIPI/TestPlan
        run: python .github/scripts/generate_testplan.py

      - name: Read generated filename
        id: get_filename
        run: |
          FILENAME=$(cat Test_Output/MIPI/TestPlan/generated_filename.txt)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/MIPI/TestPlan/${{ steps.get_filename.outputs.filename }}"
          git commit -m "Added generated TestPlan Excel: ${{ steps.get_filename.outputs.filename }}"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIPI_DSI_TestPlan
          path: "Test_Output/MIPI/TestPlan/${{ steps.get_filename.outputs.filename }}"
