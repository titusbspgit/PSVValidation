name: Generate TestPlan Excel

on:
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel file
        env:
          OUTPUT_DIR: Test_Output/MIPI/TestPlan
        run: |
          mkdir -p $OUTPUT_DIR
          python Test_Output/MIPI/TestPlan/excel_generator.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel"
          git push
