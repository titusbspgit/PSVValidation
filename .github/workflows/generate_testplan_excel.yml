name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/triggers/run_gpio_testplan.txt
      - .github/workflows/generate_testplan_excel.yml
      - scripts/json_to_testplan_xlsx.py
      - data/GPIO_FULL_JSON_STRUCTURE.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate GPIO TestPlan Excel
        id: gen
        env:
          GITHUB_OUTPUT: ${{ steps.gen.outputs.xlsx_path }}
        run: |
          python scripts/json_to_testplan_xlsx.py \
            --json data/GPIO_FULL_JSON_STRUCTURE.json \
            --outdir Test_Output/GPIO/TestPlan \
            --ip-name GPIO \
            --gha-output "$GITHUB_OUTPUT"

      - name: Configure git author
        run: |
          git config user.name "Ag-Emb-Mpsoc-Stage1 Bot"
          git config user.email "ci-bot@psvvalidation.local"

      - name: Commit generated Excel
        run: |
          set -e
          XLSX_PATH=$(cat .xlsx_path.txt)
          git add "$XLSX_PATH"
          git commit -m "Add autogenerated GPIO TestPlan Excel for GPIO (IST)"
          git push

