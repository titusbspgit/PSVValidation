ng_Array+0x40. Calls enumeration(): programs a sequence of SETUP/DATA/STATUS TRBs at EP0_TR_Dequeue_Pointer for GET DESCRIPTOR and GET/SET CONFIGURATIONS, rings doorbell via MIZAR_USB_BASE+0x484 for one sequence, polls for event_completion at Default_Event_Ring_Array+0x110 until non-zero. Returns to main, prints after enumeration, and calls finish(0). Default_IRQHandler reads MSK_STS0 and RAW_STCR0, if RAW_STCR0 has bit 31 set, writes IMAN=0x1 and clears RAW_STCR0 bit 31, then clears GIC IRQ 84.",
