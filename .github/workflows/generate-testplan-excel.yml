name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'
      - 'Test_Output/GPIO/TestPlan/generate_testplan_excel.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python Test_Output/GPIO/TestPlan/generate_testplan_excel.py

      - name: Commit and push generated Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILE=$(ls -t Test_Output/GPIO/TestPlan/testplan_*.xlsx | head -n 1)
          if [ -f "$FILE" ]; then
            git add "$FILE"
            git commit -m "Re-generated TestPlan Excel for GPIO from latest JSON" || echo "No changes to commit"
            git push
          else
            echo "No Excel file generated."
            exit 1
          fi
