      - name: Generate Excel
        id: gen
        shell: bash
        run: |
          EXCEL_PATH=$(python .github/scripts/generate_testplan_excel.py --input testplan_input.json --output-dir "Test_Output/USB/TestPlan" --ip-name "USB" | tail -n 1)
          echo "excel_path=$EXCEL_PATH" >> $GITHUB_OUTPUT

      - name: Commit Excel to repository
        if: always()
        env:
          EXCEL_PATH: ${{ steps.gen.outputs.excel_path }}
        run: |
          if [ -n "$EXCEL_PATH" ] && [ -f "$EXCEL_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$EXCEL_PATH"
            git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
            echo "Committed: $EXCEL_PATH"
          else
            echo "Excel file not found; generation step may have failed" >&2
            exit 1
          fi
