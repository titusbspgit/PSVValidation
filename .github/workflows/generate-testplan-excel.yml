name: Generate and Commit Test Plan Excel

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/testplan.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate-testplan-excel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          DATA_PATH: data/testplan.json
        run: |
          python scripts/generate_testplan_excel.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          git add Test_Output/GPIO/TestPlan/latest_excel_filename.txt || true
          git commit -m "Add autogenerated GPIO Test Plan Excel" || echo "No changes to commit"
          git push || true
