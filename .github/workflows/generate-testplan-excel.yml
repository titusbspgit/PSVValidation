name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'
      - 'Test_Output/GPIO/TestPlan/generate_testplan_excel.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz
      - name: Generate Excel
        run: |
          python Test_Output/GPIO/TestPlan/generate_testplan_excel.py
      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -E "^\s*M?\s*A?\s*Test_Output/GPIO/TestPlan/testplan_.*\\.xlsx"; then
            git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
            git commit -m "Re-generated TestPlan Excel for GPIO from latest JSON"
            git push
          else
            echo "No Excel changes to commit."
          fi
