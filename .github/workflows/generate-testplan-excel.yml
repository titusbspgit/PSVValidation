name: Generate and Commit USB TestPlan Excel

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - .github/scripts/generate_testplan_excel.py
      - .github/workflows/generate-testplan-excel.yml
      - .github/data/usb_testplan.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --no-input openpyxl

      - name: Compute IST timestamp
        id: ts
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          compact = now.strftime('%Y%m%d_%H%M%S')
          human = now.strftime('%Y-%m-%d %H:%M:%S')
          # also print for logs
          print(f"TS_COMPACT={compact}")
          print(f"TS_HUMAN={human}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ts_compact={compact}\n")
              f.write(f"ts_human={human}\n")
          PY

      - name: Generate Excel
        run: |
          python .github/scripts/generate_testplan_excel.py \
            --json .github/data/usb_testplan.json \
            --owner titusbspgit \
            --repo PSVValidation \
            --branch main \
            --ip USB \
            --source_subdir TestRepo/usb \
            --folder_count 2 \
            --output_dir Test_Output/USB/TestPlan/ \
            --timestamp "${{ steps.ts.outputs.ts_compact }}"

      - name: Commit and push Excel (with retry)
        shell: bash
        run: |
          set -e
          FILE="Test_Output/USB/TestPlan/USB_TestPlan_${{ steps.ts.outputs.ts_compact }}.xlsx"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add USB TestPlan Excel (IST ${{ steps.ts.outputs.ts_human }}) via automation"
          n=0
          until [ $n -ge 3 ]
          do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            n=$((n+1))
            sleep $((5 * 2**(n-1)))
          done
          echo "Push failed after retries"
          exit 1
