name: Generate and commit Test Plan Excel

on:
  push:
    paths:
      - 'scripts/generate_testplan_excel.py'
      - 'data/testplan_final.json'
      - '.github/workflows/generate-testplan-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata

      - name: Generate Excel
        run: python scripts/generate_testplan_excel.py

      - name: Commit and push Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain Test_Output/GPIO/TestPlan/)" ]; then
            git add -A Test_Output/GPIO/TestPlan/
            git commit -m "Added generated TestPlan Excel"
            git push origin HEAD:main
          else
            echo "No Excel changes to commit."
          fi
