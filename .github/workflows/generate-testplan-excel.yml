name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'
      - 'Test_Output/GPIO/TestPlan/generate_testplan_excel.py'
      - '.github/workflows/generate-testplan-excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Ensure output directory
        run: mkdir -p Test_Output/GPIO/TestPlan

      - name: Generate Excel
        run: |
          python Test_Output/GPIO/TestPlan/generate_testplan_excel.py Test_Output/GPIO/TestPlan/testplan_data.json

      - name: Read generated filename
        id: gen
        run: |
          echo "file=$(cat Test_Output/GPIO/TestPlan/.last_excel)" >> $GITHUB_OUTPUT

      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$(cat Test_Output/GPIO/TestPlan/.last_excel)"
          git commit -m "Re-generated TestPlan Excel for GPIO from latest JSON" || echo "No changes to commit"
          git push
