name: Generate and Commit Test Plan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/testplan.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate-testplan-excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python scripts/ggenerate_testplan_excel.py || python scripts/generate_testplan_excel.py

      - name: Commit and push generated Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Add autogenerated GPIO Test Plan Excel"
            git push
          else
            echo "No changes to commit."
          fi
