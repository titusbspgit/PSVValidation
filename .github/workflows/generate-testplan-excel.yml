name: Generate TestPlan Excel

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Test_Output/testplan_data.json'
      - 'Test_Output/generate_testplan_excel.py'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        run: python Test_Output/generate_testplan_excel.py

      - name: Commit generated Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/*.xlsx'
          message: 'Added generated TestPlan Excel'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
