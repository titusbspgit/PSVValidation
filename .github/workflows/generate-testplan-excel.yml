name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/testplan_data.json'
      - 'Test_Output/GPIO/TestPlan/generate_testplan_excel.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-input --upgrade openpyxl

      - name: Generate TestPlan Excel
        run: python Test_Output/GPIO/TestPlan/generate_testplan_excel.py

      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Re-generated TestPlan Excel for GPIO from latest JSON"
            git push origin HEAD:main
          fi
