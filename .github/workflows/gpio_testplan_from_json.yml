name: GPIO TestPlan from JSON (Batch 1/2)
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_gpio_testplan.py'
      - '.github/workflows/gpio_testplan_from_json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2
      - name: Generate Excel from embedded JSON
        env:
          OUTPUT_FILE_PATH: Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
        run: |
          python scripts/generate_gpio_testplan.py
      - name: Validate generated XLSX
        run: |
          python - << 'PY'
          import sys, os, zipfile
          p = 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx'
          if not os.path.exists(p):
              print('File not generated:', p); sys.exit(1)
          with zipfile.ZipFile(p, 'r') as z:
              names = set(z.namelist())
          required = {'[Content_Types].xml', 'xl/workbook.xml', 'xl/worksheets/sheet1.xml'}
          if not required.issubset(names):
              print('Invalid XLSX structure; missing:', required - names); sys.exit(1)
          print('XLSX validation passed')
          PY
      - name: Commit Excel only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
