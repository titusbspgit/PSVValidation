name: Generate Ethernet2 TestPlan Excel

on:
  push:
    paths:
      - '.github/scripts/generate_ethernet2_testplan.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python .github/scripts/generate_ethernet2_testplan.py

      - name: Commit and push generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/Ethernet/Ethernet2/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel"
          git push
