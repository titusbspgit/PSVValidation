name: Reformat GPIO Test Plan to single-sheet standard (IST)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/scripts/reformat_single_sheet_excel.py
      - Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260420_053000.xlsx

permissions:
  contents: write

jobs:
  reformat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install openpyxl
      - name: Reformat Excel (single-sheet)
        run: |
          python .github/scripts/reformat_single_sheet_excel.py "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260420_053000.xlsx"
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260420_053000.xlsx
            git commit -m "Reformat GPIO Test Plan to single-sheet standard (IST)"
            git push
          else
            echo "No changes to commit."
