name: Format GPIO TestPlan

on:
  push:
    branches: [auto/format-gpio-testplan]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: auto/format-gpio-testplan
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --upgrade pip openpyxl
      - name: Run formatter
        run: python scripts/format_gpio_testplan.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_2_hidden.xlsx
          git commit -m " TestPlan Generated and Pushed to Github" || echo "No changes to commit"
          git push origin auto/format-gpio-testplan
