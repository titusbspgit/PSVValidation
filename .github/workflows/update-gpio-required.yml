name: Update GPIO TestCase XLSX

on:
  push:
    branches:
      - ag-xlsx-access/update-gpio-required
  pull_request:
    branches:
      - main
    paths:
      - TestRepo/gpio/GPIO_TestCase.xlsx
      - scripts/update_gpio_required.py
      - .github/workflows/update-gpio-required.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run update script
        run: |
          python scripts/update_gpio_required.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TestRepo/gpio/GPIO_TestCase_Update.xlsx"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: set 'Code Generation - Required/Not Required' to 'Required' and generate GPIO_TestCase_Update.xlsx [skip ci]"
            git push
          fi
