name: Generate SPI Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_spi_testplan_excel.yml'
      - '.github/testplan_input/SPI_TestPlan.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python .github/scripts/generate_testplan_excel.py \
            --json-file .github/testplan_input/SPI_TestPlan.json \
            --ip SPI \
            --outdir Test_Output/SPI/TestPlan
      - name: Commit Excel
        run: |
          set -e
          FILE_PATH=$(git ls-files -om --exclude-standard | grep 'Test_Output/SPI/TestPlan/SPI_TestPlan_.*.xlsx' | tail -n 1 || true)
          if [ -n "$FILE_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE_PATH"
            git commit -m "Add SPI Test Plan Excel generated by Stage1 (IST timestamp in filename). [skip ci]"
            git push origin HEAD:main
            echo "COMMITTED:$FILE_PATH" >> $GITHUB_OUTPUT
          else
            echo "No Excel file found to commit."
            exit 1
          fi
