name: Format GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/scripts/format_testplan_excel.py
      - .github/workflows/format-gpio-testplan.yml

jobs:
  format-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run formatter script
        run: |
          python .github/scripts/format_testplan_excel.py --file "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260420_053000.xlsx"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260420_053000.xlsx"
          git commit -m "Format GPIO Test Plan Excel to standard (IST)" || echo "No changes to commit"
          git push
