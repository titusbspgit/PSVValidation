name: Generate Excel (Batch 1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (Batch 1)
        env:
          INPUT_JSON_PATH: Test_Output/GPIO/TestPlan/master_batch1.json
          OUTPUT_XLSX_PATH: Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
        run: |
          python tools/gen_excel.py

      - name: Validate produced XLSX
        run: |
          python - << 'PY'
          import sys, zipfile
          from openpyxl import load_workbook
          p = 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx'
          assert zipfile.is_zipfile(p), 'Not a valid XLSX (zip)'
          load_workbook(p).close()
          print('XLSX validation OK')
          PY

      - name: Commit final Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
