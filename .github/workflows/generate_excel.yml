name: Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/TestPlan/generate_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: |
          cd Test_Output/Ethernet/TestPlan
          python generate_testplan.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd Test_Output/Ethernet/TestPlan
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
