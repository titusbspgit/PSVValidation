name: Generate USB FS Device Bulk Transfer TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_USB_FS_Device_Bulk_Transfer.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/USB/TestPlan/generate_USB_FS_Device_Bulk_Transfer.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/USB/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add USB_USB_FS_Device_Bulk_Transfer_test.xlsx
          git commit -m "Added generated TestPlan Excel - USB_USB_FS_Device_Bulk_Transfer_test" || echo "No changes to commit"
          git push
