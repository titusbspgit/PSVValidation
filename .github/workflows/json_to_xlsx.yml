name: Generate Excel from JSON

on:
  push:
    paths:
      - '.github/workflows/json_to_xlsx.yml'
      - 'data/json/testing_excel_local.json'
      - 'scripts/json_to_xlsx.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-input openpyxl
      - run: python scripts/json_to_xlsx.py
      - name: Commit and push Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Excel export of 4 rows from JSON (UTC ${TS})"
          git push
