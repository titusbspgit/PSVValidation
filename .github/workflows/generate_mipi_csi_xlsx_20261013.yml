name: Generate MIPI CSI TestPlan XLSX 20261013

on:
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX
        run: python Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261013_160000.py

      - name: Verify XLSX
        run: |
          FILE="Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_20261013_160000.xlsx"
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE")
            echo "File exists: $FILE ($SIZE bytes)"
            if [ "$SIZE" -gt 1000 ]; then
              echo "VALIDATION: PASSED - File size is valid"
            else
              echo "VALIDATION: FAILED - File too small"
              exit 1
            fi
          else
            echo "VALIDATION: FAILED - File not found"
            exit 1
          fi

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_20261013_160000.xlsx
          git diff --cached --quiet || git commit -m "Generated TestPlan Excel Workbook - MIPI_CSI_20261013_160000"
          git push
