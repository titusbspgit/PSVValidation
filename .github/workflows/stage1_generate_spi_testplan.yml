name: Stage1 Generate SPI TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/stage1_generate_spi_testplan.yml'
      - 'tools/generate_spi_stage1_testplan_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-spi-testplan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Compute IST timestamp
        id: ist
        run: |
          echo "ts=$(python - <<'PY'
from datetime import datetime
from zoneinfo import ZoneInfo
print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y%m%d_%H%M%S'))
PY
)" >> $GITHUB_OUTPUT

      - name: Generate SPI TestPlan Excel (Stage1)
        env:
          TIMESTAMP_IST: ${{ steps.ist.outputs.ts }}
        run: |
          python tools/generate_spi_stage1_testplan_excel.py --timestamp "$TIMESTAMP_IST" --ip-name "SPI"

      - name: Commit Excel artifact to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/SPI/TestPlan/SPI_TestPlan_${{ steps.ist.outputs.ts }}.xlsx"
          git commit -m "Add SPI TestPlan Excel generated on ${{ steps.ist.outputs.ts }} IST (IP=SPI, auto-generated by Stage1)"
          git push
