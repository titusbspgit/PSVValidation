name: Generate Ethernet0 TestPlan Excel

on:
  push:
    paths:
      - '.github/scripts/generate_ethernet0_testplan.py'
      - '.github/workflows/generate_ethernet0_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python .github/scripts/generate_ethernet0_testplan.py

      - name: List generated files
        run: ls -la Test_Output/Ethernet/Ethernet0/TestPlan/

      - name: Commit and push generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/Ethernet/Ethernet0/TestPlan/*.xlsx
          git status
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
