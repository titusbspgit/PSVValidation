name: Generate and commit GPIO Test Plan Excel

on:
  push:
    paths:
      - .github/workflows/gpio_testplan_stage1.yml
      - scripts/generate_gpio_testplan_excel.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from embedded JSON (Stage1 rules)
        run: |
          python scripts/generate_gpio_testplan_excel.py

      - name: Compute IST timestamp for commit message
        id: ist
        run: |
          python - << 'PY'
          from datetime import datetime
          try:
              from zoneinfo import ZoneInfo
          except Exception:
              ZoneInfo = None
          if ZoneInfo:
              ist = datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S')
          else:
              # Fallback: approximate IST as UTC+5:30 without DST
              from datetime import timedelta, timezone
              ist = datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y-%m-%d %H:%M:%S')
          print(f"IST_TIME={ist}")
          with open("ist_time.txt", "w") as f:
              f.write(ist)
          PY

      - name: Find latest generated Excel file
        id: findfile
        shell: bash
        run: |
          set -e
          FILE=$(ls -t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1)
          echo "Found file: $FILE"
          echo "FILE=$FILE" >> $GITHUB_OUTPUT

      - name: Commit Excel file
        env:
          IST_TIME: ${{ steps.ist.outputs.IST_TIME }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="${{ steps.findfile.outputs.FILE }}"
          if [ -z "$FILE" ]; then echo "No Excel file found"; exit 1; fi
          echo "Staging $FILE"
          git add -f "$FILE"
          # Read IST time from file to ensure non-empty
          IST_MSG=$(cat ist_time.txt || true)
          if [ -z "$IST_MSG" ]; then IST_MSG="$(date +"%Y-%m-%d %H:%M:%S")"; fi
          git commit -m "Add autogenerated GPIO Test Plan (IST $IST_MSG)" || echo "No changes to commit"
          git push || echo "No changes pushed"
