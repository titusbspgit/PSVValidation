name: Excel Meta Split (TestPlan)

on:
  push:
    paths:
      - 'tools/excel_meta_split.py'
      - 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_new.xlsx'
      - '.github/workflows/excel-meta-split.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install --upgrade pip openpyxl
      - name: Run Excel META split and formatting
        env:
          INPUT_FILE: Test_Output/GPIO/TestPlan/GPIO_TestPlan_new.xlsx
          OUTPUT_FILE: Test_Output/GPIO/TestPlan/GPIO_TestPlan_new_hidden.xlsx
          COMMIT_CHANGES: 'true'
          COMMIT_MESSAGE: '[MPSoC-TestPlan] Format GPIO Test Plan Excel (hidden columns)'
        run: |
          python tools/excel_meta_split.py
