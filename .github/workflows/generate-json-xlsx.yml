name: Generate JSON Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/json_to_xlsx.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --no-input --disable-pip-version-check openpyxl

      - name: Generate Excel from embedded JSON
        run: |
          python tools/json_to_xlsx.py

      - name: Commit generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TestRepo/gpio/json_Tester.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated Excel file from JSON input"
            git push
          fi
