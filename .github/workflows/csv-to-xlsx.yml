name: CSV to XLSX
on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/*.csv'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
      - name: Convert CSV to XLSX
        shell: bash
        run: |
          python - << 'PY'
          import os, glob, pandas as pd
          base_dir = 'Test_Output/GPIO/TestPlan'
          os.makedirs(base_dir, exist_ok=True)
          for csv_path in glob.glob(os.path.join(base_dir, '*.csv')):
              xlsx_path = os.path.splitext(csv_path)[0] + '.xlsx'
              df = pd.read_csv(csv_path)
              with pd.ExcelWriter(xlsx_path, engine='openpyxl') as writer:
                  df.to_excel(writer, index=False)
          PY
      - name: Commit XLSX
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/*.xlsx'
          message: 'Add XLSX generated from CSV [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
