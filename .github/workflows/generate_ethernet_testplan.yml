name: Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/create_workbook.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan/
          python3 create_workbook.py
          echo "Generated files:"
          ls -la *.xlsx

      - name: Commit and push workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd Test_Output/Ethernet/Ethernet0/TestPlan/
          git add *.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
