name: Generate Ethernet TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/generate_workbook_v3.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate workbook
        run: |
          cd Test_Output/Ethernet/Ethernet0/TestPlan
          python generate_workbook_v3.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/Ethernet/Ethernet0/TestPlan/*.xlsx'
          git commit -m 'Generated TestPlan Excel Workbook' || echo 'No changes'
          git push
