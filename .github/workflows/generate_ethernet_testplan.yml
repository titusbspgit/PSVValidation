name: Generate Ethernet TestPlan Excel Workbook
on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/agent7_workbook_gen.py'
jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python Test_Output/Ethernet/Ethernet0/TestPlan/agent7_workbook_gen.py
      - run: |
          git config user.name 'Agent7-Excel-Generator'
          git config user.email 'agent7@generator.bot'
          git add 'Test_Output/Ethernet/Ethernet0/TestPlan/Ethernet_TestPlan_*.xlsx'
          git commit -m 'Generated TestPlan Excel Workbook' || echo 'No changes'
          git push
