name: Generate Ethernet TestPlan Excel Workbook

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate_ethernet_testplan.yml'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Workbook
        run: python Test_Output/Ethernet/Ethernet0/TestPlan/generate_workbook_agent7_inline.py
        working-directory: ${{ github.workspace }}

      - name: Move workbook to output directory
        run: |
          mv Ethernet_TestPlan_*.xlsx Test_Output/Ethernet/Ethernet0/TestPlan/ 2>/dev/null || true

      - name: Commit and Push
        run: |
          git config user.name 'Agent7-Excel-Generator'
          git config user.email 'agent7@generator.bot'
          git add Test_Output/Ethernet/Ethernet0/TestPlan/Ethernet_TestPlan_*.xlsx
          git commit -m 'Generated TestPlan Excel Workbook' || echo 'No changes to commit'
          git push
