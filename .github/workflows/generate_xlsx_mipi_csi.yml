name: Generate MIPI CSI TestPlan XLSX

on:
  push:
    paths:
      - '.github/workflows/generate_xlsx_mipi_csi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python agent7_generate_xlsx_inline.py
      - name: Find and commit generated XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_*.xlsx"
          git diff --cached --quiet || (git commit -m "Generated TestPlan Excel Workbook" && git push)
