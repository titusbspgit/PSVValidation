name: Generate MIPI CSI TestPlan XLSX

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_mipi_csi_testplan_20261027_173000.py
      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_*.xlsx"
          git commit -m "Generated TestPlan Excel Workbook" || echo "No changes"
          git push
