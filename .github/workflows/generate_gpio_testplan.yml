name: Generate and Push GPIO TestPlan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel
        run: |
          python - << 'PY'
          import json, os
          from datetime import datetime
          import pytz
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          # EXACT aggregated JSON (order preserved)
          data_json = r'''[
  {
    "Index": "1",
    "SS / Module": "GPIO",
    "Feature": "NA",
    "Test Case Name": "gpio_reg_wr_rd_test",
    "Test Description": "Read GPIO GP0 pin registers 8–27 and capture current values.",
    "Meta Test Description": "Sequential register reads are performed for the GPIO GP0 pin register macros MIZAR_GPIO_GP0_GPIO_8 through MIZAR_GPIO_GP0_GPIO_27. Each macro is read to obtain its current 32-bit value. No write operations, interrupts, timing, or explicit assertions are defined in the provided artifacts.",
    "Speed": "NA",
    "Mode": "NA",
    "Memory Start Offset": "NA",
    "Memory End Offset": "NA",
    "Remarks": "NA",
    "Test Steps / Procedure": "1) Read GPIO GP0 pin registers 8–27. 2) Record the values read for each register. 3) Store the log for reference.",
    "Meta Test Steps / Procedure": "For each register macro in order: MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_GPIO_9, MIZAR_GPIO_GP0_GPIO_10, MIZAR_GPIO_GP0_GPIO_11, MIZAR_GPIO_GP0_GPIO_12, MIZAR_GPIO_GP0_GPIO_13, MIZAR_GPIO_GP0_GPIO_14, MIZAR_GPIO_GP0_GPIO_15, MIZAR_GPIO_GP0_GPIO_16, MIZAR_GPIO_GP0_GPIO_17, MIZAR_GPIO_GP0_GPIO_18, MIZAR_GPIO_GP0_GPIO_19, MIZAR_GPIO_GP0_GPIO_20, MIZAR_GPIO_GP0_GPIO_21, MIZAR_GPIO_GP0_GPIO_22, MIZAR_GPIO_GP0_GPIO_23, MIZAR_GPIO_GP0_GPIO_24, MIZAR_GPIO_GP0_GPIO_25, MIZAR_GPIO_GP0_GPIO_26, MIZAR_GPIO_GP0_GPIO_27: perform a 32-bit read via memory-mapped access; capture and log the returned value. No conditional checks, loops beyond sequential iteration, delays, or error handlers are specified.",
    "Impacted Registers": "NA",
    "Meta Impacted Registers": "MIZAR_GPIO_GP0_GPIO_8;MIZAR_GPIO_GP0_GPIO_9;MIZAR_GPIO_GP0_GPIO_10;MIZAR_GPIO_GP0_GPIO_11;MIZAR_GPIO_GP0_GPIO_12;MIZAR_GPIO_GP0_GPIO_13;MIZAR_GPIO_GP0_GPIO_14;MIZAR_GPIO_GP0_GPIO_15;MIZAR_GPIO_GP0_GPIO_16;MIZAR_GPIO_GP0_GPIO_17;MIZAR_GPIO_GP0_GPIO_18;MIZAR_GPIO_GP0_GPIO_19;MIZAR_GPIO_GP0_GPIO_20;MIZAR_GPIO_GP0_GPIO_21;MIZAR_GPIO_GP0_GPIO_22;MIZAR_GPIO_GP0_GPIO_23;MIZAR_GPIO_GP0_GPIO_24;MIZAR_GPIO_GP0_GPIO_25;MIZAR_GPIO_GP0_GPIO_26;MIZAR_GPIO_GP0_GPIO_27",
    "Validation / Acceptance Criteria": "NA",
    "Meta Validation / Acceptance Criteria": "NA",
    "Code Generation (Required / Not)": "Not",
    "Meta Headers": "NA",
    "Meta Macros": "NA",
    "Meta Arrays": "NA"
  }
]'''

          rows = json.loads(data_json)
          assert isinstance(rows, list)

          # Derive headers preserving appearance order
          keys = list(rows[0].keys()) if rows else []
          testplan_headers = [k for k in keys if not k.startswith('Meta ')]
          meta_headers = ['Index', 'Test Case Name'] + [k for k in keys if k.startswith('Meta ')]

          wb = Workbook()
          ws = wb.active
          ws.title = 'TestPlan'
          ws_meta = wb.create_sheet('MetaData')

          # Headers
          ws.append(testplan_headers)
          ws_meta.append(meta_headers)

          # Rows (single row input)
          def gv(d, k):
              return d.get(k, '')

          for r in rows:
              ws.append([gv(r, k) for k in testplan_headers])
              ws_meta.append([gv(r, 'Index'), gv(r, 'Test Case Name')] + [gv(r, k) for k in keys if k.startswith('Meta ')])

          # Formatting
          header_font = Font(bold=True)
          header_fill = PatternFill('solid', fgColor='FFD9E1F2')
          align_wrap = Alignment(wrap_text=True, vertical='top')

          for c in ws[1]:
              c.font = header_font
              c.fill = header_fill
              c.alignment = align_wrap
          for c in ws_meta[1]:
              c.font = header_font
              c.fill = header_fill
              c.alignment = align_wrap

          for row in ws.iter_rows(min_row=2):
              for c in row:
                  c.alignment = align_wrap
          for row in ws_meta.iter_rows(min_row=2):
              for c in row:
                  c.alignment = align_wrap

          # Freeze first row
          ws.freeze_panes = 'A2'
          ws_meta.freeze_panes = 'A2'

          # Column widths
          def autosize(sheet, min_w=12, max_w=60):
              for idx, col in enumerate(sheet.columns, start=1):
                  maxlen = 0
                  for cell in col:
                      v = '' if cell.value is None else str(cell.value)
                      if len(v) > maxlen:
                          maxlen = len(v)
                  width = max(min_w, min(maxlen + 2, max_w))
                  sheet.column_dimensions[get_column_letter(idx)].width = width

          autosize(ws)
          autosize(ws_meta)

          # Very hide MetaData sheet
          ws_meta.sheet_state = 'veryHidden'

          # IST timestamp
          tz = pytz.timezone('Asia/Kolkata')
          now = datetime.now(tz)
          datestr = now.strftime('%Y%m%d')
          timestr = now.strftime('%H%M%S')

          # Paths
          out_dir = os.path.join('Test_Output', 'GPIO', 'TestPlan')
          os.makedirs(out_dir, exist_ok=True)
          filename = f'GPIO_TestPlan_{datestr}_{timestr}.xlsx'
          out_path = os.path.join(out_dir, filename)

          wb.save(out_path)
          print(f'Wrote: {out_path}')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COMMIT_TS=$(TZ=Asia/Kolkata date +'%Y%m%d_%H%M%S')
            git commit -m "Add GPIO TestPlan ${COMMIT_TS}"
            git push origin HEAD:main
          fi
