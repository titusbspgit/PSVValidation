name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'testplan_specs/GPIO_final_json.json'
      - 'tools/generate_gpio_testplan.py'
      - '.github/workflows/generate_gpio_testplan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel TestPlan (IST timestamped)
        run: |
          python tools/generate_gpio_testplan.py

      - name: Commit and push Excel
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@example.com"
          git add -A
          git commit -m "Add GPIO TestPlan Excel via workflow (IST timestamp in filename)" || echo "No changes to commit"
          git push origin HEAD:main