name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - 'scripts/gpio_testplan_input.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_gpio_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Stage1-formatted Excel (IST timestamp)
        env:
          TZ: Asia/Kolkata
        run: |
          python scripts/generate_testplan_excel.py \
            --input scripts/gpio_testplan_input.json \
            --out-dir Test_Output/GPIO/TestPlan \
            --ip-name GPIO
      - name: Commit finalized Excel only
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/*.xlsx'
          message: 'Add autogenerated test plan for GPIO'
          default_author: github_actions
