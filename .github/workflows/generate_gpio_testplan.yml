name: Generate GPIO TestPlan

on:
  push:
    paths:
      - tools/gpio_testplan_input.json
      - tools/generate_testplan_gpio.py
      - tools/validate_xlsx_gpio.py
      - .github/workflows/generate_gpio_testplan.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python tools/generate_testplan_gpio.py
      - name: Validate Excel (Stage1 rules)
        run: python tools/validate_xlsx_gpio.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TS=$(python - << 'PY'
from datetime import datetime
import zoneinfo
print(datetime.now(zoneinfo.ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S IST'))
PY
)
            git commit -m "GPIO: Add autogenerated TestPlan (IST $TS)"
            git push
          fi
