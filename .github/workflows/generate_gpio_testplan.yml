name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/gpio_testplan_input.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON (Stage1 formatting)
        env:
          TZ: Asia/Kolkata
        run: |
          python scripts/generate_gpio_testplan.py scripts/gpio_testplan_input.json Test_Output/GPIO/TestPlan GPIO
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ls Test_Output/GPIO/TestPlan/*.xlsx 1> /dev/null 2>&1; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Add autogenerated test plan for GPIO"
            git push
          else
            echo "No Excel generated to commit."
          fi
