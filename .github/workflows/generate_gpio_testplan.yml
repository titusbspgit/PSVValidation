name: Generate GPIO TestPlan Excel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --upgrade pip openpyxl
      - name: Generate Excel
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: python tools/generate_gpio_testplan.py
      - name: Commit Excel
        run: |
          FILES=$(ls Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx)
          if [ -z "$FILES" ]; then
            echo "No Excel generated"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
