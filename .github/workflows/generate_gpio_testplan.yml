name: Generate GPIO TestPlan\n\non:\n  workflow_dispatch: {}\n  push:\n    paths:\n      - .github/workflows/generate_gpio_testplan.yml\n      - .github/scripts/generate_testplan_gpio.py\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.x'\n\n      - name: Install dependencies\n        run: |\n          python -m pip install --upgrade pip\n          pip install openpyxl\n\n      - name: Generate Excel\n        env:\n          FINAL_JSON: |\n            [\n              {\n                "stage": "Stage 6-7 result",\n                "repo": "titusbspgit/PSVValidation",\n                "branch": "main",\n                "output_directory": "Test_Output/GPIO/TestPlan/",\n                "file_name": "GPIO_TestPlan_20260811_000000.xlsx",\n                "ist_timestamp_token": "20260811_000000",\n                "commit": {\n                  "sha": "e52d320a93ddff3534562dddfe1c3da3c1ddf93c",\n                  "message": "Add GPIO TestPlan (GPIO_TestPlan_20260811_000000.xlsx) [IST]",\n                  "file_path": "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260811_000000.xlsx",\n                  "github_url": "https://github.com/titusbspgit/PSVValidation/blob/main/Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260811_000000.xlsx",\n                  "raw_url": "https://raw.githubusercontent.com/titusbspgit/PSVValidation/main/Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260811_000000.xlsx"\n                },\n                "verification": {\n                  "ref": "refs/heads/main",\n                  "object_type": "commit",\n                  "object_sha": "e52d320a93ddff3534562dddfe1c3da3c1ddf93c"\n                }\n              }\n            ]\n          OUTPUT_DIR: Test_Output/GPIO/TestPlan/\n          IP_NAME: GPIO\n        run: |\n          python .github/scripts/generate_testplan_gpio.py\n\n      - name: Commit and push\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "github-actions[bot]@users.noreply.github.com"\n          git add -A\n          if git diff --cached --quiet; then\n            echo "No changes to commit."\n          else\n            git commit -m "Add GPIO TestPlan (auto-generated via workflow)"\n            git push\n          fi\n