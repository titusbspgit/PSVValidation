name: Generate GPIO TestPlan Excel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git commit -m "Add GPIO TestPlan Excel (auto-generated by workflow)" || echo "No changes to commit"
          git push
