    "Remarks": "Requires platform support for read_reg, write_reg, and finish functions. Registers marked in the skip lists are intentionally not exercised. Reset-value comparison ignores bit 0 of the read value. The optional soft reset sequence is disabled in this build.",
    "Test Steps / Procedure": "1. For each of the registers gp0_gpio_8 through gp0_gpio_30: if the register is not marked as skipped and is readable, read the register and verify its reset value matches the expected value with bit 0 ignored.\n2. For each of six predefined data patterns, and for each register gp0_gpio_8 through gp0_gpio_30: if the register is not marked as skipped and is writable and readable, write the pattern masked by the write mask, then read back and verify the masked value equals the expected combination of written bits and preserved default bits for non-writable fields.\n3. Declare PASS only if all applicable reset checks and write/read checks pass across all patterns and registers; otherwise declare FAIL.",
    "Meta Test Steps / Procedure": "Entry: test_case()\n1) Call chk_rst_val():\n   - Loop i = 0..CNT-1:\n     a) addr = addr_array[i]\n     b) If (skip_rst_array[i] == 1) continue\n     c) If (read_mask_array[i] == 0x00000000) continue\n     d) data_rd = read_reg(addr)\n     e) data = (data_rd & 0xfffffffe)\n     f) If (data == default_value_array[i]) -> PASS (optional print under DEBUG_DISPLAY); else def_fail_cnt++ and print failure details\n2) Call chk_rd_wr():\n   - Define patterns chk_val[6] = {0xffffffff, 0xaaaaaaaa, 0x55555555, 0xf5f5f5f5, 0xA5A5A5A5, 0xffff0000}\n   - For each j = 0..5:\n     a) data_wr = chk_val[j]\n     b) Write phase loop i = 0..CNT-1:\n        i) addr = addr_array[i]\n        ii) If (skip_array[i] == 1) continue\n        iii) If (write_mask_array[i] == 0x00000000) continue\n        iv) write_reg(addr, (data_wr & write_mask_array[i])) (optional print under DEBUG_DISPLAY)\n     c) Read/verify phase loop i = 0..CNT-1:\n        i) addr = addr_array[i]\n        ii) If (skip_array[i] == 1) continue\n        iii) If (write_mask_array[i] == 0x00000000) continue\n        iv) If (read_mask_array[i] == 0x00000000) continue\n        v) data_rd = (read_reg(addr) & read_mask_array[i])\n        vi) wr_n = (write_mask_array[i] ^ 0xffffffff)\n        vii) exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i]))\n        viii) If (data_rd == exp_val) -> PASS (optional print under DEBUG_DISPLAY); else wr_fail_cnt++ and print failure details\n3) Completion:\n   - If (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0)\n4) soft_reset_chk() is compiled out (#ifdef 0); if enabled, it would read default from SOFT_RST_REG_ADDRESS, write SOFT_RST_REG_DATA, wait_on(1000), restore default, and wait_on(1000).",
