name: Generate GPIO TestPlan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --upgrade openpyxl

      - name: Write JSON input to temp file
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/json_input.json" << 'JSON'
{ "TC1": { "Index": "1", "SS / Module": "GPIO", "Feature": "AHB 32-bit register interface", "Test Case Name": "gpio_reg_wr_rd_test", "Test Description": "Verifies default reset values and masked read/write behavior across per-pin and group control registers for the GPIO instance, including read/write mask handling and expected value computation using default values for non-writable bits.", "Speed": "NA", "Mode": "NA", "Memory Start Offset": "NA", "Memory End Offset": "NA", "Remarks": "Certain registers are intentionally skipped for write/read operations and/or default reset checks per provided skip lists. Default value comparison masks out the least significant bit. A note indicates that reading default values can be affected by input behavior if external drive is not controlled.", "Test Steps / Procedure": [ "Start the test and run default reset value verification over the addressed GPIO registers defined by the register table.", "For each addressed register entry in order: if a reset-check skip flag is set, skip it; else if the register is not readable per its mask, skip it; otherwise read the register value and mask off the least significant bit, then compare against the corresponding expected default value; record a failure if the comparison mismatches.", "Proceed to write/read verification across the same addressed register table using six predefined data patterns.", "For each data pattern: for each addressed register entry in order: if a write/read skip flag is set, skip it; else if the register is not writable per its mask, skip the write; otherwise write the pattern masked by the register’s write mask.", "For each data pattern: after writes, for each addressed register entry in order: if a write/read skip flag is set, skip; else if the register is not writable or not readable per their masks, skip; otherwise read and mask the value with the register’s read mask, compute the expected value by combining the written pattern on writable and readable bits with the default value on non-writable readable bits, and compare; record a failure on any mismatch.", "Complete the test by reporting pass if no failures were recorded during default checks and write/read checks; otherwise report fail." ], "Impaired Registers": "NA", "Impacted Registers": [ "GPIO_GP0_GPIO_8", "GPIO_GP0_GPIO_9", "GPIO_GP0_GPIO_10", "GPIO_GP0_GPIO_11", "GPIO_GP0_GPIO_12", "GPIO_GP0_GPIO_13", "GPIO_GP0_GPIO_14", "GPIO_GP0_GPIO_15", "GPIO_GP0_GPIO_16", "GPIO_GP0_GPIO_17", "GPIO_GP0_GPIO_18", "GPIO_GP0_GPIO_19", "GPIO_GP0_GPIO_20", "GPIO_GP0_GPIO_21", "GPIO_GP0_GPIO_22", "GPIO_GP0_GPIO_23", "GPIO_GP0_GPIO_24", "GPIO_GP0_GPIO_25", "GPIO_GP0_GPIO_26", "GPIO_GP0_GPIO_27", "GPIO_GP0_GPIO_28", "GPIO_GP0_GPIO_29", "GPIO_GP0_GPIO_30", "GPIO_GP0_GPIO_31", "GPIO_GP0_GPIO_32", "GPIO_GP0_GPIO_33", "GPIO_GP0_GPIO_34", "GPIO_GP0_GPIO_35", "GPIO_GP0_GPIO_36", "GPIO_GP0_GPIO_37", "GPIO_GP0_GPIO_38", "GPIO_GP0_GPIO_39", "GPIO_INTR_RAW_STCLR1", "GPIO_GP0_INTR1_INTR_EN1", "GPIO_GP0_INTR1_INTR_STS1", "GPIO_IO_CTRL_GROUP1", "GPIO_IO_CTRL_GROUP2", "GPIO_IO_CTRL_GROUP3", "GPIO_IO_CTRL_GROUP4", "GPIO_DOUT_GROUP1", "GPIO_DOUT_GROUP2", "GPIO_DOUT_GROUP3", "GPIO_DOUT_GROUP4", "GPIO_DIN_GROUP1", "GPIO_DIN_GROUP2", "GPIO_DIN_GROUP3", "GPIO_DIN_GROUP4" ], "Validation / Acceptance Criteria": [ "Default reset verification: For every addressed, readable, and not-skip register, the read value with the least significant bit cleared must equal the expected default value.", "Write/read verification: For every addressed, readable, and writable register and for each data pattern, the read value masked by the read mask must equal the combination of the written pattern on writable/readable bits and the default value on non-writable/readable bits.", "Overall result: The test passes only if no mismatches are recorded in both default checks and write/read checks; otherwise it fails." ], "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "gpio_reg_wr_rd_test", "Hidden_Test_Description": "Checks default reset values for a list of GPIO registers and verifies masked write/read behavior across multiple data patterns, using per-register read/write masks and default values. Default comparison uses (data_rd & 0xfffffffe).", "Hidden_Remarks": "Skip lists are applied: skip_array and skip_rst_array control which addresses are skipped for write/read or reset checks. Comment notes: 'SKIPPING VRRW registers'. Default value comparison masks off bit0. Additional note: 'when reading default values the din value is becoming 1 automatically if we don't force any value,but if we force zero to din bit level sel becoming high,so that reding value not matched with expected value'.", "Hidden_Test_Steps_Procedure": [ "Entry: test_case()", "Call chk_rst_val(): for i=0..(CNT-1) with CNT=49; addr = addr_array[i]; if (skip_rst_array[i] == 1) continue; if (read_mask_array[i] == 0x00000000) continue; data_rd = read_reg(addr); data = (data_rd & 0xfffffffe); if (data == default_value_array[i]) pass; else def_fail_cnt++ and print failure.", "Call chk_rd_wr(): define chk_val[6] = {0xffffffff, 0xaaaaaaaa, 0x55555555, 0xf5f5f5f5, 0xA5A5A5A5, 0xffff0000}; For each j=0..5 set data_wr=chk_val[j]:", "Write phase loop: for i=0..(CNT-1): addr = addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0x00000000) continue; else write_reg(addr, (data_wr & write_mask_array[i])).", "Read/verify phase loop: for i=0..(CNT-1): addr = addr_array[i]; if (skip_array[i] == 1) continue; if (write_mask_array[i] == 0x00000000) continue; if (read_mask_array[i] == 0x00000000) continue; data_rd = (read_reg(addr) & read_mask_array[i]); wr_n = (write_mask_array[i] ^ 0xffffffff); exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])); if (data_rd == exp_val) pass; else wr_fail_cnt++ and print mismatch.", "Exit: if (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0)." ], "Hidden_Impacted_Registers": [ "MIZAR_GPIO_GP0_GPIO_8", "MIZAR_GPIO_GP0_GPIO_9", "MIZAR_GPIO_GP0_GPIO_10", "MIZAR_GPIO_GP0_GPIO_11", "MIZAR_GPIO_GP0_GPIO_12", "MIZAR_GPIO_GP0_GPIO_13", "MIZAR_GPIO_GP0_GPIO_14", "MIZAR_GPIO_GP0_GPIO_15", "MIZAR_GPIO_GP0_GPIO_16", "MIZAR_GPIO_GP0_GPIO_17", "MIZAR_GPIO_GP0_GPIO_18", "MIZAR_GPIO_GP0_GPIO_19", "MIZAR_GPIO_GP0_GPIO_20", "MIZAR_GPIO_GP0_GPIO_21", "MIZAR_GPIO_GP0_GPIO_22", "MIZAR_GPIO_GP0_GPIO_23", "MIZAR_GPIO_GP0_GPIO_24", "MIZAR_GPIO_GP0_GPIO_25", "MIZAR_GPIO_GP0_GPIO_26", "MIZAR_GPIO_GP0_GPIO_27", "MIZAR_GPIO_GP0_GPIO_28", "MIZAR_GPIO_GP0_GPIO_29", "MIZAR_GPIO_GP0_GPIO_30", "MIZAR_GPIO_GP0_GPIO_31", "MIZAR_GPIO_GP0_GPIO_32", "MIZAR_GPIO_GP0_GPIO_33", "MIZAR_GPIO_GP0_GPIO_34", "MIZAR_GPIO_GP0_GPIO_35", "MIZAR_GPIO_GP0_GPIO_36", "MIZAR_GPIO_GP0_GPIO_37", "MIZAR_GPIO_GP0_GPIO_38", "MIZAR_GPIO_GP0_GPIO_39", "MIZAR_GPIO_GPIO_INTR_RAW_STCLR1", "MIZAR_GPIO_GP0_INTR1_INTR_EN1", "MIZAR_GPIO_GP0_INTR1_INTR_STS1", "MIZAR_GPIO_GP0_INTR2_INTR_EN1", "MIZAR_GPIO_GP0_INTR2_INTR_STS1", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP1", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP2", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP3", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP4", "MIZAR_GPIO_GPIO_DOUT_GROUP1", "MIZAR_GPIO_GPIO_DOUT_GROUP2", "MIZAR_GPIO_GPIO_DOUT_GROUP3", "MIZAR_GPIO_GPIO_DOUT_GROUP4", "MIZAR_GPIO_GPIO_DIN_GROUP1", "MIZAR_GPIO_GPIO_DIN_GROUP2", "MIZAR_GPIO_GPIO_DIN_GROUP3", "MIZAR_GPIO_GPIO_DIN_GROUP4" ], "Hidden_Validation_Acceptance_Criteria": [ "In chk_rst_val(): For each i where skip_rst_array[i]==0 and read_mask_array[i]!=0, (read_reg(addr_array[i]) & 0xfffffffe) must equal default_value_array[i].", "In chk_rd_wr(): For each data pattern j and each i where skip_array[i]==0, read_mask_array[i]!=0, write_mask_array[i]!=0: data_rd=(read_reg(addr_array[i]) & read_mask_array[i]) must equal exp_val=((data_wr & read_mask_array[i] & write_mask_array[i]) | ((write_mask_array[i]^0xffffffff) & read_mask_array[i] & default_value_array[i])).", "finish(0) only if def_fail_cnt==0 and wr_fail_cnt==0; otherwise finish(1)." ] }, "TC2": { "Index": "2", "SS / Module": "GPIO", "Feature": "Negative edge detection at GPIO input", "Test Case Name": "test_gpio_negedge_intr_en", "Test Description": "Configures all GPIO pins of the instance for input with negative-edge detection, enables the group interrupt output, generates one falling edge per pin in sequence, and validates interrupt assertion, per-pin raw status, and proper clearing.", "Speed": "NA", "Mode": "Interrupt", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "Interrupt controller enable and system-interrupt enable are compiled conditionally for GPIO instances. Each pin is pre-configured to input mode with negative-edge detection and its raw status cleared before testing. An interrupt wait uses a timeout to avoid infinite loops.", "Test Steps / Procedure": [ "Start the test by enabling the appropriate interrupt in the interrupt controller and enabling the system-level interrupt output for the selected GPIO instance.", "Drive the external pad control to a known state (all high).", "Configure all per-pin control registers in the instance for input mode, enable negative-edge detection, and clear any per-pin raw status.", "For each pin in the instance: clear the corresponding raw status at the group level, enable only that pin in the group enable register, arm the wait flag, generate a falling edge on the external pad for that pin, and wait with a bounded timeout until the interrupt service routine clears the wait flag.", "In the interrupt service routine: de-assert the wait flag, restore the external pad drive to a known state, read the per-pin control/status register and confirm the input level is low after the falling edge, verify the group status reflects the current pin, clear per-pin raw status and the corresponding group raw status, and verify the group status clears to zero. Finally, clear the system-level raw status for the instance and clear the interrupt in the interrupt controller.", "Finish the test with pass when no timeouts or verification errors are recorded; otherwise fail." ], "Impaired Registers": "NA", "Impacted Registers": [ "GPIO_GP0_GPIO_8", "GPIO_GP0_GPIO_9", "GPIO_GP0_GPIO_10", "GPIO_GP0_GPIO_11", "GPIO_GP0_GPIO_12", "GPIO_GP0_GPIO_13", "GPIO_GP0_GPIO_14", "GPIO_GP0_GPIO_15", "GPIO_GP0_GPIO_16", "GPIO_GP0_GPIO_17", "GPIO_GP0_GPIO_18", "GPIO_GP0_GPIO_19", "GPIO_GP0_GPIO_20", "GPIO_GP0_GPIO_21", "GPIO_GP0_GPIO_22", "GPIO_GP0_GPIO_23", "GPIO_GP0_GPIO_24", "GPIO_GP0_GPIO_25", "GPIO_GP0_GPIO_26", "GPIO_GP0_GPIO_27", "GPIO_GP0_GPIO_28", "GPIO_GP0_GPIO_29", "GPIO_GP0_GPIO_30", "GPIO_GP0_GPIO_31", "GPIO_GP0_GPIO_32", "GPIO_GP0_GPIO_33", "GPIO_GP0_GPIO_34", "GPIO_GP0_GPIO_35", "GPIO_GP0_GPIO_36", "GPIO_GP0_GPIO_37", "GPIO_GP0_GPIO_38", "GPIO_GP0_GPIO_39", "GPIO_INTR_RAW_STCLR1", "GPIO_GP0_INTR1_INTR_EN1", "GPIO_GP0_INTR1_INTR_STS1" ], "Validation / Acceptance Criteria": [ "For each pin tested, no timeout occurs while waiting for the interrupt after generating a falling edge.", "In the interrupt handler, the input level for the active pin is low after the falling edge.", "The group status indicates the active pin during service and is confirmed cleared after raw status clear operations.", "The system-level raw status for the instance is cleared before returning from the handler.", "Overall test result is pass only if no errors were recorded." ], "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_negedge_intr_en", "Hidden_Test_Description": "Enables GPIO instance interrupt, configures GPIO[8..39] for input with negedge interrupt (doe=1, neie=1, iclr=1), iterates pins to generate falling edges via write_reg(0xA0243ffc, ~wr_val), waits for Default_IRQHandler() to clear int_pend, and validates per-pin DIN==0, raw/group status handling, and sysreg/GIC clears.", "Hidden_Remarks": "Conditional enables: GIC_EnableIRQ(87) and LSS sysreg enable for GPIO0; GIC_EnableIRQ(88) and LSS sysreg enable for GPIO1. Each pin write uses addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4) with value ((1<<20)|(1<<18)|(1<<16)) for doe=1, neie=1, iclr=1. Pre-clears MIZAR_GPIO_GPIO_INTR_RAW_STCLR1 with 1u<<i, then enables only that bit in MIZAR_GPIO_GP0_INTR1_INTR_EN1. Uses a bounded wait with timeout=5000 and wait_on(10) in the loop.", "Hidden_Test_Steps_Procedure": [ "Entry: test_case()", "If GPIO0 defined: GIC_EnableIRQ(87); If GPIO1 defined: GIC_EnableIRQ(88).", "If GPIO0 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); If GPIO1 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).", "Initialize external drive: write_reg(0xA0243ffc, 0xffffffff).", "Configure per-pin: for i=0..31: addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i4); write_reg(addr1, (1u<<20)|(1u<<18)|(1u<<16)); wait_on(10).", "Test loop per pin for i=0..31:", " wr_val = (1u<<i); write_reg(MIZAR_GPIO_GPIO_INTR_RAW_STCLR1, wr_val); write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val); wait_on(10); int_pend=1;", " Generate falling edge: write_reg(0xA0243ffc, 0xffffffff); wait_on(30); write_reg(0xA0243ffc, ~wr_val);", " Wait loop: timeout=5000; while (int_pend && timeout--) wait_on(10); if (timeout==0) print timeout error and test_err++.", "Exit: finish(test_err).", "Interrupt: Default_IRQHandler(): local_wr = 1u<<i; int_pend=0; write_reg(0xA0243ffc, 0xffffffff); raddr = MIZAR_GPIO_GP0_GPIO_8 + (i4); rdata=read_reg(raddr); if ((rdata & 0x1) != 0) test_err++;", "If ((rdata & 0x2) != 0): rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & local_wr)==0) test_err++;", "Clear per-pin and group raw: write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i4), (1u<<20)|(1u<<16)); write_reg(MIZAR_GPIO_GPIO_INTR_RAW_STCLR1, local_wr);", "Verify clear: rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp != 0x0) test_err++;", "If GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87); If GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88);", "Else (raw bit not set): test_err++." ], "Hidden_Impacted_Registers": [ "MIZAR_LSS_SYSREG_INTR_EN1", "MIZAR_GPIO_GP0_GPIO_8", "MIZAR_GPIO_GPIO_INTR_RAW_STCLR1", "MIZAR_GPIO_GP0_INTR1_INTR_EN1", "MIZAR_GPIO_GP0_INTR1_INTR_STS1", "MIZAR_LSS_SYSREG_RAW_STCR1" ], "Hidden_Validation_Acceptance_Criteria": [ "No timeout in the per-pin wait loop (timeout initialized to 5000 and decremented while waiting with wait_on(10)); otherwise error is recorded.", "In Default_IRQHandler(): (rdata & 0x1) must be 0 (DIN low) for the active pin after the falling edge; else error is recorded.", "Group status read from MIZAR_GPIO_GP0_INTR1_INTR_STS1 must have the local_wr bit set during service; else error is recorded.", "After clearing per-pin raw (write (1<<20)|(1<<16) to per-pin register) and group raw (write local_wr to MIZAR_GPIO_GPIO_INTR_RAW_STCLR1), the subsequent read of MIZAR_GPIO_GP0_INTR1_INTR_STS1 must be 0; else error is recorded.", "System-level raw status cleared by writing to MIZAR_LSS_SYSREG_RAW_STCR1 for the selected instance; interrupt controller cleared via GIC_ClearIRQ().", "finish(test_err) indicates pass when test_err == 0; otherwise fail." ] }, "TC3": { "Index": "3", "SS / Module": "GPIO", "Feature": "Positive edge detection at GPIO input", "Test Case Name": "test_gpio_pedge_all_pads_en", "Test Description": "Enables positive-edge detection on all pins of the GPIO instance, sets the pins to input mode, enables group interrupt output, generates one rising edge per pin in sequence, and validates group interrupt assertion, per-pin raw status clear, system-interrupt clear, and re-enable for subsequent iterations.", "Speed": "NA", "Mode": "Interrupt", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "Interrupt controller and system-interrupt enables are conditional on the GPIO instance. The procedure masks the group during service, clears all per-pin raw statuses, and verifies group status cleared before re-enabling the group. A timeout-based wait prevents infinite loops.", "Test Steps / Procedure": [ "Start the test by enabling the appropriate interrupt in the interrupt controller and enabling the system-level interrupt for the selected GPIO instance.", "Enable positive-edge detection on all per-pin control registers for the instance.", "Configure group IO control registers to place all tested pins into input mode.", "Enable all bits in the group interrupt enable register.", "For each pin in the instance: force the external pad to a low level, arm a wait flag, then drive a rising edge; wait with a bounded timeout for the interrupt service routine to clear the wait flag; restore the external pad to low before the next pin.", "In the interrupt service routine: de-assert the wait flag, read the group interrupt status, temporarily mask the group during service, require a nonzero group status, clear per-pin raw status for all pins, confirm the group status is cleared, clear the system-level raw status for the instance and verify it is cleared, re-enable the group interrupt for subsequent iterations, and clear the interrupt in the interrupt controller.", "Finish the test by reporting pass if all checks succeed without timeouts; otherwise fail." ], "Impaired Registers": "NA", "Impacted Registers": [ "GPIO_GP0_GPIO_8", "GPIO_GP0_GPIO_9", "GPIO_GP0_GPIO_10", "GPIO_GP0_GPIO_11", "GPIO_GP0_GPIO_12", "GPIO_GP0_GPIO_13", "GPIO_GP0_GPIO_14", "GPIO_GP0_GPIO_15", "GPIO_GP0_GPIO_16", "GPIO_GP0_GPIO_17", "GPIO_GP0_GPIO_18", "GPIO_GP0_GPIO_19", "GPIO_GP0_GPIO_20", "GPIO_GP0_GPIO_21", "GPIO_GP0_GPIO_22", "GPIO_GP0_GPIO_23", "GPIO_GP0_GPIO_24", "GPIO_GP0_GPIO_25", "GPIO_GP0_GPIO_26", "GPIO_GP0_GPIO_27", "GPIO_GP0_GPIO_28", "GPIO_GP0_GPIO_29", "GPIO_GP0_GPIO_30", "GPIO_GP0_GPIO_31", "GPIO_GP0_GPIO_32", "GPIO_GP0_GPIO_33", "GPIO_GP0_GPIO_34", "GPIO_GP0_GPIO_35", "GPIO_GP0_GPIO_36", "GPIO_GP0_GPIO_37", "GPIO_GP0_GPIO_38", "GPIO_GP0_GPIO_39", "GPIO_IO_CTRL_GROUP1", "GPIO_IO_CTRL_GROUP2", "GPIO_IO_CTRL_GROUP3", "GPIO_IO_CTRL_GROUP4", "GPIO_GP0_INTR1_INTR_EN1", "GPIO_GP0_INTR1_INTR_STS1" ], "Validation / Acceptance Criteria": [ "For each pin tested, no timeout occurs while waiting for the interrupt after generating a rising edge.", "In the handler, group status must be nonzero during service and become zero after raw status clear of all pins.", "The system-level raw status for the instance is cleared and confirmed cleared before re-enabling the group.", "The overall test passes if no errors are recorded; otherwise it fails." ], "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_pedge_all_pads_en", "Hidden_Test_Description": "Enables IRQ at GIC (87 for GPIO0 or 88 for GPIO1) and system-level via write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO{0|1}_INTR). Programs per-pin positive-edge enable by writing 0x00020000 to MIZAR_GPIO_GP0_GPIO_8 + (i4) for i=0..31. Sets input mode by writing 0x000000FF to MIZAR_GPIO_GPIO_IO_CTRL_GROUP[1..4]. Enables group via write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF). For each i: write_reg(0xA0243ffc, 0x00000000), wait_on(10), set int_pend=1, write_reg(0xA0243ffc, 0xFFFFFFFF), wait until int_pend==0 or timeout. In Default_IRQHandler(): int_pend=0; rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); mask group via write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000); require rdata_grp!=0; clear per-pin raw by writing 0x00010000 to each MIZAR_GPIO_GP0_GPIO_8 + (j4); verify rdata_grp==0; clear sysreg via write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO{0|1}_INTR) and confirm bit cleared by readback; re-enable group, then GIC_ClearIRQ(87 or 88). finish(test_err).", "Hidden_Remarks": "Uses external pad control register 0xA0243ffc to generate rising edges. Group interrupt is masked during service then re-enabled for next iteration. Timeout-based wait (int timeout=2000; wait_on(10) in loop) avoids infinite hang. System-level raw status is read back to confirm clear.", "Hidden_Test_Steps_Procedure": [ "Entry: test_case()", "If GPIO0 defined: GIC_EnableIRQ(87); If GPIO1 defined: GIC_EnableIRQ(88).", "If GPIO0 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); If GPIO1 defined: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).", "For i=0..31: write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i4), 0x00020000) to enable posedge.", "wait_on(10); Set input mode: write_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, 0x000000FF); ... GROUP2=0x000000FF; GROUP3=0x000000FF; GROUP4=0x000000FF.", "wait_on(10); Enable group: write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF).", "For i=0..31: write_reg(0xA0243ffc, 0x00000000); wait_on(10); int_pend=1; write_reg(0xA0243ffc, 0xFFFFFFFF);", "Wait loop per pin: int timeout=2000; while ((int_pend==1) && (--timeout>0)) wait_on(10); if (timeout==0) print timeout error; test_err++; break;", "Optionally prepare for next pin: write_reg(0xA0243ffc, 0x00000000); wait_on(10).", "Interrupt: Default_IRQHandler(): wr_val=(1<<i); int_pend=0; rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000); if ((rdata_grp & 0xffffffff)!=0) success-log else error and test_err++;", "Clear per-pin raw: for j=0..31 write_reg(MIZAR_GPIO_GP0_GPIO_8 + (j*4), 0x00010000); wait_on(2);", "Verify clear: rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp==0x0) success-log else error and test_err++;", "If GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); rdata=read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR)!=0) print error; test_err++;", "If GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); rdata=read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR)!=0) print error; test_err++;", "Re-enable group: write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF); If GPIO0: GIC_ClearIRQ(87); If GPIO1: GIC_ClearIRQ(88).", "Exit: finish(test_err)." ], "Hidden_Impacted_Registers": [ "MIZAR_LSS_SYSREG_INTR_EN1", "MIZAR_GPIO_GP0_GPIO_8", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP1", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP2", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP3", "MIZAR_GPIO_GPIO_IO_CTRL_GROUP4", "MIZAR_GPIO_GP0_INTR1_INTR_EN1", "MIZAR_GPIO_GP0_INTR1_INTR_STS1", "MIZAR_LSS_SYSREG_RAW_STCR1" ], "Hidden_Validation_Acceptance_Criteria": [ "Per pin wait loop must not timeout (int timeout=2000; decremented while waiting with wait_on(10)).", "During handler, rdata_grp=read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1) must be nonzero; after clearing all per-pin raw (write 0x00010000 to each per-pin register), rdata_grp must be 0.", "System-level raw status is cleared by writing to MIZAR_LSS_SYSREG_RAW_STCR1 and verified by readback (corresponding GPIO instance bit must be zero).", "finish(test_err) indicates pass only when test_err==0; otherwise fail." ] } }
JSON

      - name: Generate and commit Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/generate_testplan.py \
            --json-file "$RUNNER_TEMP/json_input.json" \
            --ip-name "gpio" \
            --output-dir "Test_Output/GPIO/TestPlan" \
            --commit
