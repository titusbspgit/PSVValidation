name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - 'scripts/generate_gpio_testplan.py'
      - '.github/workflows/generate_gpio_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python scripts/generate_gpio_testplan.py

      - name: Commit and push Excel
        run: |
          set -e
          CHANGED=$(git ls-files -o --exclude-standard -- Test_Output/GPIO/TestPlan/*.xlsx || true)
          if [ -z "$CHANGED" ]; then
            echo "No new Excel files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git commit -m "Add GPIO Test Plan (reg_rw, negedge, pedge)" || exit 0
          git push
