name: Generate GPIO Test Plan Excel

on:
  push:
    paths:
      - 'scripts/gpio_testplan.json'
      - 'scripts/generate_gpio_testplan_excel.py'
      - '.github/workflows/generate_gpio_testplan.yml'
      - '.github/workflows/run_gpio_testplan_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (Stage1 rules)
        run: |
          python scripts/generate_gpio_testplan_excel.py \
            --json scripts/gpio_testplan.json \
            --ip GPIO \
            --outdir Test_Output/GPIO/TestPlan \
            --base-dir "TestRepo/gpio"

      - name: Read automation outputs
        id: vars
        shell: bash
        run: |
          if [ ! -f scripts/_automation_output.env ]; then
            echo "Automation output file missing" >&2; exit 1; fi
          source scripts/_automation_output.env
          echo "excel_file=$EXCEL_FILE" >> $GITHUB_OUTPUT
          echo "ist_timestamp=$IST_TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Commit Excel artifact
        env:
          EXCEL_FILE: ${{ steps.vars.outputs.excel_file }}
          IST_TS: ${{ steps.vars.outputs.ist_timestamp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$EXCEL_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add GPIO Test Plan Excel (IST: ${IST_TS}) generated from TestRepo/gpio"
            git push
          fi
