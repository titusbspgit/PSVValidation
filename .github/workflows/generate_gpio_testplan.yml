name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/triggers/run_gpio_testplan.txt'
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'scripts/json_to_excel_gpio.py'
      - 'data/gpio_full_json.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata
      - name: Generate Excel
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          OUTPUT_FILENAME_PREFIX: GPIO_TestPlan
        run: |
          python scripts/json_to_excel_gpio.py
      - name: Commit Excel
        run: |
          git config user.name "Auto Excel Bot"
          git config user.email "auto-excel-bot@psvvalidation.local"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
