name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/aggregated.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata

      - name: Generate Excel
        run: |
          python scripts/generate_testplan_excel.py \
            --json "Test_Output/GPIO/TestPlan/aggregated.json" \
            --ip "GPIO" \
            --repo "titusbspgit/PSVValidation" \
            --branch "main" \
            --output-dir "Test_Output/GPIO/TestPlan"

      - name: Read generated file path
        id: find
        run: |
          FILE=$(cat Test_Output/GPIO/TestPlan/last_generated.txt)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.find.outputs.file }}"
          git commit -m "Add GPIO TestPlan Excel: $(basename \"${{ steps.find.outputs.file }}\")"
          git push
