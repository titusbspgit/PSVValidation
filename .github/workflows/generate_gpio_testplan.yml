name: Generate and commit GPIO TestPlan
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          date
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python .github/scripts/generate_gpio_testplan.py
      - name: Commit Excel artifact
        if: success()
        run: |
          FILE_PATH=$(cat .github/scripts/output_path.txt)
          echo "File: $FILE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Final formatted Excel generated from JSON input" || echo "Nothing to commit"
          git push
