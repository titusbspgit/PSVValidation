name: Generate GPIO TestPlan (Stage1)

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/generate_gpio_testplan.yml"
      - ".github/scripts/generate_gpio_testplan.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install openpyxl
      - id: gen
        name: Generate Excel
        run: python .github/scripts/generate_gpio_testplan.py
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT
      - name: Commit Excel
        run: |
          if ls Test_Output/GPIO/TestPlan/*.xlsx 1> /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Add GPIO TestPlan autogenerated on ${{ steps.gen.outputs.ist_timestamp }}" || echo "No changes to commit"
            git push
          else
            echo "No Excel generated."
            exit 1
