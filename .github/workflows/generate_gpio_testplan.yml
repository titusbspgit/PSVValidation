name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-input openpyxl
      - name: Generate Excel (and internal validation only)
        env:
          OUTPUT_FILE_PATH: Test_Output/GPIO/TestPlan
          OUTPUT_FILE_NAME: GPIO_TestPlan_20260511_120000.xlsx
        run: |
          python automation/generate_testplan.py
      - name: Commit Excel only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260511_120000.xlsx"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push origin HEAD:main
          fi
