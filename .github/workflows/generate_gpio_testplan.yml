name: Generate GPIO TestPlan Excel (Stage1)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'tools/gpio_testplan_stage1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute IST timestamp
        id: ts
        run: echo "ts=$(TZ=Asia/Kolkata date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl==3.1.2

      - name: Generate Excel
        env:
          REPO_OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
          IST_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        run: |
          python tools/gpio_testplan_stage1.py \
            --output-dir "$REPO_OUTPUT_DIR" \
            --ip-name "$IP_NAME" \
            --ts "$IST_TIMESTAMP"

      - name: Commit Excel
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain Test_Output/GPIO/TestPlan)" ]; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          else
            echo "No changes to commit."
          fi
