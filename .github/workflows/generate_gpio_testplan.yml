name: Generate GPIO TestPlan Excel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan.py
      - name: Capture generated path
        id: path
        run: |
          echo "file_path=$(cat tools/generated_path.txt)" >> $GITHUB_OUTPUT
      - name: Commit Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: ${{ steps.path.outputs.file_path }}
          message: Final formatted Excel generated from JSON input
          default_author: github_actions
          push: true
