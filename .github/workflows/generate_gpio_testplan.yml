name: Generate GPIO TestPlan

on:
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'tools/generate_testplan_from_json.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        id: gen
        run: |
          python tools/generate_testplan_from_json.py

      - name: Commit Excel artifact
        run: |
          set -e
          FILE="${{ steps.gen.outputs.output_file }}"
          TS="${{ steps.gen.outputs.ist_timestamp }}"
          if [ -z "$FILE" ]; then
            echo "No output_file from generator." >&2; exit 1; fi
          if [ ! -f "$FILE" ]; then
            echo "Generated Excel not found at $FILE" >&2; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "GPIO: Add autogenerated TestPlan (IST $TS)" || echo "Nothing to commit"
          git push || echo "Nothing pushed"
