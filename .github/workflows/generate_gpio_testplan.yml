name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - '.github/data/gpio_testplan.json'
      - 'tools/generate_testplan_excel.py'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Generate Excel from JSON
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_PATH=$(python tools/generate_testplan_excel.py .github/data/gpio_testplan.json)
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV
          echo "Generated: $OUTPUT_PATH"

      - name: Commit Excel file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          TS=$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S IST')
          git commit -m "Add GPIO TestPlan (auto-generated) [$TS]" || echo "No changes to commit"
          git push
