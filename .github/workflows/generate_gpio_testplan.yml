name: Generate GPIO TestPlan Excel (Stage1 Fallback)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_gpio_testplan.yml
      - tools/generate_testplan_excel.py
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl

      - name: Generate Excel
        run: python tools/generate_testplan_excel.py

      - name: Commit Excel
        run: |
          IST_NOW="$(date +'%Y-%m-%d %H:%M:%S IST')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[Auto-Gen][GPIO] TestPlan Excel generated from TestRepo/gpio on ${IST_NOW}"
            git push origin HEAD:main
          fi
