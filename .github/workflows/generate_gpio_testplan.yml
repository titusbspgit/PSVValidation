name: Generate GPIO TestPlan Excel\n\non:\n  push:\n    paths:\n      - '.github/workflows/generate_gpio_testplan.yml'\n      - '.github/scripts/generate_gpio_testplan.py'\n  workflow_dispatch: {}\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Install dependencies\n        run: pip install --no-cache-dir openpyxl==3.1.2\n      - name: Generate Excel (GPIO TestPlan)\n        run: python .github/scripts/generate_gpio_testplan.py\n      - name: Commit Excel artifact\n        run: |\n          git config user.name \'github-actions[bot]\'\n          git config user.email \'41898282+github-actions[bot]@users.noreply.github.com\'\n          git add Test_Output/GPIO/TestPlan/*.xlsx .github/scripts/last_commit_message.txt\n          if git diff --cached --quiet; then\n            echo 'No changes to commit'\n          else\n            git commit -m "$(cat .github/scripts/last_commit_message.txt)"\n            git push\n          fi\n