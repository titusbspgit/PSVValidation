name: Generate GPIO TestPlan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan_excel.py
      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          git commit -m "Add generated GPIO TestPlan (IST timestamp)" || echo "No changes to commit"
          git push
