name: Generate GPIO TestPlan XLSX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX TestPlan
        working-directory: Test_Output/GPIO/TestPlan
        run: python generate_testplan.py

      - name: Move generated file
        run: |
          find . -name "GPIO_TestPlan_*.xlsx" -exec mv {} Test_Output/GPIO/TestPlan/ \; 2>/dev/null || true

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/*.xlsx"
          git commit -m "Auto-generated GPIO TestPlan XLSX [skip ci]" || echo "No changes to commit"
          git push
