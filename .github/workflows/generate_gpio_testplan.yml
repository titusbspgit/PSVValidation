name: Generate GPIO TestPlan

on:
  workflow_dispatch:
  push:
    paths:
      - tools/generate_testplan.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
      - name: Generate Excel
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_testplan.py | tee gen_output.log
          GEN_FILE=$(grep -oP 'OUTPUT_FILE:\s*\K.*' gen_output.log | tail -n1 || true)
          if [ -z "${GEN_FILE:-}" ]; then
            echo "Failed to determine generated file path" >&2
            exit 1
          fi
          echo "gen_file=$GEN_FILE" >> "$GITHUB_OUTPUT"
      - name: Commit Excel
        if: steps.run.outputs.gen_file != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.run.outputs.gen_file }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Final formatted Excel generated from JSON input"
          git push
