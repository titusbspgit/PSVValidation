    "Test Case Name": "gpio_reg_wr_rd_test",
    "Test Description": "Validates reset values and read/write behavior of gp0_gpio_8 through gp0_gpio_30. For each register, the test skips entries flagged as non-testable, verifies readable reset values with bit 0 ignored, writes a series of data patterns masked by the write mask, and confirms read-back values match the expected combination of written bits and preserved default bits for non-writable fields. The test reports pass only if all applicable checks succeed.",
    "Meta Test Description": "The testcase executes test_case(), which performs two phases: (1) default/reset value verification via chk_rst_val(), and (2) write/read verification via chk_rd_wr().\n\nIn chk_rst_val(): for i=0..CNT-1, addr = addr_array[i]. If skip_rst_array[i] == 1, the entry is skipped. If read_mask_array[i] == 0x00000000, the entry is treated as not readable and skipped. Otherwise, data_rd = read_reg(addr), data = (data_rd & 0xfffffffe), and data is compared to default_value_array[i]. On mismatch, def_fail_cnt is incremented and a failure message is printed; otherwise a pass message is optionally printed when DEBUG_DISPLAY is enabled.\n\nIn chk_rd_wr(): the code iterates over six write patterns chk_val[6] = {0xffffffff, 0xaaaaaaaa, 0x55555555, 0xf5f5f5f5, 0xA5A5A5A5, 0xffff0000}. For each pattern j and for each i=0..CNT-1, addr = addr_array[i]. If skip_array[i] == 1, the address is skipped. If write_mask_array[i] == 0x00000000, the address is considered not writable and is skipped for writing. Otherwise, write_reg(addr, (data_wr & write_mask_array[i])) is performed. Then in the read-back loop, for each i, if skip_array[i] == 1, continue; if write_mask_array[i] == 0x00000000, continue; if read_mask_array[i] == 0x00000000, continue; else data_rd = (read_reg(addr) & read_mask_array[i]). The expected value is computed as: wr_n = (write_mask_array[i] ^ 0xffffffff); exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])). If data_rd != exp_val, wr_fail_cnt is incremented and a failure message is printed; otherwise a pass message is optionally printed when DEBUG_DISPLAY is enabled.\n\nAfter both phases, test_case() calls finish(1) if (def_fail_cnt > 0 || wr_fail_cnt > 0), otherwise finish(0). A soft_reset_chk() helper exists but is compiled out (#ifdef 0); it references SOFT_RST_REG_ADDRESS and SOFT_RST_REG_DATA. The testcase depends on externally provided functions/macros (read_reg, write_reg, finish, wait_on) and header-provided address/mask/default definitions included via test_define.c and its included headers.",
