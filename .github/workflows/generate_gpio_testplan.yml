name: Generate GPIO TestPlan from JSON input

on:
  workflow_dispatch:
    inputs:
      json_payload:
        description: 'JSON array (preferred) or dict of test cases (keys like TC1, TC2)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        id: generate
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          JSON_PAYLOAD: ${{ github.event.inputs.json_payload }}
        run: |
          python scripts/generate_testplan.py

      - name: Commit Excel
        if: success()
        uses: EndBug/add-and-commit@v9
        with:
          add: ${{ steps.generate.outputs.output_file_path }}
          message: Final formatted Excel generated from JSON input
