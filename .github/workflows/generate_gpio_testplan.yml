name: Generate GPIO TestPlan Excel
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        run: |
          python scripts/generate_testplan_excel.py \
            --json "data/testplans/GPIO_FULL_JSON_STRUCTURE.json" \
            --output-dir "Test_Output/GPIO/TestPlan" \
            --ip-name "GPIO"
      - name: Commit Excel artifact
        run: |
          set -e
          FILE=$(ls -1 Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | tail -n 1)
          echo "Detected Excel: $FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push
