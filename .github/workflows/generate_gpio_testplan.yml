name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/input/GPIO_TestPlan.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2
      - name: Generate Excel
        id: gen
        run: |
          python scripts/gen_testplan_excel.py
      - name: Validate Excel OOXML structure
        env:
          OUTPUT_FILE: ${{ steps.gen.outputs.output_file }}
        run: |
          python - << 'PY'
          import zipfile, os, sys
          p = os.environ['OUTPUT_FILE']
          required = ['[Content_Types].xml','_rels/.rels','xl/workbook.xml']
          ok = True
          with zipfile.ZipFile(p, 'r') as z:
              names = z.namelist()
              for r in required:
                  if r not in names:
                      print(f'Missing required OOXML part: {r}')
                      ok = False
          print('OOXML_VALID=' + ('1' if ok else '0'))
          sys.exit(0 if ok else 1)
          PY
      - name: Commit Excel artifact
        env:
          OUTPUT_FILE: ${{ steps.gen.outputs.output_file }}
          IST_STAMP: ${{ steps.gen.outputs.ist_stamp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add GPIO TestPlan Excel (Stage1 formatted) [IST $IST_STAMP]"
            git push
          fi
