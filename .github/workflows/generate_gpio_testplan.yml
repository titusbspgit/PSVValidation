name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - .github/workflows/generate_gpio_testplan.yml
      - tools/generate_testplan_gpio.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set IST timestamp
        id: ist
        run: |
          IST_TS=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')
          FILE_STAMP=$(TZ='Asia/Kolkata' date +'%Y%m%d_%H%M%S')
          echo "ist_ts=$IST_TS" >> $GITHUB_OUTPUT
          echo "file_stamp=$FILE_STAMP" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel (.xlsx)
        env:
          IST_TS: ${{ steps.ist.outputs.ist_ts }}
          FILE_STAMP: ${{ steps.ist.outputs.file_stamp }}
        run: |
          python tools/generate_testplan_gpio.py \
            --ist-ts "$IST_TS" \
            --output-dir "Test_Output/GPIO/TestPlan" \
            --ip-name "GPIO" \
            --file-stamp "$FILE_STAMP"

      - name: Commit Excel to repository
        env:
          IST_TS: ${{ steps.ist.outputs.ist_ts }}
          FILE_STAMP: ${{ steps.ist.outputs.file_stamp }}
        run: |
          set -e
          FILE_NAME="GPIO_TestPlan_${FILE_STAMP}.xlsx"
          FILE_PATH="Test_Output/GPIO/TestPlan/${FILE_NAME}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "Expected Excel file not found: $FILE_PATH" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Final formatted Excel generated from JSON input — $IST_TS"
          git push
