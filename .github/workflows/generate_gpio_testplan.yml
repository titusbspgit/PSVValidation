name: Generate GPIO TestPlan Excel (Stage1)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'tools/gpio_testplan_stage1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate and commit GPIO TestPlan Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/gpio_testplan_stage1.py
