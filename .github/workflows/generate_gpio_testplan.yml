name: Generate GPIO TestPlan

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate_gpio_testplan.yml
      - .github/scripts/build_gpio_testplan.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata

      - name: Generate GPIO TestPlan Excel
        run: |
          python .github/scripts/build_gpio_testplan.py

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Add GPIO TestPlan (auto-generated by workflow)"
            git push origin HEAD:main
          fi
