name: Generate GPIO TestPlan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_gpio_testplan.py'
      - '.github/workflows/generate_gpio_testplan.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          output=$(python tools/generate_gpio_testplan.py)
          echo "$output"
          # Parse key=value pairs from script output
          while IFS='=' read -r key value; do
            if [[ "$key" == "GENERATED_FILENAME" ]]; then
              echo "generated_filename=$value" >> "$GITHUB_OUTPUT"
            elif [[ "$key" == "IST_TIMESTAMP" ]]; then
              echo "ist_timestamp=$value" >> "$GITHUB_OUTPUT"
            fi
          done <<< "$output"
      - name: Commit Excel
        if: steps.gen.outputs.generated_filename != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/${{ steps.gen.outputs.generated_filename }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add GPIO TestPlan generated on ${{ steps.gen.outputs.ist_timestamp }}"
            git push origin HEAD:main
          fi
