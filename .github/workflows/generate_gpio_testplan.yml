name: Generate GPIO TestPlan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel (IST timestamped)
        run: |
          python tools/generate_testplan_excel.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          NOW_IST=$(python - <<'PY'
from datetime import datetime, timedelta, timezone
ist = timezone(timedelta(hours=5, minutes=30))
print(datetime.now(ist).strftime('%Y-%m-%d %H:%M:%S IST'))
PY
)
          git commit -m "Add GPIO TestPlan (IST ${NOW_IST})" || echo "No changes to commit"
          git push
