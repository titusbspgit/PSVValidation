name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - '.github/scripts/generate_gpio_testplan.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl==3.1.2
      - name: Generate Excel (GPIO TestPlan)
        run: python .github/scripts/generate_gpio_testplan.py
      - name: Commit Excel artifact only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Add GPIO TestPlan Excel generated by Stage1 [IST $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')]"
            git push
          fi
