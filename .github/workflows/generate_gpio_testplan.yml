name: Generate GPIO TestPlan Excel
on:
  push:
    paths:
      - "Test_Output/GPIO/TestPlan/dataset_GPIO.json"
      - ".github/workflows/generate_gpio_testplan.yml"
      - "tools/build_testplan_excel.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl
      - name: Build Excel
        run: python tools/build_testplan_excel.py
      - name: Commit Excel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Final formatted Excel generated from JSON input"
          file_pattern: Test_Output/GPIO/TestPlan/*.xlsx
