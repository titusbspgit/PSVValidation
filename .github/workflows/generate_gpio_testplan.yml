name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/input/TestPlan_GPIO.json'
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'scripts/generate_testplan_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED=$(git status --porcelain Test_Output/GPIO/TestPlan/*.xlsx || true)
          if [ -n "$CHANGED" ]; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            MSG=$(python - <<'PY'
from datetime import datetime, timedelta, timezone
now_ist = datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)
print(now_ist.strftime("Add GPIO Test Plan Excel (generated on %Y-%m-%d %H:%M:%S IST)"))
PY
)
            git commit -m "$MSG"
            git push
          else
            echo "No Excel changes to commit"
          fi
