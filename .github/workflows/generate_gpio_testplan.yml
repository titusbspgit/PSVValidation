name: Generate GPIO TestPlan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate and commit GPIO TestPlan Excel
        env:
          TZ: Asia/Kolkata
        run: |
          python scripts/generate_gpio_testplan.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          git commit -m "Add GPIO TestPlan (IST timestamp) via workflow" || echo "No changes to commit"
          git push origin main
