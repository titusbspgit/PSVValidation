name: Generate GPIO TestPlan XLSX

on:
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'

permissions:
  contents: write

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: |
          cd Test_Output/GPIO/TestPlan
          python -c "
          import openpyxl
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.utils import get_column_letter
          import os

          TESTPLAN_COLUMNS = ['Index','SS / Module','Feature','Test Case Name','Test Description','Speed','Mode','Memory Start Offset','Memory End Offset','Remarks','Test Steps / Procedure','Impacted Registers','Validation / Acceptance Criteria','Code Generation (Required / Not)','Test Folder','Source File','IP Name']
          METADATA_COLUMNS = ['Index','SS / Module','Feature','Test Case Name','Test Description','Meta Test Description','Speed','Mode','Memory Start Offset','Memory End Offset','Remarks','Test Steps / Procedure','Meta Test Steps / Procedure','Impacted Registers','Meta Impacted Registers','Validation / Acceptance Criteria','Meta Validation / Acceptance Criteria','Code Generation (Required / Not)','Meta Headers','Meta Macros','Meta Arrays','Test Folder','Source File','IP Name']

          TC1 = {'Index':1,'SS / Module':'GPIO','Feature':'Register Write-Read Verification','Test Case Name':'gpio_reg_wr_rd_test','Test Description':'This test validates GPIO register write-read functionality by checking reset values of registers gp0_gpio_8, gp0_gpio_9, and gp0_gpio_10, then performing write-read operations with various patterns.','Meta Test Description':'Source files program.c and test_define.c implement chk_rst_val() to read registers via addr_array and compare against default_value_array with read_mask_array, and chk_rd_wr() to write patterns 0xFFFFFFFF, 0xAAAAAAAA, 0x55555555 to each register address in addr_array and read back with write_mask_array and read_mask_array verification. SOFT_RST_REG_ADDRESS is used in soft_reset_chk() inside #ifdef 0 block (dead code). Registers: MIZAR_GPIO_GP0_GPIO_8 (base 0xA001A000 + offset 0x0) -> gp0_gpio_8, MIZAR_GPIO_GP0_GPIO_9 (base 0xA001A000 + offset 0x4) -> gp0_gpio_9, MIZAR_GPIO_GP0_GPIO_10 (base 0xA001A000 + offset 0x8) -> gp0_gpio_10. Each register is 32-bit with fields: data_in(bit 0, RO, reset 0), intr_raw_sts(bit 1, RO, reset 0), intr_clr(bit 16, WO, reset 0), pedge_intr_en(bit 17, RW, reset 0), nedge_intr_en(bit 18, RW, reset 0), level_sel(bit 19, RW, reset 0), io_ctrl(bit 20, RW2, reset 1), dout(bit 21, RW2, reset 0). Reset signal: hreset_n (active-low async). Bus type: AHB. Clock: ahb_clk. SOFT_RST_REG_ADDRESS is unresolved.','Speed':'NA','Mode':'Polling','Memory Start Offset':'NA','Memory End Offset':'NA','Remarks':'SOFT_RST_REG_ADDRESS is unresolved - no matching register found in specification documents. It appears in dead code (#ifdef 0 block).','Test Steps / Procedure':'1. Read registers gp0_gpio_8, gp0_gpio_9, gp0_gpio_10 and verify reset values\n2. Write pattern 0xFFFFFFFF to each register, read back and verify with write mask\n3. Write pattern 0xAAAAAAAA to each register, read back and verify\n4. Write pattern 0x55555555 to each register, read back and verify','Meta Test Steps / Procedure':'1. chk_rst_val(): For i=0 to CNT-1, read_reg(addr_array[i]) and compare (read_value & read_mask_array[i]) == default_value_array[i].\n2. chk_rd_wr(): For each pattern in {0xFFFFFFFF, 0xAAAAAAAA, 0x55555555}, for i=0 to CNT-1: write_reg(addr_array[i], pattern & write_mask_array[i]), then read_reg(addr_array[i]) and compare.\n3. soft_reset_chk() [inside #ifdef 0 - dead code]: read_reg(SOFT_RST_REG_ADDRESS), write_reg(SOFT_RST_REG_ADDRESS, value), read_reg(SOFT_RST_REG_ADDRESS).','Impacted Registers':'gp0_gpio_8; gp0_gpio_9; gp0_gpio_10','Meta Impacted Registers':'MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_GPIO_9; MIZAR_GPIO_GP0_GPIO_10; SOFT_RST_REG_ADDRESS','Validation / Acceptance Criteria':'- Reset values must match expected defaults (io_ctrl=1 at bit 20, all others 0)\n- Written values read back must match after applying read/write masks\n- PASS if all patterns verified, FAIL otherwise','Meta Validation / Acceptance Criteria':'- chk_rst_val(): (read_reg(addr_array[i]) & read_mask_array[i]) must equal default_value_array[i]. Expected reset value: 0x00100000.\n- chk_rd_wr(): For each pattern P: (read_reg(addr_array[i]) & read_mask_array[i]) must equal (P & write_mask_array[i] & read_mask_array[i]).\n- RO fields must not be affected by writes. WO field reads back as 0. RW2 fields retain last written value.\n- PASS: all comparisons match. FAIL: any mismatch.','Code Generation (Required / Not)':'Not Required','Meta Headers':'NA','Meta Macros':'NA','Meta Arrays':'addr_array = {MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_GPIO_9, MIZAR_GPIO_GP0_GPIO_10}; default_value_array = {GPIO_GP0_GPIO_8_DEFAULT_VAL, GPIO_GP0_GPIO_9_DEFAULT_VAL, GPIO_GP0_GPIO_10_DEFAULT_VAL}; read_mask_array = {GPIO_GP0_GPIO_8_READ_MASK, GPIO_GP0_GPIO_9_READ_MASK, GPIO_GP0_GPIO_10_READ_MASK}; write_mask_array = {GPIO_GP0_GPIO_8_WRITE_MASK, GPIO_GP0_GPIO_9_WRITE_MASK, GPIO_GP0_GPIO_10_WRITE_MASK}','Test Folder':'TestRepo/gpio/gpio_reg_wr_rd_test','Source File':'program.c, test_define.c','IP Name':'GPIO'}

          TC2 = {'Index':2,'SS / Module':'GPIO','Feature':'Level Select Interrupt Enable Verification','Test Case Name':'test_gpio_level_sel_intr_en','Test Description':'This test validates GPIO level-select interrupt functionality for GPIOs 8 through 39. It configures each GPIO pin in input mode with level-based interrupt detection, first with active-high level selection and then with active-low level selection. For each GPIO, the test enables the per-GPIO group interrupt via gp0_intr1_intr_en1 and the system-level interrupt via intr_en1, then waits for the ISR to fire. Inside the ISR, the test verifies the interrupt raw status in gp0_gpio_8, checks the group interrupt status in gp0_intr1_intr_sts1, clears the interrupt, verifies the clear succeeded, disables the group interrupt, confirms the group status is cleared, and finally clears and verifies the system-level interrupt status in raw_stcr1.','Meta Test Description':'Source files program.c and test_define.c implement an interrupt-driven GPIO level-select test. test_case() enables GIC IRQ 87 via GIC_EnableIRQ(87) under #ifdef GPIO0. System-level interrupt is enabled by write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR). Two loops iterate i=0 to 31 (GPIOs 8-39). First loop (active-high): write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4), 0x00180000). Second loop (active-low): write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4), 0x00100000). Default_IRQHandler checks intr_raw_sts, group status, clears interrupt, verifies clear, clears sysreg status.','Speed':'NA','Mode':'ISR','Memory Start Offset':'NA','Memory End Offset':'NA','Remarks':'Requires GIC IRQ 87 for GPIO0 interrupt routing. GPIO hardware must support level-based interrupts on pins 8-39. Depends on hreset_n deasserted. SRAM location used as test sync marker.','Test Steps / Procedure':'1. Enable GIC IRQ for GPIO0 interrupt line.\n2. Enable system-level GPIO0 interrupt in intr_en1.\n3. For each GPIO pin (8-39), configure with input mode and active-high level-select.\n4. Enable per-GPIO group interrupt in gp0_intr1_intr_en1.\n5. Write sync marker and wait for interrupt.\n6. In ISR, verify interrupt raw status bit (bit 1).\n7. Read gp0_intr1_intr_sts1 and verify group interrupt status.\n8. Clear interrupt via intr_clr field (bit 16).\n9. Verify interrupt cleared (expected 0x100001).\n10. Disable group interrupt.\n11. Verify group status is 0x0.\n12. Clear and verify system-level interrupt in raw_stcr1.\n13. Clear GIC IRQ.\n14. Repeat with active-low level-select.\n15. Verify zero errors.','Meta Test Steps / Procedure':'1. GIC_EnableIRQ(87) [#ifdef GPIO0].\n2. write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR).\n3. Loop i=0..31 (active-high): write_reg(MIZAR_GPIO_GP0_GPIO_8+(i*4), 0x00180000), write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 1<<i), write_reg(0xA0243ffc, 0xffffffff), wait for ISR.\n4. Loop i=0..31 (active-low): write_reg(MIZAR_GPIO_GP0_GPIO_8+(i*4), 0x00100000), same interrupt flow.\n5. ISR: check (rdata&0x2)!=0, check group status, clear intr, verify clear==0x100001, disable group, verify group==0, clear sysreg, verify sysreg cleared, GIC_ClearIRQ(87).\n6. finish(test_err).','Impacted Registers':'intr_en1; gp0_gpio_8; gp0_intr1_intr_en1; gp0_intr1_intr_sts1; raw_stcr1','Meta Impacted Registers':'MIZAR_LSS_SYSREG_INTR_EN1; MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_INTR1_INTR_EN1; 0xA0243ffc; MIZAR_GPIO_GP0_INTR1_INTR_STS1; MIZAR_LSS_SYSREG_RAW_STCR1','Validation / Acceptance Criteria':'PASS: All 64 iterations (32 active-high + 32 active-low) complete with zero errors. For each iteration: interrupt raw status asserted, group status set, interrupt cleared to 0x100001, group status cleared to 0x0, system-level status cleared. FAIL: Any mismatch increments error counter.','Meta Validation / Acceptance Criteria':'PASS conditions per iteration:\n1. (rdata & 0x2) != 0x0\n2. (rdata_grp & (1<<i)) != 0\n3. After clear: rdata == 0x100001\n4. After disable: rdata_grp == 0x0\n5. After sysreg clear: (rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0\nFAIL: Any condition not met increments test_err.','Code Generation (Required / Not)':'Not','Meta Headers':'#include<lss_sysreg.h>; #include<stdio.h>; #include<test_define.c>; #include<test_common.h>; #include<gpio/gpio_def.h>; #include<gpio/gpio_offset.h>','Meta Macros':'#define CNT 49','Meta Arrays':'const unsigned long int addr_array[49]={MIZAR_GPIO_GP0_GPIO_8,MIZAR_GPIO_GP0_GPIO_9,MIZAR_GPIO_GP0_GPIO_10,...}; const unsigned int default_value_array[49]={...}; const unsigned int read_mask_array[49]={...}; const unsigned int write_mask_array[49]={...}; const int skip_array[49]={0,...,0};','Test Folder':'TestRepo/gpio/test_gpio_level_sel_intr_en','Source File':'program.c, test_define.c','IP Name':'GPIO'}

          TEST_CASES = [TC1, TC2]

          wb = openpyxl.Workbook()
          hf = Font(name='Calibri', size=11, bold=True, color='FFFFFF')
          df = Font(name='Calibri', size=10)
          tp_fill = PatternFill(start_color='1F4E79', end_color='1F4E79', fill_type='solid')
          md_fill = PatternFill(start_color='1D6B3F', end_color='1D6B3F', fill_type='solid')
          wa = Alignment(wrap_text=True, vertical='top', horizontal='left')
          ha = Alignment(wrap_text=True, vertical='center', horizontal='center')
          tb = Border(left=Side(style='thin'), right=Side(style='thin'), top=Side(style='thin'), bottom=Side(style='thin'))

          ws = wb.active
          ws.title = 'TestPlan'
          for ci, cn in enumerate(TESTPLAN_COLUMNS, 1):
              c = ws.cell(row=1, column=ci, value=cn)
              c.font = hf; c.fill = tp_fill; c.alignment = ha; c.border = tb
          for ri, tc in enumerate(TEST_CASES, 2):
              for ci, cn in enumerate(TESTPLAN_COLUMNS, 1):
                  c = ws.cell(row=ri, column=ci, value=tc.get(cn, ''))
                  c.font = df; c.alignment = wa; c.border = tb
          tpw = {'Index':8,'SS / Module':14,'Feature':30,'Test Case Name':30,'Test Description':55,'Speed':10,'Mode':10,'Memory Start Offset':18,'Memory End Offset':18,'Remarks':40,'Test Steps / Procedure':55,'Impacted Registers':40,'Validation / Acceptance Criteria':55,'Code Generation (Required / Not)':22,'Test Folder':35,'Source File':25,'IP Name':10}
          for ci, cn in enumerate(TESTPLAN_COLUMNS, 1):
              ws.column_dimensions[get_column_letter(ci)].width = tpw.get(cn, 20)
          ws.freeze_panes = 'A2'

          wm = wb.create_sheet(title='MetaData')
          for ci, cn in enumerate(METADATA_COLUMNS, 1):
              c = wm.cell(row=1, column=ci, value=cn)
              c.font = hf; c.fill = md_fill; c.alignment = ha; c.border = tb
          for ri, tc in enumerate(TEST_CASES, 2):
              for ci, cn in enumerate(METADATA_COLUMNS, 1):
                  c = wm.cell(row=ri, column=ci, value=tc.get(cn, ''))
                  c.font = df; c.alignment = wa; c.border = tb
          mdw = {'Index':8,'SS / Module':14,'Feature':30,'Test Case Name':30,'Test Description':55,'Meta Test Description':65,'Speed':10,'Mode':10,'Memory Start Offset':18,'Memory End Offset':18,'Remarks':40,'Test Steps / Procedure':55,'Meta Test Steps / Procedure':65,'Impacted Registers':40,'Meta Impacted Registers':55,'Validation / Acceptance Criteria':55,'Meta Validation / Acceptance Criteria':65,'Code Generation (Required / Not)':22,'Meta Headers':45,'Meta Macros':30,'Meta Arrays':65,'Test Folder':35,'Source File':25,'IP Name':10}
          for ci, cn in enumerate(METADATA_COLUMNS, 1):
              wm.column_dimensions[get_column_letter(ci)].width = mdw.get(cn, 20)
          wm.freeze_panes = 'A2'
          wm.sheet_state = 'veryHidden'

          wb.save('GPIO_TestPlan_20250617_193000.xlsx')
          sz = os.path.getsize('GPIO_TestPlan_20250617_193000.xlsx')
          print(f'Generated GPIO_TestPlan_20250617_193000.xlsx ({sz} bytes)')
          print(f'Sheets: TestPlan (visible), MetaData (veryHidden)')
          print(f'TestPlan columns: {len(TESTPLAN_COLUMNS)}, MetaData columns: {len(METADATA_COLUMNS)}')
          print(f'Test cases: {len(TEST_CASES)}')
          "

      - name: Verify XLSX file
        run: |
          ls -la Test_Output/GPIO/TestPlan/GPIO_TestPlan_20250617_193000.xlsx
          file Test_Output/GPIO/TestPlan/GPIO_TestPlan_20250617_193000.xlsx

      - name: Commit and push XLSX then cleanup
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_20250617_193000.xlsx
          git rm Test_Output/GPIO/TestPlan/generate_GPIO_TestPlan_20250617_193000.py || true
          git rm .github/workflows/generate_gpio_testplan.yml || true
          git commit -m "Add GPIO TestPlan XLSX - 2 test cases (gpio_reg_wr_rd_test, test_gpio_level_sel_intr_en) and cleanup generator artifacts"
          git push origin main

      - name: Print final status
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "=========================================="
          echo "FINAL STATUS: SUCCESS"
          echo "File: Test_Output/GPIO/TestPlan/GPIO_TestPlan_20250617_193000.xlsx"
          echo "Commit SHA: $COMMIT_SHA"
          echo "GitHub URL: https://github.com/titusbspgit/PSVValidation/blob/main/Test_Output/GPIO/TestPlan/GPIO_TestPlan_20250617_193000.xlsx"
          echo "=========================================="
