name: Generate GPIO TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'scripts/generate_gpio_testplan.py'
      - 'scripts/json_input_gpio_testplan.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel
        id: gen
        run: |
          python scripts/generate_gpio_testplan.py

      - name: Commit Excel
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          FILE_PATH=$(cat scripts/.last_generated_path.txt)
          TS=$(cat scripts/.last_generated_ts_ist.txt)
          if [ -f "$FILE_PATH" ]; then
            git add "$FILE_PATH"
            git commit -m "Add GPIO TestPlan Excel generated by Stage1 (IST: $TS), source: TestRepo/gpio" || echo "No changes to commit"
            git push
          else
            echo "Excel not found at $FILE_PATH" >&2
            exit 1
          fi
