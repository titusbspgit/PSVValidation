name: Generate GPIO Test Plan Excel (GPIO)

on:
  push:
    paths:
      - .github/workflows/generate_gpio_testplan.yml
      - tools/generate_gpio_testplan_excel.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel (IST timestamped)
        env:
          TZ: Asia/Kolkata
        run: |
          python tools/generate_gpio_testplan_excel.py

      - name: Commit generated Excel
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          set -e
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add GPIO Test Plan Excel generated by Stage1 (IST timestamped)"
            git push
          fi
