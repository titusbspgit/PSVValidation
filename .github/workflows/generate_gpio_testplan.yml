name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_gpio_testplan_excel.py'
      - '.github/workflows/generate_gpio_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --upgrade pip && pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_gpio_testplan_excel.py
      - name: Commit Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/*.xlsx'
          message: 'Add GPIO TestPlan 20260421 053000 IST'
          default_author: github_actions
          push: true
