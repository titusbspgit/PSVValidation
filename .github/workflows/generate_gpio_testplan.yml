name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_gpio_testplan.py'

permissions:
  contents: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl PyGithub

      - name: Generate Excel workbook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Test_Output/GPIO/TestPlan/generate_gpio_testplan.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git diff --cached --quiet || git commit -m "Auto-generate GPIO TestPlan Excel workbook"
          git push
