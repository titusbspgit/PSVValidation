          data = json.loads(final_json_raw)

          # Derive ordered headers
          headers = []
          for item in data:
              for k in item.keys():
                  if k not in headers:
                      headers.append(k)

          wb = Workbook()
          ws = wb.active
          ws.title = 'TestPlan'

          header_font = Font(bold=True)
          header_fill = PatternFill(fill_type='solid', start_color='FFBDD7EE', end_color='FFBDD7EE')
          wrap_top = Alignment(wrap_text=True, vertical='top')

          # Write header
          for col, h in enumerate(headers, 1):
              cell = ws.cell(row=1, column=col, value=h)
              cell.font = header_font
              cell.fill = header_fill
              cell.alignment = wrap_top

          # Write rows preserving order
          for r_idx, item in enumerate(data, start=2):
              for c_idx, h in enumerate(headers, start=1):
                  v = item.get(h, "")
                  ws.cell(row=r_idx, column=c_idx, value=v)

          # Wrap alignment for data cells
          for row in ws.iter_rows(min_row=2, max_row=ws.max_row, min_col=1, max_col=ws.max_column):
              for c in row:
                  c.alignment = wrap_top

          # Freeze first row
          ws.freeze_panes = 'A2'

          # Column widths
          for c_idx in range(1, ws.max_column + 1):
              header_text = str(ws.cell(row=1, column=c_idx).value or "")
              max_len = len(header_text)
              for r_idx in range(2, ws.max_row + 1):
                  val = ws.cell(row=r_idx, column=c_idx).value
                  s = "" if val is None else str(val)
                  l = max(len(line) for line in s.splitlines()) if "\n" in s else len(s)
                  if l > max_len:
                      max_len = l
              width = min(max(12, max_len + 2), 100)
              ws.column_dimensions[get_column_letter(c_idx)].width = width

          # MetaData sheet
          meta = wb.create_sheet('MetaData')
          def add_meta_row(r, k, v):
              meta.cell(row=r, column=1, value=k)
              meta.cell(row=r, column=2, value=v)

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          ts_str = datetime.datetime.now(IST).strftime('%Y-%m-%d %H:%M:%S %Z%z')
          ts_for_name = datetime.datetime.now(IST).strftime('%Y%m%d_%H%M%S')

          owner = os.environ.get('OWNER','titusbspgit')
          repo = os.environ.get('REPO','PSVValidation')
          branch = os.environ.get('BRANCH','main')
          output_dir = os.environ.get('OUTPUT_DIR','Test_Output/GPIO/TestPlan/')
          ip_name = os.environ.get('IP_NAME','GPIO')
          filename = f"{ip_name}_TestPlan_{ts_for_name}.xlsx"
          output_path = os.path.join(output_dir, filename)

          rows = [
              ('owner', owner),
              ('repo', repo),
              ('branch', branch),
              ('output_directory', output_dir),
              ('IP_NAME', ip_name),
              ('commit_changes', 'true'),
              ('timestamp_ist', ts_str),
              ('output_file_path', output_path),
          ]
          r = 1
          for k, v in rows:
              add_meta_row(r, k, v); r += 1

          # Embed exact final_json as chunks to avoid cell limits
          add_meta_row(r, 'final_json_chunks', 'begin'); r += 1
          chunk_size = 30000
          for idx, start in enumerate(range(0, len(final_json_raw), chunk_size), start=1):
              chunk = final_json_raw[start:start+chunk_size]
              add_meta_row(r, f'chunk_{idx}', chunk); r += 1
          add_meta_row(r, 'final_json_chunks', 'end'); r += 1

          # Very hidden MetaData sheet
          meta.sheet_state = 'veryHidden'

          # Save workbook
          os.makedirs(output_dir, exist_ok=True)
          wb.save(output_path)
          PY
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IP_NAME: GPIO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add ${IP_NAME} TestPlan $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S %Z')"
            git push
          fi
