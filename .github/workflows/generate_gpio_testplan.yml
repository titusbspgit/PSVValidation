    "Test Case Name": "test_gpio_level_sel_intr_en",
    "Test Description": "Validates level-based interrupt generation and clearing for GP0 GPIO pins 8 through 39. The test configures each pin for input mode with level-triggered interrupts, enables the group interrupt via gp0_intr1_intr_en1, stimulates the corresponding pin state via a memory-backed pattern, and waits for the interrupt handler to run. It then verifies that the per-pin raw status is set, the group status reflects the active pin, and that both per-pin and group status clear correctly when commanded.",
    "Meta Test Description": "The testcase initializes error tracking and conditionally enables the appropriate platform interrupt line. It programs the system-level interrupt enable for the selected GPIO instance. For i = 0..31 (GPIO8..GPIO39), it configures each per-pin register at an address stride from the base (gp0_gpio_8 + i*4) with 0x00180000 (input mode with level interrupt), waits, enables the corresponding group interrupt bit by writing (1<<i) to gp0_intr1_intr_en1, waits briefly, writes 0xFFFFFFFF to a memory location (0xA0243ffc) to stimulate activity, sets a pending flag, and spins until the interrupt handler clears the pending flag. After a delay, a second pass programs each pin for the opposite level selection by writing 0x00100000 to the same per-pin address, enables the group bit, writes the complement pattern ~(1<<i) to 0xA0243ffc, sets the pending flag, and again waits until the handler completes. The interrupt handler reads the per-pin register for the active index and checks the raw status bit (bit 1). If set, it reads gp0_intr1_intr_sts1 to confirm the corresponding group bit is set. It then clears the per-pin interrupt by writing 0x00110000 to the per-pin register, waits, and verifies the readback equals 0x100001. It disables the group interrupt by writing 0x00000000 to gp0_intr1_intr_en1 and verifies gp0_intr1_intr_sts1 clears to zero. Finally, it writes to the system RAW_STCR register to clear the system-level interrupt bit and verifies that the bit is cleared by a subsequent read. If any expected condition fails at any step, the error counter is incremented. The test exits via finish(test_err), reporting success when test_err == 0.",
    "Speed": "NA",
    "Mode": "ISR",
    "Memory Start Offset": "NA",
    "Memory End Offset": "NA",
    "Remarks": "Requires platform interrupt routing and an installed interrupt handler to clear the pending flag. Group interrupt enable and status registers must be accessible. The test relies on a memory-backed stimulus location to drive pin-level conditions. Ensure system-level interrupt enable is configured for the selected GPIO instance before running.",
    "Test Steps / Procedure": "1. Configure the system to route the GPIO interrupt for the active instance and enable it.\n2. For each GPIO pin from 8 to 39, program the corresponding GP0 GPIO per-pin register range (starting at gp0_gpio_8) for input mode with level-high interrupt selection.\n3. For each configured pin, enable the corresponding bit in gp0_intr1_intr_en1.\n4. Apply a stimulus pattern that asserts the selected pin level and wait for the interrupt to be serviced.\n5. In the interrupt service phase, verify that the per-pin raw status is asserted and that gp0_intr1_intr_sts1 reports the correct group bit for the active pin. Clear the per-pin interrupt, verify the per-pin readback shows the cleared state, disable gp0_intr1_intr_en1, and verify gp0_intr1_intr_sts1 clears to zero.\n6. Repeat steps 2–5 with level-low selection for each GPIO pin by reprogramming the per-pin configuration and applying the complementary stimulus pattern.\n7. Declare PASS if all pins generate the expected interrupts in both level configurations and all clear operations succeed without errors; otherwise declare FAIL.",
    "Meta Test Steps / Procedure": "Entry: test_case()\n1) Init: test_err = 0; conditionally enable platform interrupt: if GPIO0 then GIC_EnableIRQ(87); if GPIO1 then GIC_EnableIRQ(88).\n2) System-level interrupt enable: if GPIO0 then write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); if GPIO1 then write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).\n3) Level-high loop (i = 0..31):\n   a) wr_val = (1<<i).\n   b) write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4), 0x00180000) to configure input mode and level-high interrupt.\n   c) wait_on(50).\n   d) write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val) to enable the group interrupt bit.\n   e) wait_on(10).\n   f) write_reg(0xA0243ffc, 0xFFFFFFFF) to drive stimulus.\n   g) int_pend = 1; while (int_pend == 1) { printf(\"Waiting for interrupt\"); wait_on(10); }\n4) wait_on(100).\n5) Level-low loop (i = 0..31):\n   a) wr_val = (1<<i).\n   b) write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4), 0x00100000) to configure input mode with opposite level selection.\n   c) wait_on(50).\n   d) write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val) to enable the group bit.\n   e) wait_on(10).\n   f) write_reg(0xA0243ffc, ~(wr_val)) to drive complementary stimulus for pin i.\n   g) int_pend = 1; while (int_pend == 1) { printf(\"Waiting for interrupt\"); wait_on(10); }\n6) Exit: finish(test_err).\n\nInterrupt handler: Default_IRQHandler()\n1) Setup: wr_val = (1<<i); int_pend = 0; write_reg(0xA0243ffc, 0xFFFFFFFF).\n2) rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4)).\n3) If ((rdata & 0x2) != 0x0):\n   a) rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & (1<<i)) == 0) { printf(\"ERROR: Group Interrupt not occured\"); test_err++; }\n   b) write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4), 0x00110000) to clear raw status; wait_on(20); rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i*4)); if (rdata == 0x100001) { /* success */ } else { printf(\"ERROR : Interrupt clear failed : Interrupt value = %x\", rdata); test_err++; }\n   c) write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000); rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp != 0x0) { printf(\"ERROR : Group Interrupt clear failed: Interrupt value:%x\", rdata_grp); test_err++; }\n   d) If GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) != 0) { printf(\"sysreg status not cleared\"); test_err++; }\n      If GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR) != 0) { printf(\"sysreg status not cleared\"); test_err++; }\n4) Else { printf(\"Interrupt Not occured\"); test_err++; }\n5) Platform IRQ clear: if GPIO0 then GIC_ClearIRQ(87); if GPIO1 then GIC_ClearIRQ(88).",
    "Impacted Registers": "gp0_gpio_8; gp0_intr1_intr_en1; gp0_intr1_intr_sts1",
    "Meta Impacted Registers": "MIZAR_LSS_SYSREG_INTR_EN1; MIZAR_GPIO_GP0_GPIO_8; MIZAR_GPIO_GP0_INTR1_INTR_EN1; 0xA0243ffc; MIZAR_GPIO_GP0_INTR1_INTR_STS1; MIZAR_LSS_SYSREG_RAW_STCR1",
    "Validation / Acceptance Criteria": "PASS: For each GPIO pin 8–39 in both level-high and level-low configurations, an interrupt is generated, the group status reflects the active pin, per-pin and group status clear correctly, and the system-level interrupt status is cleared. FAIL: Any missing interrupt, incorrect group status, failed per-pin clear readback, failed group status clear, or uncleared system-level status.",
    "Meta Validation / Acceptance Criteria": "During Default_IRQHandler(): require (read per-pin) (rdata & 0x2) != 0x0 to confirm raw status. Require (read gp0_intr1_intr_sts1) (rdata_grp & (1<<i)) != 0 for the active pin. After clearing per-pin by write 0x00110000, require subsequent read of per-pin register equals 0x100001. After disabling group by writing 0x00000000 to gp0_intr1_intr_en1, require gp0_intr1_intr_sts1 reads 0x0. For GPIO0 path: after write to MIZAR_LSS_SYSREG_RAW_STCR1 with LSS_SYSREG_RAW_STCR1_GPIO0_INTR, require (readback & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0; similarly for GPIO1 with LSS_SYSREG_RAW_STCR1_GPIO1_INTR. Overall PASS when test_err == 0 at finish(); otherwise FAIL.",
