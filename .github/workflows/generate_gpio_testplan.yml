name: Generate GPIO TestPlan XLSX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX TestPlan
        run: python Test_Output/GPIO/TestPlan/generate_testplan.py

      - name: Move XLSX to output directory
        run: |
          mv GPIO_TestPlan_*.xlsx Test_Output/GPIO/TestPlan/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          git commit -m "Auto-generated GPIO TestPlan XLSX"
          git push
