name: Generate GPIO TestPlan (Stage1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel (.xlsx)
        run: |
          python tools/generate_gpio_testplan.py

      - name: Locate generated file
        id: locate
        shell: bash
        run: |
          FILE=$(ls -1t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1)
          if [ -z "$FILE" ]; then
            echo "No XLSX generated" >&2
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          TS=$(basename "$FILE" .xlsx | sed -E 's/^GPIO_TestPlan_//')
          echo "ts=$TS" >> $GITHUB_OUTPUT

      - name: Commit finalized Excel only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.locate.outputs.file }}"
          git commit -m "Final formatted Excel generated from JSON input | IP: GPIO | IST: ${{ steps.locate.outputs.ts }}" || echo "Nothing to commit"
          git push
