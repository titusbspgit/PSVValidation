name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'tools/generate_testplan_excel.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install openpyxl
      - name: Generate Excel
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
        run: |
          python tools/generate_testplan_excel.py
      - name: Commit Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE=$(ls -t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -n1)
          if [ -n "$FILE" ]; then
            git add "$FILE"
            git commit -m "Add GPIO TestPlan Excel generated by Stage1 automation (IST timestamp in filename)" || echo "No changes to commit"
            git push
          else
            echo "Excel not generated" && exit 1
