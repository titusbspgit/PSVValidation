name: Generate GPIO TestPlan from JSON

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - .github/tools/generate_gpio_testplan.py
      - .github/workflows/generate_gpio_testplan.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from embedded JSON (deterministic IST timestamp)
        id: gen
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          BRANCH: main
        run: |
          FIXED_TIMESTAMP=$(python - <<'PY'
from datetime import datetime
try:
    from zoneinfo import ZoneInfo
except Exception:
    from backports.zoneinfo import ZoneInfo  # if available
print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y%m%d_%H%M%S'))
PY
          )
          export FIXED_TIMESTAMP
          echo "Using FIXED_TIMESTAMP=${FIXED_TIMESTAMP}"
          python .github/tools/generate_gpio_testplan.py

      - name: Commit final Excel only
        if: success() && steps.gen.outputs.xlsx_path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Committing: ${{ steps.gen.outputs.xlsx_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gen.outputs.xlsx_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Final formatted Excel generated from JSON input"
          git push
