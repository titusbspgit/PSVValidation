name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_gpio_testplan.yml
      - tools/generate_gpio_testplan.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from Stage 6 aggregated JSON
        run: |
          python tools/generate_gpio_testplan.py
      - name: Commit and push generated Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Read commit message prepared by the generator script (contains IST timestamp)
          COMMIT_MSG_FILE="Test_Output/GPIO/TestPlan/commit_message.txt"
          if [ -f "$COMMIT_MSG_FILE" ]; then
            COMMIT_MSG=$(cat "$COMMIT_MSG_FILE")
          else
            # Fallback generic message with current IST timestamp
            IST_TS=$(TZ=Asia/Kolkata date +"%Y%m%d_%H%M%S")
            COMMIT_MSG="Auto-generate GPIO TestPlan Excel at ${IST_TS} IST (IP_NAME=GPIO)"
          fi

          git add Test_Output/GPIO/TestPlan/*.xlsx Test_Output/GPIO/TestPlan/commit_message.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${{ github.ref_name }}
          fi
