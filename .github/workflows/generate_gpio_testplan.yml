name: Generate GPIO TestPlan XLSX

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_gpio_testplan.yml'
      - 'tools/generate_gpio_testplan.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata
      - name: Generate Excel and commit
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python tools/generate_gpio_testplan.py
