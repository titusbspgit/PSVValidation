name: Generate GPIO TestPlan XLSX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate GPIO TestPlan XLSX
        working-directory: Test_Output/GPIO/TestPlan
        run: python build_xlsx.py

      - name: Verify XLSX generated
        run: |
          ls -la Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx
          echo "XLSX file generated successfully"

      - name: Commit and push XLSX to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx"
          git commit -m "Add auto-generated GPIO TestPlan XLSX [skip ci]"
          git push
