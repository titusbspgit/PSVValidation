name: Generate GPIO Test Plan Excel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel Test Plan (GPIO)
        run: |
          python scripts/generate_gpio_testplan_xlsx.py

      - name: Commit and push Excel if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            TS=$(python - <<'PY'
from pathlib import Path
p=Path('Test_Output/GPIO/TestPlan')
files=sorted(p.glob('GPIO_TestPlan_*.xlsx'))
if not files:
    raise SystemExit(1)
print(files[-1].name.split('_')[-2]+'-'+files[-1].name.split('_')[-1].split('.')[0])
PY
)
            git commit -m "Add GPIO Test Plan (Stage1 format) with IST timestamp ${TS}"
            git push origin main
          else
            echo "No changes to commit."
          fi
