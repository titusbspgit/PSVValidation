# Re-trigger: 2026-05-14T10:10:30Z
name: Generate PCIE TestPlan Excel

on:
  push:
    paths:
      - .github/workflows/generate_pcie_testplan_pcie.yml
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from embedded data and commit
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, json, zipfile
          from datetime import datetime, timedelta, timezone
          from collections import OrderedDict

          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, Alignment, PatternFill, Border, Side
          from openpyxl.worksheet.datavalidation import DataValidation

          records = [
              OrderedDict([
                  ("Index", 1),
                  ("SS / Module", "PCIe0 SII RC"),
                  ("Feature", "Testable: writeAsRead"),
                  ("Test Case Name", "pcie0_sii_rc_reg_wr_rd_test"),
                  ("Test Description", "Performs default value checks and masked write/read verification across PCIe0 SII RC registers using defined masks and expected defaults, then reports pass or fail based on mismatch counters."),
                  ("Speed", "NA"),
                  ("Mode", "Polling"),
                  ("Memory Start Offset", "0xE68C0000"),
                  ("Memory End Offset", "NA"),
                  ("Remarks", "Addresses with read mask zero are not read. Addresses with write mask zero are not written or read back. Entries marked in the skip array are skipped for both write and read. One reset control register is skipped during default checks. The soft reset routine exists but is not invoked."),
                  ("Test Steps / Procedure", """1) Initialize by checking default values for each target register; if a register is not readable, skip it; skip the reset control register in this phase.\n2) For each writable register, iterate over predefined data patterns and write the pattern; skip entries marked to be skipped.\n3) For each readable and writable register, read back the value and compare it to the expected value derived from masks and defaults; count mismatches.\n4) After all patterns and registers are processed, if any default or write/read mismatches occurred, set failure; otherwise set pass.\n5) Conclude the test by returning pass when no failures were observed, else return fail."""),
                  ("Impacted Registers", "SII_CFG_BAR0_START1, SII_CFG_BAR0_START2, SII_CFG_BAR0_LIMIT1, SII_CFG_BAR0_LIMIT2, SII_SOFT_RESET_CTRL, SII_PHY_RST_CONTROL"),
                  ("Validation / Acceptance Criteria", """1) Default check comparison equals expected default for each readable register → Count remains unchanged and log indicates PASS.\n2) Write/read comparison equals masked expected value for each readable and writable register → Count remains unchanged and log indicates PASS.\n3) Any mismatch during default or write/read comparisons → Corresponding failure counter increments and log indicates Failed.\n4) Final criterion: def_fail_cnt == 0 and wr_fail_cnt == 0 → finish(0) (PASS); otherwise → finish(1) (FAIL)."""),
                  ("Code Generation (Required / Not)", ""),
                  ("Hidden_Test_Case_Name", "pcie0_sii_rc_reg_wr_rd_test"),
                  ("Hidden_Test_Description", "test_case() runs chk_rst_val() to verify default values for all entries in addr_array using read_mask_array and default_value_array, skipping unreadable addresses and the PHY reset control register; then runs chk_rd_wr() to write patterns to writable registers (per write_mask_array and skip_array), reads back, computes exp_val with masks and defaults, compares, and accumulates failures; finally finishes with pass/fail based on def_fail_cnt and wr_fail_cnt."),
                  ("Hidden_Remarks", "In default value check, if read_mask_array[i] == 0x00000000, the address is skipped. The address equal to mizar_PCIE0_SII_PHY_RST_CONTROL is explicitly skipped. In write/read check, if skip_array[i] == 1, the address is skipped. If write_mask_array[i] == 0x00000000, the address is skipped for both writing and subsequent reading. If read_mask_array[i] == 0x00000000, reading is skipped. The soft_reset_chk() function is defined but calls are commented out in test_case()."),
                  ("Hidden_Test_Steps_Procedure", "..."),
                  ("Hidden_Impacted_Registers", "..."),
                  ("Hidden_Validation_Acceptance_Criteria", "..."),
                  ("Hidden_Header_Includes", "..."),
                  ("Hidden_Macro_Defines", "..."),
                  ("Hidden_Skip_Array_Definition", "..."),
              ]),
              OrderedDict([
                  ("Index", 2),
                  ("SS / Module", "PCIe1 SII RC"),
                  ("Feature", "Testable: writeAsRead"),
                  ("Test Case Name", "pcie1_sii_rc_reg_wr_rd_test"),
                  ("Test Description", "Checks reset values and verifies masked write and read behavior for the controller registers using predefined data patterns."),
                  ("Speed", "NA"),
                  ("Mode", "Polling"),
                  ("Memory Start Offset", "0xE68C1000"),
                  ("Memory End Offset", "NA"),
                  ("Remarks", "Unreadable addresses are skipped. Non-writable addresses are skipped for write and readback. Some addresses are skipped by a list. One reset control register is skipped in default checks. The soft reset routine exists but is not used."),
                  ("Test Steps / Procedure", "..."),
                  ("Impacted Registers", "NA"),
                  ("Validation / Acceptance Criteria", "..."),
                  ("Code Generation (Required / Not)", ""),
                  ("Hidden_Test_Case_Name", "pcie1_sii_rc_reg_wr_rd_test"),
                  ("Hidden_Test_Description", "Performs default value checks and masked write/read verification across PCIe1 SII RC registers using defined masks and expected defaults, then reports pass or fail based on mismatch counters."),
                  ("Hidden_Remarks", "..."),
                  ("Hidden_Test_Steps_Procedure", "..."),
                  ("Hidden_Impacted_Registers", "..."),
                  ("Hidden_Validation_Acceptance_Criteria", "..."),
                  ("Hidden_Header_Includes", "..."),
                  ("Hidden_Macro_Defines", "..."),
                  ("Hidden_Skip_Array_Definition", "..."),
              ]),
              OrderedDict([
                  ("Index", 3),
                  ("SS / Module", "PCIe Configuration Space"),
                  ("Feature", "Testable: writeAsRead"),
                  ("Test Case Name", "pcie_cfg_wr_rd_test"),
                  ("Test Description", "Performs PCIe link training, programs coherency control fields, then exercises configuration space by writing and reading BARs and command fields while polling status and a synchronization register."),
                  ("Speed", "NA"),
                  ("Mode", "Polling"),
                  ("Memory Start Offset", "0xE6004100"),
                  ("Memory End Offset", "NA"),
                  ("Remarks", "Execution paths depend on compile-time flags for device or root complex instances. The test waits for link status bits and for an external synchronization value before completing. If conditions are not met, the loops do not exit."),
                  ("Test Steps / Procedure", "..."),
                  ("Impacted Registers", "NA"),
                  ("Validation / Acceptance Criteria", "..."),
                  ("Code Generation (Required / Not)", ""),
                  ("Hidden_Test_Case_Name", "pcie_cfg_wr_rd_test"),
                  ("Hidden_Test_Description", "..."),
                  ("Hidden_Remarks", "..."),
                  ("Hidden_Test_Steps_Procedure", "..."),
                  ("Hidden_Impacted_Registers", "..."),
                  ("Hidden_Validation_Acceptance_Criteria", "..."),
                  ("Hidden_Header_Includes", "..."),
                  ("Hidden_Macro_Defines", "NA"),
                  ("Hidden_Skip_Array_Definition", "NA"),
              ]),
          ]

          keys_order = []
          for rec in records:
              for k in rec.keys():
                  if k not in keys_order:
                      keys_order.append(k)

          wb = Workbook()
          ws = wb.active
          ws.title = "Data"

          for ci, key in enumerate(keys_order, 1):
              ws.cell(row=1, column=ci, value=key)

          for r, rec in enumerate(records, start=2):
              for c, key in enumerate(keys_order, start=1):
                  val = rec.get(key, "")
                  ws.cell(row=r, column=c, value=val)

          header_font = Font(bold=True)
          for cell in ws[1]:
              cell.font = header_font
          ws.freeze_panes = "A2"

          from openpyxl.utils import get_column_letter
          col_widths = {}
          for row in ws.iter_rows(values_only=False):
              for cell in row:
                  v = cell.value
                  l = max(len(line) for line in str(v).splitlines()) if v else 0
                  col_widths[cell.column] = max(col_widths.get(cell.column, 0), l)
          for col_idx, width in col_widths.items():
              ws.column_dimensions[get_column_letter(col_idx)].width = min(max(10, width + 2), 120)

          meta_keys = [k for k in keys_order if k.startswith("Hidden_")]
          ms = wb.create_sheet("Meta_data_sheet")
          for ci, key in enumerate(meta_keys, 1):
              ms.cell(row=1, column=ci, value=key)
          for r, rec in enumerate(records, start=2):
              for c, key in enumerate(meta_keys, start=1):
                  ms.cell(row=r, column=c, value=rec.get(key, ""))
          ms.sheet_state = 'veryHidden'

          main_order = [
              "Index", "SS / Module", "Feature", "Test Case Name", "Test Description", "Speed", "Mode", "Memory Start Offset", "Memory End Offset", "Remarks", "Test Steps / Procedure", "Impacted Registers", "Validation / Acceptance Criteria", "Code Generation (Required / Not)"
          ]
          final_headers = list(main_order)

          ws.delete_rows(1, ws.max_row)
          for ci, key in enumerate(final_headers, 1):
              ws.cell(row=1, column=ci, value=key)
          for r, rec in enumerate(records, start=2):
              for c, key in enumerate(final_headers, start=1):
                  ws.cell(row=r, column=c, value=rec.get(key, ""))

          ws.title = "TestPlan"

          def normalize_numbering(text: str) -> str:
              if text is None:
                  return ""
              s = str(text)
              lines = [ln.strip() for ln in s.splitlines() if ln.strip()]
              if not lines:
                  return s
              import re
              return "\n".join([f"{i}. " + re.sub(r'^\s*(\d+)\s*[\)\.]\s*', '', ln) for i, ln in enumerate(lines, start=1)])

          header_idx = {ws.cell(row=1, column=c).value: c for c in range(1, ws.max_column+1)}
          for col_name in ["Test Steps / Procedure", "Validation / Acceptance Criteria"]:
              cidx = header_idx.get(col_name)
              if cidx:
                  for r in range(2, ws.max_row+1):
                      cell = ws.cell(row=r, column=cidx)
                      cell.value = normalize_numbering(cell.value)

          blue_fill = PatternFill("solid", fgColor="4F81BD")
          center = Alignment(horizontal="center", vertical="center", wrap_text=False)
          header_font = Font(bold=True, color="FFFFFF")
          for c in range(1, ws.max_column+1):
              cell = ws.cell(row=1, column=c)
              cell.font = header_font
              cell.alignment = center
              cell.fill = blue_fill

          wrap_cols = ["Test Description", "Remarks", "Test Steps / Procedure", "Validation / Acceptance Criteria"]
          for name in wrap_cols:
              c = header_idx.get(name)
              if c:
                  for r in range(2, ws.max_row+1):
                      ws.cell(row=r, column=c).alignment = Alignment(wrap_text=True, vertical='top', horizontal='left')

          thin = Side(border_style="thin", color="000000")
          border = Border(left=thin, right=thin, top=thin, bottom=thin)
          for r in range(1, ws.max_row+1):
              for c in range(1, ws.max_column+1):
                  ws.cell(row=r, column=c).border = border

          cg_col = header_idx.get("Code Generation (Required / Not)")
          if cg_col:
              from openpyxl.worksheet.datavalidation import DataValidation
              from openpyxl.utils import get_column_letter
              dv = DataValidation(type="list", formula1='"Required,Blank,Not Required"', allow_blank=True)
              ws.add_data_validation(dv)
              rng = f"{get_column_letter(cg_col)}2:{get_column_letter(cg_col)}{ws.max_row}"
              dv.add(rng)

          allowed = {"TestPlan", "Meta_data_sheet"}
          to_delete = [s.title for s in wb.worksheets if s.title not in allowed]
          for name in to_delete:
              del wb[name]
          if any(s.title == 'Data' for s in wb.worksheets):
              raise SystemExit("Validation failed: 'Data' sheet still present")

          ist = timezone(timedelta(hours=5, minutes=30))
          ts = datetime.now(ist).strftime('%Y%m%d_%H%M%S')
          out_dir = os.path.join('Test_Output', 'PCIE', 'TestPlan')
          os.makedirs(out_dir, exist_ok=True)
          out_path = os.path.join(out_dir, f'PCIE_TestPlan_{ts}.xlsx')
          wb.save(out_path)

          if not zipfile.is_zipfile(out_path):
              raise SystemExit("Validation failed: not a ZIP-based XLSX")
          try:
              _ = load_workbook(out_path)
          except Exception as e:
              raise SystemExit(f"Validation failed: cannot reopen workbook: {e}")

          print(f"Saved: {out_path}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/PCIE/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
