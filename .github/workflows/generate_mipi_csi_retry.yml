name: Generate MIPI_CSI TestPlan XLSX (Retry)

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_retry.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_mipi_csi_retry.py
        env:
          OUTPUT_DIR: .

      - name: Commit and push XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          XLSX_FILE=$(ls -t MIPI_CSI_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Generated: $XLSX_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$XLSX_FILE"
          git commit -m 'Added generated TestPlan Excel'
          git push
