name: Build TestPlan Excel (PCIE)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/build-testplan.yml
      - tools/excel_builder.py
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python tools/excel_builder.py

      - name: Commit Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Listing generated files:"
          ls -lah Test_Output/PCIE/TestPlan || true
          if ls Test_Output/PCIE/TestPlan/*.xlsx 1> /dev/null 2>&1; then
            # Force add in case of .gitignore exclusions
            git add -f Test_Output/PCIE/TestPlan/*.xlsx
            if git diff --cached --quiet; then
              echo "No new Excel changes to commit."
            else
              git commit -m "Final formatted Excel generated from JSON input"
              git push
            fi
          else
            echo "No Excel file generated. Failing the job."
            exit 1
