name: Auto Generate MIPI_CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_and_commit_mipi_csi_20261105.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate XLSX
        working-directory: Test_Output/MIPI/TestPlan
        run: python3 generate_and_commit_mipi_csi_20261105.py
      - name: Commit XLSX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_20261105_181500.xlsx'
          git diff --cached --quiet || git commit -m 'Generated TestPlan Excel Workbook'
          git push
