name: Generate MIPI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_testplan.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/MIPI/TestPlan/generate_mipi_testplan.py

      - name: Commit and push Excel file
        run: |
          cd Test_Output/MIPI/TestPlan/
          XLSX_FILE=$(ls -t MIPI_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Generated: $XLSX_FILE"
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/MIPI/TestPlan/$XLSX_FILE"
          git commit -m "Added generated MIPI TestPlan Excel - $XLSX_FILE"
          git push
          echo "XLSX_FILENAME=$XLSX_FILE" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "## MIPI TestPlan Excel Generated" >> $GITHUB_STEP_SUMMARY
          echo "- File: ${{ env.XLSX_FILENAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Location: Test_Output/MIPI/TestPlan/" >> $GITHUB_STEP_SUMMARY
          echo "- Rows: 4 testcases" >> $GITHUB_STEP_SUMMARY
          echo "- Sheets: TestPlan, MetaData (veryHidden)" >> $GITHUB_STEP_SUMMARY
