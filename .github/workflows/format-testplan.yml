name: Format TestPlan (IST)

on:
  push:
    paths:
      - ".github/workflows/format-testplan.yml"
      - "tools/format_testplan.py"
      - "Test_Output/GPIO/TestPlan/.format_trigger"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install openpyxl pytz
      - name: Run formatter
        env:
          INPUT_DIR: Test_Output/GPIO/TestPlan
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
          TZ: Asia/Kolkata
          COMMIT_MESSAGE: Add formatted test plan for GPIO (IST)
        run: python tools/format_testplan.py
