name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_testplan_xlsx.py'
      - '.github/workflows/generate-testplan-xlsx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel into Test_Output/GPIO/TestPlan
        run: |
          python tools/generate_testplan_xlsx.py --output-dir "Test_Output/GPIO/TestPlan"
      - name: Commit Excel with timestamped message
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -E '(^|\s)Test_Output/GPIO/TestPlan/.*\.xlsx'; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            latest_file=$(ls -t Test_Output/GPIO/TestPlan/testplan_*.xlsx | head -n1)
            ts=$(basename "$latest_file" | sed -E 's/testplan_([0-9_]+)\.xlsx/\1/')
            git commit -m "Add autogenerated GPIO Test Plan ($ts)"
            git push origin main
          else
            echo "No xlsx changes to commit."
          fi
