name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/*.json'
      - '.github/workflows/gpio_testplan_excel.yml'
      - 'scripts/gpio_testplan_excel_gen.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IST timestamp and filename
        run: |
          echo "IST_TIME=$(TZ=Asia/Kolkata date '+%Y-%m-%dT%H:%M:%S%z')" >> $GITHUB_ENV
          echo "DATE=$(TZ=Asia/Kolkata date '+%Y%m%d')" >> $GITHUB_ENV
          echo "TIME=$(TZ=Asia/Kolkata date '+%H%M%S')" >> $GITHUB_ENV
          echo "EXCEL_FILENAME=GPIO_TestPlan_${DATE}_${TIME}.xlsx" >> $GITHUB_ENV
          echo "EXCEL_PATH=Test_Output/GPIO/TestPlan/$(echo GPIO_TestPlan_${DATE}_${TIME}.xlsx)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        run: |
          python scripts/gpio_testplan_excel_gen.py \
            --input Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260424_153000.json \
            --output "$EXCEL_PATH"

      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EXCEL_PATH"
          git commit -m "Generate real GPIO TestPlan Excel ($EXCEL_FILENAME) from JSON. IP=GPIO, IST=$IST_TIME (commit_changes=true)" || echo "No changes to commit"

      - name: Capture commit hash
        id: getsha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Update JSON META_DATA with timestamp and output commit hash
        run: |
          python - << 'PY'
          import json, os
          p = 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260424_153000.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          ist = os.environ['IST_TIME']
          sha = os.environ.get('GITHUB_SHA')
          # prefer last commit on current branch (from previous step)
          with open(os.environ['GITHUB_OUTPUT'], 'r') as go:
              pass
          # Fall back to rev-parse HEAD via environment file from previous step
          # But simpler: read from git directly
          import subprocess
          try:
              new_sha = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          except Exception:
              new_sha = None
          # Update META_DATA
          md = data.get('META_DATA', {})
          md['generation_timestamp_ist'] = ist
          if new_sha:
              md['output_commit_hash'] = new_sha
          # Update artifacts with new Excel file info
          excel_filename = os.environ['EXCEL_FILENAME']
          excel_path = os.environ['EXCEL_PATH']
          owner_repo = os.environ['GITHUB_REPOSITORY']
          md.setdefault('artifacts', {})
          md['artifacts']['excel_filename'] = excel_filename
          md['artifacts']['excel_path'] = excel_path
          md['artifacts']['excel_url'] = f"https://github.com/{owner_repo}/blob/main/{excel_path}"
          data['META_DATA'] = md
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_20260424_153000.json
          git commit -m "Update JSON META_DATA with IST timestamp and output commit hash; Excel path updated to $EXCEL_PATH" || echo "No JSON changes to commit"
          git push
