name: Generate and commit GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/input/GPIO_TestPlan_Input.json'
      - '.github/scripts/gen_excel_from_json.py'
      - '.github/workflows/gpio_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON (Stage1 formatting)
        run: |
          python .github/scripts/gen_excel_from_json.py \
            --json Test_Output/GPIO/TestPlan/input/GPIO_TestPlan_Input.json \
            --ip GPIO \
            --output-dir Test_Output/GPIO/TestPlan

      - name: Prepare commit message
        id: prep
        run: |
          TS=$(cat Test_Output/GPIO/TestPlan/.last_ist_timestamp)
          echo "ts=$TS" >> $GITHUB_OUTPUT

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[Stage1] Add GPIO Test Plan Excel generated on ${{ steps.prep.outputs.ts }}"
            git push
          fi
