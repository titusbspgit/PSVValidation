name: Generate GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/GPIO_TestPlan.json'
      - '.github/workflows/gpio_testplan_excel.yml'
      - 'tools/generate_testplan_excel.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-cache-dir openpyxl
      - name: Generate Excel
        env:
          IP_NAME: GPIO
        run: |
          python tools/generate_testplan_excel.py \
            --json Test_Output/GPIO/TestPlan/GPIO_TestPlan.json \
            --outdir Test_Output/GPIO/TestPlan \
            --ip-name "$IP_NAME"
      - name: Validate OOXML structure
        run: |
          python - <<'PY'
          import os, glob, zipfile, sys
          files = glob.glob('Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx')
          assert files, 'No Excel generated in expected path'
          xlsx = max(files, key=os.path.getmtime)
          with zipfile.ZipFile(xlsx, 'r') as z:
              names = set(z.namelist())
              assert '[Content_Types].xml' in names, 'Missing [Content_Types].xml'
              assert 'xl/workbook.xml' in names, 'Missing xl/workbook.xml'
              assert any(n.startswith('xl/worksheets/') for n in names), 'No worksheets found under xl/worksheets/'
          print(xlsx)
          PY
      - name: Commit Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE=$(ls -t Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx | head -1)
          if [ -z "$FILE" ]; then echo "No Excel to commit"; exit 1; fi
          git add "$FILE"
          TS=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S'))
          PY
          )
          git commit -m "Final formatted Excel generated from JSON input — ${TS} IST" || exit 0
          git push
