name: Generate GPIO TestPlan Excel (Batch 1)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python scripts/build_excel_gpio_batch1.py

      - name: Commit final Excel only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f "Test_Output/GPIO/TestPlan/GPIO_TestPlan_WORKING.xlsx"
          git commit -m "Final formatted Excel generated from JSON input (Batch 1)" || echo "No changes to commit"
          git push
