name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - tools/generate_gpio_testplan_excel.py
      - .github/workflows/generate-gpio-testplan-excel.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl tzdata
      - name: Run Excel generator
        run: |
          python tools/generate_gpio_testplan_excel.py
      - name: Commit and push workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -E "\.xlsx$"; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Added generated TestPlan Excel"
            git push
          else
            echo "No workbook changes to commit."
          fi
