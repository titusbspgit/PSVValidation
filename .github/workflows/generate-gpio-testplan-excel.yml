name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate TestPlan Excel (IST timestamped)
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan/
        run: |
          python scripts/generate_testplan_excel.py

      - name: Commit Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
