name: Generate TestPlan Excel\n\non:\n  workflow_dispatch: {}\n  push:\n    paths:\n      - 'Test_Output/GPIO/TestPlan/final_testplan.json'\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n\n      - name: Install dependencies\n        run: pip install --upgrade pip && pip install openpyxl pytz\n\n      - name: Generate Excel from JSON (RAW GitHub URL)\n        env:\n          JSON_URL: https://raw.githubusercontent.com/titusbspgit/PSVValidation/main/Test_Output/GPIO/TestPlan/final_testplan.json\n          OUTPUT_DIR: Test_Output/GPIO/TestPlan\n        run: |
          python .github/scripts/generate_testplan_xlsx.py\n\n      - name: Commit Excel to main\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |
          set -e
          FILEPATH=$(cat .github/scripts/excel_path.txt)
          echo "Excel path: $FILEPATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILEPATH"
          git commit -m "Re-push: Generated TestPlan Excel" || echo "No changes to commit"
          git push\n