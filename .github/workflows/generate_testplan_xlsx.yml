name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Test_Output/GPIO/TestPlan/final_testplan.json"
      - ".github/scripts/generate_testplan_xlsx.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        run: |
          python .github/scripts/generate_testplan_xlsx.py \
            --input Test_Output/GPIO/TestPlan/final_testplan.json \
            --output-dir Test_Output/GPIO/TestPlan \
            --owner titusbspgit --repo PSVValidation --branch main

      - name: Commit Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
