name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/final_testplan.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Generate Excel from JSON
        env:
          JSON_URL: https://raw.githubusercontent.com/titusbspgit/PSVValidation/main/Test_Output/GPIO/TestPlan/final_testplan.json
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python .github/scripts/generate_testplan_xlsx.py

      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Re-push: Generated TestPlan Excel"
            git push
          fi
