name: Generate TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/final_testplan.json'
      - '.github/scripts/generate_testplan_xlsx.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip && pip install openpyxl

      - name: Generate Excel
        env:
          JSON_URL: https://raw.githubusercontent.com/titusbspgit/PSVValidation/main/Test_Output/GPIO/TestPlan/final_testplan.json
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
        run: |
          python .github/scripts/generate_testplan_xlsx.py

      - name: Commit Excel
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ls Test_Output/GPIO/TestPlan/testplan_*.xlsx >/dev/null 2>&1; then
            git add Test_Output/GPIO/TestPlan/testplan_*.xlsx
            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Re-push: Generated TestPlan Excel"
              git push
            fi
          else
            echo "No Excel generated. Failing the job."
            exit 1
