name: Generate PCIE TestPlan XLSX from JSON

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/generate_testplan_xlsx.yml"
      - "tools/generate_testplan_xlsx.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate and commit XLSX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/generate_testplan_xlsx.py
