name: Generate PCIE TestPlan XLSX

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/PCIE/TestPlan/generate_testplan.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate XLSX
        run: |
          cd Test_Output/PCIE/TestPlan
          python generate_testplan.py

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/PCIE/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
