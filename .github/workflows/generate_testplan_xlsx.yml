name: Generate GPIO TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/generate_xlsx.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: |
          cd Test_Output/GPIO/TestPlan
          python generate_xlsx.py

      - name: Commit and push XLSX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/GPIO/TestPlan/*.xlsx'
          git commit -m 'Added generated TestPlan Excel - GPIO TestPlan XLSX workbook'
          git push

      - name: Cleanup generator script
        run: |
          git rm Test_Output/GPIO/TestPlan/generate_xlsx.py
          git rm .github/workflows/generate_testplan_xlsx.yml
          git commit -m 'Cleanup: Remove generator script and workflow after XLSX generation'
          git push
