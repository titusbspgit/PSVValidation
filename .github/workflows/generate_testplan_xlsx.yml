name: Generate MIPI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/testplan_data.json'
      - 'Test_Output/MIPI/TestPlan/generate_mipi_testplan.py'

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Generate XLSX
        run: python3 Test_Output/MIPI/TestPlan/generate_mipi_testplan.py
      - name: Commit XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
