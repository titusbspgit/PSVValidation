name: Generate GPIO TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - Test_Output/GPIO/TestPlan/GPIO_TestPlan.json
      - .github/workflows/generate_gpio_testplan_excel.yml
      - scripts/json_to_excel_stage1.py

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Compute IST timestamp
        id: ist
        run: |
          export TZ=Asia/Kolkata
          NOW=$(date +'%Y%m%d_%H%M%S')
          echo "stamp=$NOW" >> $GITHUB_OUTPUT

      - name: Generate Excel
        run: |
          python scripts/json_to_excel_stage1.py \
            --input-json "Test_Output/GPIO/TestPlan/GPIO_TestPlan.json" \
            --output-dir "Test_Output/GPIO/TestPlan" \
            --ip-name "GPIO" \
            --timestamp "${{ steps.ist.outputs.stamp }}"

      - name: Commit Excel
        run: |
          export TZ=Asia/Kolkata
          FNAME="Test_Output/GPIO/TestPlan/GPIO_TestPlan_${{ steps.ist.outputs.stamp }}.xlsx"
          if [ ! -f "$FNAME" ]; then echo "Excel not found at $FNAME"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FNAME"
          git commit -m "Add autogenerated GPIO TestPlan (IST $(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
          git push
