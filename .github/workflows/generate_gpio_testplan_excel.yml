name: Generate GPIO Test Plan Excel (Stage1 Fallback)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_gpio_testplan_excel.yml
      - tools/generate_excel_from_json_gpio.py
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel from JSON (Stage1 formatting)
        run: |
          python tools/generate_excel_from_json_gpio.py

      - name: Commit finalized Excel
        run: |
          FILE_PATH="$(cat generated_gpio_excel_path.txt)"
          echo "Generated file: ${FILE_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE_PATH}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
