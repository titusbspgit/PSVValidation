name: Generate GPIO TestPlan Excel (Stage1 Fallback)

on:
  push:
    paths:
      - .github/workflows/generate_gpio_testplan_excel.yml
      - .github/scripts/gen_gpio_excel.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Compute IST timestamps for filename and commit message
        run: |
          export TZ=Asia/Kolkata
          echo "TS_FN=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "TS_HUMAN=$(date '+%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV

      - name: Generate Excel from embedded JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
          TS_FN: ${{ env.TS_FN }}
        run: |
          python .github/scripts/gen_gpio_excel.py

      - name: Commit and push Excel file
        env:
          TS_HUMAN: ${{ env.TS_HUMAN }}
          TS_FN: ${{ env.TS_FN }}
        run: |
          FILE="Test_Output/GPIO/TestPlan/GPIO_TestPlan_${TS_FN}.xlsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Add GPIO TestPlan Excel generated on ${TS_HUMAN}" || echo "No changes to commit"
          git push

      - name: Output file path
        run: echo "Generated file at Test_Output/GPIO/TestPlan/GPIO_TestPlan_${{ env.TS_FN }}.xlsx"