name: Generate GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'Test_Output/GPIO/TestPlan/GPIO_TestPlan.json'
      - 'tools/generate_testplan_excel.py'
      - '.github/workflows/generate_gpio_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel from JSON
        run: |
          python tools/generate_testplan_excel.py \
            --input Test_Output/GPIO/TestPlan/GPIO_TestPlan.json \
            --output-dir Test_Output/GPIO/TestPlan \
            --ip-name GPIO
          test -f gen_path.txt && echo "generated_excel_relpath=$(cat gen_path.txt)" >> $GITHUB_ENV

      - name: Validate generated file exists
        run: |
          if [ -z "${{ env.generated_excel_relpath }}" ]; then
            echo "No generated path captured" && exit 1
          fi
          if [ ! -f "${{ env.generated_excel_relpath }}" ]; then
            echo "Generated Excel not found at ${{ env.generated_excel_relpath }}" && exit 1
          fi

      - name: Commit and push Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.generated_excel_relpath }}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push origin HEAD:main
          fi
