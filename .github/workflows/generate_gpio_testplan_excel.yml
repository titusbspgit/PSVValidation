name: Generate GPIO Test Plan Excel

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate_gpio_testplan_excel.yml
      - tools/generate_excel_from_json_gpio.py
      - tools/trigger_gpio_excel.txt
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Generate Excel
        run: |
          python tools/generate_excel_from_json_gpio.py

      - name: Commit Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ls Test_Output/GPIO/TestPlan/*.xlsx 1> /dev/null 2>&1; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            if git diff --cached --quiet; then
              echo "No Excel changes to commit."
            else
              git commit -m "Final formatted Excel generated from JSON input"
              git push origin HEAD:main
            fi
          else
            echo "No Excel file generated."
            exit 1
          fi
