name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate_gpio_testplan_excel.yml'
      - '.github/scripts/generate_testplan_excel.py'
      - '.github/workflows/trigger_gpio_testplan_run.txt'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        id: gen
        env:
          IP_NAME: GPIO
          DEST_DIR: Test_Output/GPIO/TestPlan
          JSON_DATA: |
