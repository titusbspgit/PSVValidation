name: Generate and Commit GPIO TestPlan Excel

on:
  push:
    paths:
      - 'scripts/generate_gpio_testplan.py'
      - '.github/workflows/gpio_testplan_gen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/generate_gpio_testplan.py
      - name: Commit Excel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            ts=$(python - <<'PY'
import datetime
from datetime import timezone, timedelta
ist = timezone(timedelta(hours=5, minutes=30))
now = datetime.datetime.now(ist)
print(now.strftime('%Y-%m-%d %H:%M:%S'))
PY
)
            git commit -m "Add GPIO TestPlan (auto-generated) for IP GPIO on $ts IST"
            git push
          fi
