name: Generate GPIO TestPlan Excel (Stage1)

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/gen_testplan_excel.py'
      - '.github/workflows/gen_testplan_excel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        id: gen
        run: |
          python scripts/gen_testplan_excel.py

      - name: Commit Excel
        if: steps.gen.outputs.excel_path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gen.outputs.excel_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${{ steps.gen.outputs.commit_msg }}"
            git push
          fi
