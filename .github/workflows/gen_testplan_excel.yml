name: Generate PCIE TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/gen_testplan_excel.py'
      - '.github/workflows/gen_testplan_excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from embedded JSON
        env:
          IP_NAME: PCIE
          OUTPUT_DIR: Test_Output/PCIE/TestPlan
          BRANCH: main
        run: |
          python .github/scripts/gen_testplan_excel.py
      - name: Commit Excel artifact
        run: |
          git config user.name "Auto TestPlan Bot"
          git config user.email "bot@example.com"
          if git status --porcelain | grep -q "^ M\|^??"; then
            git add Test_Output/PCIE/TestPlan/*.xlsx
            if git diff --cached --quiet; then
              echo "No Excel changes to commit."
            else
              git commit -m "Final formatted Excel generated from JSON input [skip ci]"
              git push
            fi
          else
            echo "No changes detected."
