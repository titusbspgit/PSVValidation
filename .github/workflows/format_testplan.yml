name: Format TestPlan Excel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format:
    if: "! contains(github.event.head_commit.message, ' TestPlan Generated and Pushed to Github')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl
      - name: Run formatter
        run: |
          python tools/format_testplan.py \
            --input "Test_Output/GPIO/TestPlan/GPIO_TestPlan_2.xlsx" \
            --output "Test_Output/GPIO/TestPlan/GPIO_TestPlan_2_hidden.xlsx"
      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_2_hidden.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit.";
          else
            git commit -m " TestPlan Generated and Pushed to Github"
            git push
          fi
