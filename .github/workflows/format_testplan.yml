name: Format and Commit GPIO TestPlan
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx
      - scripts/format_testplan.py
      - .github/workflows/format_testplan.yml
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl==3.1.2
      - name: Format Excel (TestPlan)
        run: python scripts/format_testplan.py --input "Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx" --output "Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx"
      - name: Commit updated workbook
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx
            git commit -m " TestPlan Generated and Pushed to Github [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
