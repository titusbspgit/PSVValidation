name: Generate Ethernet TestPlan Excel v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/Ethernet/Ethernet0/TestPlan/Ethernet_TestPlan_Generator_v2.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl pytz

      - name: Generate Excel workbook
        working-directory: Test_Output/Ethernet/Ethernet0/TestPlan
        run: python Ethernet_TestPlan_Generator_v2.py

      - name: Commit and push workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/Ethernet/Ethernet0/TestPlan/*.xlsx
          git commit -m "Generated TestPlan Excel Workbook" || echo "No changes to commit"
          git push
