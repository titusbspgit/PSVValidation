name: Generate GPIO TestPlan XLSX (on push)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/testplan_payloads/**/*.json'
      - 'scripts/**'
      - '.github/workflows/generate_testplan_on_push.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Set JSON payload from latest file
        run: |
          FILE=$(ls -1t .github/testplan_payloads/*.json | head -n1)
          echo "Using payload: $FILE"
          {
            echo 'JSON_PAYLOAD<<EOF'
            cat "$FILE"
            echo EOF
          } >> $GITHUB_ENV
      - name: Generate and Commit Excel
        env:
          IP_NAME: GPIO
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          COMMIT_CHANGES: "true"
        run: |
          python scripts/generate_testplan.py --ip-name "$IP_NAME" --output-dir "$OUTPUT_DIR" --commit "$COMMIT_CHANGES"
      - name: List outputs
        run: |
          ls -la Test_Output/GPIO/TestPlan || true
