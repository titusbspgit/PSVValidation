name: JSON to Excel
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/json_to_excel.yml'
      - 'scripts/json_to_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.*
      - name: Generate Excel from JSON
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          python scripts/json_to_excel.py
      - name: Commit Excel output (rebasing and retry on race)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          target_file='TestRepo/gpio/json_testing.xlsx'
          if [ -n "$(git status --porcelain -- "$target_file")" ]; then
            git add "$target_file"
            git commit -m "Add generated Excel file from JSON input [skip ci]" || true
            n=0
            until [ $n -ge 5 ]
            do
              git pull --rebase origin main || true
              if git push; then
                echo "Pushed Excel successfully";
                break;
              fi
              n=$((n+1))
              echo "Push failed, retry $n/5 after short delay..."
              sleep 5
            done
          else
            echo "No changes to commit."
          fi
