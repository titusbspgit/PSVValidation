name: JSON to Excel TestPlan

on:
  push:
    branches: [ main ]
    paths:
      - 'automation/json_to_excel/input.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate and Commit Excel
        env:
          JSON_INPUT_PATH: automation/json_to_excel/input.json
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          IP_NAME: GPIO
          COMMIT_MESSAGE: Final formatted Excel generated from JSON input
        run: |
          python automation/json_to_excel/generate_excel.py
