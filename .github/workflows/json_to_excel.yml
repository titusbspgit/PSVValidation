name: JSON to Excel (Auto)

on:
  push:
    paths:
      - scripts/json_to_excel.py
      - .github/workflows/json_to_excel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade pip openpyxl

      - name: Generate Excel
        id: gen
        env:
          IP_NAME: GPIO
        run: |
          python scripts/json_to_excel.py | tee gen_path.txt
          echo "Generated path: $(cat gen_path.txt)"

      - name: Commit Excel
        run: |
          set -e
          excel_path="$(grep -o 'Test_Output/.*\.xlsx' gen_path.txt | tail -n1)"
          if [ -z "$excel_path" ]; then
            echo "Failed to locate generated Excel path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$excel_path"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add $(basename \"$excel_path\")"
            git push
          fi
