name: JSON to Excel Generator
on:
  push:
    paths:
      - .github/json_to_excel_trigger
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel from JSON
        env:
          OUTPUT_DIR: Test_Output/GPIO/TestPlan
          OUTPUT_FILENAME: local_excel_test.xlsx
        run: |
          python - << 'PYCODE'
          import os, json, datetime
          from openpyxl import Workbook, load_workbook
          LOGS=[]
          def log(m):
              ts = datetime.datetime.utcnow().isoformat()+"Z"
              line=f"[{ts}] {m}"
              print(line); LOGS.append(line)
          DATA = [
            {"id": 1, "first_name": "Jeanette", "last_name": "Penddreth", "email": "jpenddreth0@census.gov", "gender": "Female", "ip_address": "26.58.193.2"},
            {"id": 2, "first_name": "Giavani", "last_name": "Frediani", "email": "gfrediani1@senate.gov", "gender": "Male", "ip_address": "229.179.4.212"},
            {"id": 3, "first_name": "Noell", "last_name": "Bea", "email": "nbea2@imageshack.us", "gender": "Female", "ip_address": "180.66.162.255"},
            {"id": 4, "first_name": "Willard", "last_name": "Valek", "email": "wvalek3@vk.com", "gender": "Male", "ip_address": "67.76.188.26"}
          ]
          headers = sorted({k for r in DATA for k in r.keys()})
          outdir=os.environ.get("OUTPUT_DIR","Test_Output/GPIO/TestPlan")
          ofn=os.environ.get("OUTPUT_FILENAME","local_excel_test.xlsx")
          os.makedirs(outdir, exist_ok=True)
          path=os.path.join(outdir, ofn)
          log(f"Computed headers={headers}")
          wb=Workbook()
          ws=wb.active; ws.title="data"
          ws.append(headers)
          for i,rec in enumerate(DATA,1):
              ws.append([rec.get(h) for h in headers])
              if i%1000==0 or i==len(DATA): log(f"Appended row {i}/{len(DATA)}")
          wb.save(path)
          log(f"Saved Excel to {path}")
          wb2=load_workbook(path, read_only=True); ws2=wb2.active
          hdr=[c.value for c in next(ws2.iter_rows(min_row=1, max_row=1))]
          if hdr!=headers: raise SystemExit(f"Header mismatch {hdr} != {headers}")
          rows=sum(1 for _ in ws2.iter_rows(min_row=2, values_only=True))
          if rows!=len(DATA): raise SystemExit(f"Row count mismatch {rows} != {len(DATA)}")
          log(f"Validation OK: {rows} rows")
          open(os.path.join(outdir,".last_run_log.txt"),"w").write("\n".join(LOGS))
          PYCODE
      - name: Commit Excel to repository
        run: |
          set -e
          TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/local_excel_test.xlsx Test_Output/GPIO/TestPlan/.last_run_log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generated Excel from JSON (4 rows) - ${TS}"
            git push
          fi
