name: JSON to Excel (GPIO)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "data/input_gpio.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        env:
          IP_NAME: GPIO
        run: |
          python scripts/generate_excel.py
      - name: Commit Excel artifact only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_PATH=$(cat scripts/output_path.txt)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "$FILE_PATH"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push
      - name: Capture commit SHA
        id: cap
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    outputs:
      commit_sha: ${{ steps.cap.outputs.commit_sha }}
