name: JSON to Excel
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/json_to_excel.yml'
      - 'scripts/json_to_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.*
      - name: Run converter
        run: |
          python scripts/json_to_excel.py
      - name: Commit Excel output
        run: |
          if git status --porcelain | grep -q 'TestRepo/gpio/json_testing.xlsx'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add TestRepo/gpio/json_testing.xlsx
            git commit -m "Add generated Excel file from JSON input [skip ci]"
            git push
          else
            echo "No changes to commit."
