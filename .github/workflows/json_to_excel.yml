name: JSON to Excel (GPIO Test Plan)
on:
  push:
    paths:
      - 'Test_Output/GPIO/TestPlan/*.json'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Convert JSON to Excel
        env:
          TZ: 'Asia/Kolkata'
        run: |
          set -e
          python tools/json_to_excel.py Test_Output/GPIO/TestPlan
      - name: Commit Excel
        env:
          TZ: 'Asia/Kolkata'
        run: |
          set -e
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          changed=$(git status --porcelain | grep '\.xlsx$' || true)
          if [ -n "$changed" ]; then
            ts=$(date +'%Y-%m-%d %H:%M:%S %Z')
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "[TestPlan][GPIO] Add autogenerated Test Plan Excel ($ts)"
            git push
          else
            echo "No Excel changes to commit."
          fi
