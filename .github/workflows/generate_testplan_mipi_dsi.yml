name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/excel_generator.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate TestPlan Excel
        env:
          OUTPUT_DIR: Test_Output/MIPI/TestPlan
          TZ: Asia/Kolkata
        run: |
          mkdir -p $OUTPUT_DIR
          python Test_Output/MIPI/TestPlan/excel_generator.py

      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push

      - name: Cleanup generator script
        run: |
          git rm Test_Output/MIPI/TestPlan/excel_generator.py
          git rm .github/workflows/generate_testplan_mipi_dsi.yml
          git commit -m "Cleanup: removed generator script and workflow after Excel generation"
          git push
