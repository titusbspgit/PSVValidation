name: Agent7 MIPI CSI TestPlan XLSX Generator

on:
  push:
    paths:
      - '.github/workflows/run_agent7_mipi_csi.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Generate MIPI CSI TestPlan XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_mipi_csi_testplan_agent7_final.py
          XLSX=$(ls -t MIPI_CSI_TestPlan_*.xlsx 2>/dev/null | head -1)
          echo "Generated: $XLSX ($(stat -c%s "$XLSX") bytes)"
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "Test_Output/MIPI/TestPlan/$XLSX"
          git commit -m "Added generated TestPlan Excel - $XLSX"
          git push
