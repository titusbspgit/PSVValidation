name: Generate USB TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/agent7_generate_xlsx.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install openpyxl
      
      - name: Generate Excel workbook
        working-directory: Test_Output/USB/TestPlan
        run: python agent7_generate_xlsx.py
      
      - name: Move generated file
        working-directory: Test_Output/USB/TestPlan
        run: |
          XLSX_FILE=$(ls -t USB_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Generated file: $XLSX_FILE"
          echo "File size: $(stat -c%s $XLSX_FILE) bytes"
          echo "XLSX_FILENAME=$XLSX_FILE" >> $GITHUB_ENV
      
      - name: Commit and push Excel workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/USB/TestPlan/${{ env.XLSX_FILENAME }}"
          git commit -m "Added generated USB TestPlan Excel workbook - ${{ env.XLSX_FILENAME }}"
          git push
