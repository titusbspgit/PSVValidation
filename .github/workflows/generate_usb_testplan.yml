name: Generate USB TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_testplan_final.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/USB/TestPlan/generate_testplan_final.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/USB/TestPlan/
          XLSX_FILE=$(ls -t USB_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -n "$XLSX_FILE" ]; then
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "Test_Output/USB/TestPlan/$XLSX_FILE"
            git commit -m "Added generated TestPlan Excel - $XLSX_FILE"
            git push
            echo "Successfully pushed: $XLSX_FILE"
          else
            echo "ERROR: No XLSX file found"
            exit 1
          fi
