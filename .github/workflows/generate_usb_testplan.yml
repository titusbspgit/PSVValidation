name: Generate USB TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_testplan_excel.py'
      - '.github/workflows/generate_usb_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel
        run: |
          python tools/generate_testplan_excel.py
      - name: Commit generated Excel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Find latest generated file and extract IST timestamp from its filename
          FILE=$(ls -t Test_Output/USB/TestPlan/USB_TestPlan_*.xlsx | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "No Excel file generated. Failing the job."
            exit 1
          fi
          TS=$(basename "$FILE" | sed -E 's/USB_TestPlan_([0-9]{8}_[0-9]{6})\.xlsx/\1/')
          git add "$FILE"
          git commit -m "Added generated TestPlan Excel for USB (IST ${TS})"
          git push
