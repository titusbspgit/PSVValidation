name: Generate USB TestPlan Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_usb_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: |
          cd Test_Output/USB/TestPlan
          python generate_usb_testplan.py

      - name: Commit and push generated Excel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Output/USB/TestPlan/*.xlsx
          git commit -m 'Added generated USB TestPlan Excel workbook' || echo 'No changes to commit'
          git push
