name: Generate USB TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan_xlsx.py'
      - 'scripts/data/usb_testplan.json'
      - '.github/workflows/generate_usb_testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: |
          python scripts/generate_testplan_xlsx.py \
            --input scripts/data/usb_testplan.json \
            --ip-name "USB" \
            --source-repo "titusbspgit/PSVValidation" \
            --source-path "TestRepo/usb" \
            --output-dir "Test_Output/USB/TestPlan" \
            --branch "main"
      - name: Commit Excel
        run: |
          set -e
          FILEPATH=$(cat generated_excel_path.txt)
          echo "Generated: $FILEPATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILEPATH"
          git commit -m "Added generated TestPlan Excel: $FILEPATH" || echo "No changes to commit"
          git push
