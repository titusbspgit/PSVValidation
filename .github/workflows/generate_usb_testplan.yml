name: Generate USB TestPlan Excel

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'data/testplans/USB_testplan_data.json'
      - 'scripts/generate_testplan_excel.py'
      - '.github/workflows/generate_usb_testplan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      : uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Excel
        id: generate
        run: |
          python scripts/generate_testplan_excel.py \
            --json data/testplans/USB_testplan_data.json \
            --ip-name USB \
            --output-dir "Test_Output/USB/TestPlan/"

      - name: Commit Excel artifact
        run: |
          set -e
          FILE_PATH="${{ steps.generate.outputs.artifact_path }}"
          TS="${{ steps.generate.outputs.timestamp }}"
          echo "Artifact: $FILE_PATH | TS: $TS"
          if [ -n "$FILE_PATH" ] && [ -f "$FILE_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE_PATH"
            if ! git diff --cached --quiet; then
              git commit -m "Add USB_TestPlan_${TS} (IST)"
              git push
            else
              echo "No changes to commit."
            fi
          else
            echo "Expected Excel not found at $FILE_PATH" >&2
            exit 1
          fi
