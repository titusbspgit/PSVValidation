name: Generate USB TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/USB/TestPlan/generate_testplan.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python Test_Output/USB/TestPlan/generate_testplan.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/USB/TestPlan/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m 'Auto-generated USB TestPlan Excel' || echo 'No changes to commit'
          git push
