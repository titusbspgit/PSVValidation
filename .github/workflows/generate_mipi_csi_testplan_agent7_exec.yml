name: Generate MIPI_CSI TestPlan XLSX (Agent7)
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_agent7_exec.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/MIPI/TestPlan/MIPI_CSI_TestPlan_*.xlsx'
          git commit -m 'Auto-generated MIPI_CSI TestPlan XLSX via Agent 7' || true
          git push
