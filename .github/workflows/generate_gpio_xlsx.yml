name: Generate GPIO XLSX\n\non:\n  push:\n    paths:\n      - 'data/gpio_testcases.json'\n  workflow_dispatch: {}\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.x'\n      - name: Install dependencies\n        run: pip install --upgrade pip openpyxl\n      - name: Generate Excel\n        run: python scripts/json_to_xlsx.py\n      - name: Commit Excel\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx\n          if git diff --cached --quiet; then\n            echo "No changes to commit"\n          else\n            git commit -m "Generate GPIO_TestPlan_1.xlsx from data/gpio_testcases.json [skip ci]"\n            git push\n          fi\n