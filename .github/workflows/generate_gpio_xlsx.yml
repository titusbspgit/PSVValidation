name: Generate GPIO XLSX

on:
  push:
    branches:
      - main
    paths:
      - 'data/gpio_testcases.json'
      - 'scripts/json_to_xlsx.py'
      - '.github/workflows/generate_gpio_xlsx.yml'
      - 'Test_Output/GPIO/TestPlan/readme'
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install --upgrade pip openpyxl
      - name: Generate Excel
        run: python scripts/json_to_xlsx.py
      - name: Commit Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate GPIO_TestPlan_1.xlsx from data/gpio_testcases.json [skip ci]"
            git push
          fi
