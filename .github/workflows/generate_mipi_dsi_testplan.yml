name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_excel.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        id: generate
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_excel.py | tee output.log
          FILENAME=$(grep 'GENERATED_FILE=' output.log | cut -d= -f2)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Generated: $FILENAME"

      - name: Commit and push Excel file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          FILENAME=${{ steps.generate.outputs.filename }}
          git add "Test_Output/MIPI/TestPlan/$FILENAME"
          git rm -f Test_Output/MIPI/TestPlan/generate_excel.py || true
          git commit -m "Added generated TestPlan Excel: $FILENAME"
          git push
