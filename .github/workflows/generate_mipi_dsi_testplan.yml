name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_dsi_excel.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/MIPI/TestPlan/generate_mipi_dsi_excel.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Auto-generated MIPI_DSI TestPlan Excel workbook" || echo "No changes to commit"
          git push
