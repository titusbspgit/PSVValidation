name: Generate MIPI DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_dsi_testplan_20261013_190000.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/MIPI/TestPlan/generate_mipi_dsi_testplan_20261013_190000.py

      - name: List generated files
        run: ls -la Test_Output/MIPI/TestPlan/*.xlsx

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/*.xlsx
          git commit -m "Added generated TestPlan Excel - MIPI_DSI auto-generated"
          git push
