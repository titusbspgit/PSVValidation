name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - '.github/workflows/generate_mipi_dsi_testplan.yml'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel TestPlan
        run: python Test_Output/MIPI/TestPlan/generate_MIPI_DSI_TestPlan.py

      - name: Find and commit generated Excel
        run: |
          XLSX_FILE=$(find Test_Output/MIPI/TestPlan -name 'MIPI_DSI_TestPlan_*.xlsx' -newer Test_Output/MIPI/TestPlan/generate_MIPI_DSI_TestPlan.py -type f | head -1)
          if [ -n "$XLSX_FILE" ]; then
            echo "Found generated file: $XLSX_FILE"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$XLSX_FILE"
            git commit -m "Added generated TestPlan Excel - MIPI_DSI"
            git push
            echo "SUCCESS: $XLSX_FILE committed and pushed"
          else
            echo "ERROR: No generated XLSX file found"
            exit 1
          fi
