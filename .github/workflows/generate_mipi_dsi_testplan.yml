name: Generate MIPI_DSI TestPlan Excel

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - run: python Test_Output/MIPI/TestPlan/generate_MIPI_DSI_TestPlan_20261113_143000.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
