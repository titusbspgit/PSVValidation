name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/gen_xlsx.py'
  workflow_dispatch:

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        id: generate
        run: |
          cd Test_Output/MIPI/TestPlan
          python gen_xlsx.py | tee output.log
          FILENAME=$(grep 'FILENAME=' output.log | head -1 | cut -d= -f2)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          # Extract base64 and decode to binary XLSX
          sed -n '/^BASE64_START$/,/^BASE64_END$/p' output.log | grep -v '^BASE64_' > b64.txt
          base64 -d b64.txt > "$FILENAME"
          FILE_SIZE=$(stat -c%s "$FILENAME")
          echo "Generated: $FILENAME ($FILE_SIZE bytes)"
          # Validate the XLSX
          python -c "from openpyxl import load_workbook; wb=load_workbook('$FILENAME'); assert 'TestPlan' in wb.sheetnames; assert 'MetaData' in wb.sheetnames; print('VALIDATION=PASSED')"

      - name: Commit and push Excel file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          FILENAME=${{ steps.generate.outputs.filename }}
          git add "Test_Output/MIPI/TestPlan/$FILENAME"
          git commit -m "Added generated TestPlan Excel: $FILENAME"
          git push
