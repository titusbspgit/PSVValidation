name: Generate MIPI_DSI TestPlan Excel

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_dsi_testplan.py'

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel workbook
        run: python Test_Output/MIPI/TestPlan/generate_mipi_dsi_testplan.py

      - name: Commit and push generated Excel
        run: |
          cd Test_Output/MIPI/TestPlan
          XLSX_FILE=$(ls -t MIPI_DSI_TestPlan_*.xlsx 2>/dev/null | head -1)
          if [ -z "$XLSX_FILE" ]; then
            echo "ERROR: No XLSX file generated"
            exit 1
          fi
          echo "Generated file: $XLSX_FILE"
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/MIPI/TestPlan/$XLSX_FILE"
          git commit -m "Added generated TestPlan Excel: $XLSX_FILE"
          git push

      - name: Cleanup generator script
        run: |
          git rm Test_Output/MIPI/TestPlan/generate_mipi_dsi_testplan.py
          git rm .github/workflows/generate_mipi_dsi_testplan.yml
          git commit -m "Cleanup: Remove MIPI_DSI TestPlan generator script and workflow"
          git push
