name: Generate GPIO TestPlan Excel (IST)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pytz
      - name: Generate and push Excel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: titusbspgit
          REPO: PSVValidation
          BRANCH: main
          OUTPUT_DIR: Test_Output/GPIO/TestPlan/
          IP_NAME: GPIO
        run: |
          python .github/scripts/generate_gpio_testplan.py