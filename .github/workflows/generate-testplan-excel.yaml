name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate GPIO TestPlan Excel
        run: |
          python .github/scripts/generate_testplan_excel.py --repo-root "." --output-dir "Test_Output/GPIO/TestPlan" --ip "GPIO" --commit-message "Final formatted Excel generated from JSON input (GPIO, IST $(date +'%Y-%m-%d %H:%M:%S' -d 'TZ=Asia/Kolkata'))"
