# bump 3
name: Generate Excel from JSON and commit

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/generate-excel-from-json.yml"
      - "tools/json_to_xlsx.py"
      - "data/test_gpio_negedge_intr_en.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
          python -c "import sys,openpyxl;print(sys.version);print(openpyxl.__version__)"

      - name: Generate Excel from JSON file deterministically
        shell: bash
        run: |
          set -e
          mkdir -p TestRepo/gpio
          export JSON_INPUT="$(cat data/test_gpio_negedge_intr_en.json)"
          export OUTPUT_XLSX_PATH="TestRepo/gpio/test_gpio_negedge_intr_en.xlsx"
          python tools/json_to_xlsx.py
          echo "Post-gen listing:" && ls -la TestRepo/gpio || true

      - name: Commit and push changes (with PR fallback)
        id: push
        shell: bash
        run: |
          set -e
          if [ ! -f "TestRepo/gpio/test_gpio_negedge_intr_en.xlsx" ]; then
            echo "ERROR: Generated file missing after script run" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "TestRepo/gpio/test_gpio_negedge_intr_en.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pr_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Add generated Excel file from JSON input"
          # Try direct push to main
          if git push origin HEAD:main; then
            echo "Pushed to main"
            echo "pr_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Direct push to main failed; falling back to PR"
            BR="feature/json-to-xlsx-${GITHUB_RUN_ID}"
            git checkout -b "$BR"
            git push origin "$BR"
            echo "branch=$BR" >> $GITHUB_OUTPUT
            echo "pr_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Open pull request if needed
        if: steps.push.outputs.pr_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.push.outputs.branch }}
          title: "Add generated Excel file from JSON input"
          body: "Auto-generated Excel from embedded JSON input."
          base: main
          commit-message: "Add generated Excel file from JSON input"
          labels: automation
