g for the selected role and lane width.\n3) Program selected fields in DBI_DSP_COHERENCY_CONTROL_3_OFF for both instances.\n4) Poll SII status at offset 0xC0 until link status bits indicate ready; repeat for the second instance if enabled.\n5) Write 0x11111111 to 0xE6004100 and wait.\n6) If instance 0 RC is enabled, program memory base, read initial configuration dwords, write and read BAR registers with test patterns, then enable memory, I/O, and bus master in the command register.\n7) If instance 1 RC is enabled, perform equivalent reads, writes, and enables on that instance.\n8) Poll 0xE6004100 until it reads 0x12345678, then finish.", "Impacted Registers": "DBI_DSP_COHERENCY_CONTROL_3_OFF", "Validation / Acceptance Criteria": "1) Link readiness: The SII status at 0xC0 reaches the ready bit pattern, otherwise the test does not proceed.\n2) Completion: The memory-mapped status at 0xE6004100 eventually equals 0x12345678 to pass; failure to reach this value fails the test.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "pcie_cfg_wr_rd_test", "Hidden_Test_Description": "Performs PCIe link training (based on build macros), configures DBI DSP coherency control fields on both instances, polls SII link state, programs BARs and enables memory/IO/Bus Master, and polls a status MMIO register to completion. Execution flow is fully in program.c.", "Hidden_Remarks": "1) Conditional compilation controls role/instance via DM0_RC, DM1_RC, DM0_EP, DM1_EP. 2) SII0 link status is polled via read_sii0_reg(0xC0) until (data_rd & 0xD1) == 0xD1; for DM1_RC, SII1 is similarly polled with read_sii1_reg(0xC0). 3) 0xE6004100 is used as a status/control MMIO location: initialized to 0x0, later set to 0x11111111, and finally polled until 0x12345678. 4) BAR programming and command register writes occur only when DM0_RC or DM1_RC is defined. 5) Coherency control programming uses DBI DSP coherency control register on both instances.", "Hidden_Test_Steps_Procedure": "Globals: unsigned int data_rd, data_wr, rd_wr_data1; int err2 = 0, err1 = 0.\nFunction test_case(): 1) int i; 2) write_reg(0xE6004100, 0x0). 3) // link_training(2); (commented)\n4) If DM0_RC defined: call link_training_dm0_x4(4). 5) If DM1_RC defined: call link_training_dm1_x4(4). 6) If DM0_EP defined: call link_training_dm0_x4(4). 7) If DM1_EP defined: call link_training_dm1_x4(4).\n8) // CACHE PROGRAMMING (instance 0): rd_wr_data1 = set_data(read_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF), 11, 14, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 3, 6, 0xf); write_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1). 9) rd_wr_data1 = set_data(read_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF), 27, 30, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 19, 22, 0xf); write_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1).\n10) // CACHE PROGRAMMING (instance 1): rd_wr_data1 = set_data(read_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF), 11, 14, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 3, 6, 0xf); write_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1). 11) rd_wr_data1 = set_data(read_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF), 27, 30, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 19, 22, 0xf); write_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1).\n12) wait_on(20). 13) rd_wr_data1 = set_data(read_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF), 11, 14, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 3, 6, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 27, 30, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 19, 22, 0xf); write_reg(mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1). 14) rd_wr_data1 = set_data(read_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF), 11, 14, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 3, 6, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 27, 30, 0xf); rd_wr_data1 = set_data(rd_wr_data1, 19, 22, 0xf); write_reg(mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF, rd_wr_data1).\n15) data_rd = read_sii0_reg(0xC0); if DEBUG_DISPLAY, printf current value. 16) Call non_secure_prot_nic(). 17) While ((data_rd & 0xD1) != 0xD1): data_rd = read_sii0_reg(0xC0); if DEBUG_DISPLAY, print value.\n18) If DM1_RC defined: data_rd = read_sii1_reg(0xC0); While ((data_rd & 0xD1) != 0xD1): if DEBUG_DISPLAY, print; data_rd = read_sii1_reg(0xC0).\n19) write_reg(0xE6004100, 0x11111111). 20) wait_on(15000).\n21) If DM0_RC defined: a) mem_base_program_dm0_x4(); b) wait_on(10); c) if DEBUG_DISPLAY, print reading message; d) For (i = 0; i < 10; i += 1): rd_wr_data1 = read_pcie_slv0_reg(i * 0x4). e) Print \"Entered 1st set of writes\". f) write_pcie_slv0_reg(0x10, 0xFFFFFFFF); write_pcie_slv0_reg(0x14, 0xFFFFFFFF); write_pcie_slv0_reg(0x18, 0xFFFFFFFF); write_pcie_slv0_reg(0x1c, 0xFFFFFFFF); write_pcie_slv0_reg(0x20, 0xFFFFFFFF); write_pcie_slv0_reg(0x24, 0xFFFFFFFF). g) Print completion. h) Print \"Entered 1st set of reads\". i) rd_wr_data = read_pcie_slv0_reg(0x10); printf value; repeat for 0x14, 0x18, 0x1c, 0x20, 0x24; print completion. j) Print \"Entered 2nd set of writes\". k) write_pcie_slv0_reg(0x10, 0x0); write_pcie_slv0_reg(0x14, 0x4); write_pcie_slv0_reg(0x18, 0x20000000); write_pcie_slv0_reg(0x1c, 0x40000000); write_pcie_slv0_reg(0x20, 0x60000000); write_pcie_slv0_reg(0x24, 0x80000000); print completion. l) Print \"Entered 2nd set of reads\". m) rd_wr_data = read_pcie_slv0_reg(0x10); printf value; repeat for 0x14, 0x18, 0x1c, 0x20, 0x24; print completion. n) if DEBUG_DISPLAY, print enabling message. o) write_pcie_slv0_reg(0x4, 0x7).\n22) If DM1_RC defined: a) mem_base_program_dm1_x4(); b) if DEBUG_DISPLAY, print reading message; c) For (i = 0; i < 10; i += 1): rd_wr_data1 = read_pcie_slv1_reg(i * 0x4). d) if DEBUG_DISPLAY, print enabling message. e) write_pcie_slv1_reg(0x4, 0x7). f) Write 0xFFFFFFFF to BAR offsets 0x10..0x24 via write_pcie_slv1_reg. g) Read back BAR offsets via read_pcie_slv1_reg. h) Write second pattern set to BAR offsets: 0x10=0x0, 0x14=0x4, 0x18=0x20000000, 0x1c=0x40000000, 0x20=0x60000000, 0x24=0x80000000. i) Read back those offsets.\n23) wait_on(10). 24) data_rd = read_reg(0xE6004100). 25) While (data_rd != 0x12345678): wait_on(5); if DEBUG_DISPLAY, printf current data_rd; data_rd = read_reg(0xE6004100). 26) if DEBUG_DISPLAY, print \"Out of While loop\". 27) finish(0).", "Hidden_Impacted_Registers": "mizar_PCIE0_DBI_DSP_COHERENCY_CONTROL_3_OFF, mizar_PCIE1_DBI_DSP_COHERENCY_CONTROL_3_OFF", "Hidden_Validation_Acceptance_Criteria": "1) Link status polling: Progress only when (read_sii0_reg(0xC0) & 0xD1) == 0xD1; for DM1_RC, also require (read_sii1_reg(0xC0) & 0xD1) == 0xD1. 2) Completion condition: The loop terminates when read_reg(0xE6004100) returns 0x12345678; otherwise the loop continues. 3) Final finish(0) is executed after the completion condition is met." } }
JSON_EOF

      - name: Generate XLSX
        run: |
          python .github/scripts/pcie_json_to_xlsx.py \
            --input .github/workflows/tmp/input.json \
            --output-dir 'Test_Output/PCIE/TestPlan' \
            --ip-name 'PCIE' | tee .github/workflows/tmp/pcie_json_to_xlsx.log

      - name: Capture generated path
        id: gen
        shell: bash
        run: |
          GEN_PATH=$(grep -Eo 'Test_Output/PCIE/TestPlan/PCIE_TestPlan_[0-9]{8}_[0-9]{6}\.xlsx' -m1 .github/workflows/tmp/pcie_json_to_xlsx.log || true)
          if [ -z "$GEN_PATH" ]; then
            echo "Failed to capture generated path" >&2
            exit 1
          fi
          echo "generated_file=$GEN_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit XLSX
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add "${{ steps.gen.outputs.generated_file }}"
          git commit -m "Final formatted Excel generated from JSON input" || echo "Nothing to commit"
          git push origin HEAD:main
