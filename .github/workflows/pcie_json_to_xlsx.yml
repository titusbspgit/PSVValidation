name: Generate PCIE TestPlan XLSX

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/pcie_json_to_xlsx.yml
      - .github/scripts/pcie_json_to_xlsx.py

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Prepare JSON input
        run: |
          mkdir -p .github/workflows/tmp
          cat > .github/workflows/tmp/input.json << 'JSON_EOF'
{ "TC1": { "Index": "1", "SS / Module": "PCIE", "Feature": "Register default and masked write-read verification", "Test Case Name": "pcie1_dbi_usp_reg_wr_rd_test", "Test Description": "Checks reset defaults and verifies masked write/read behavior for a list of device registers.", "Speed": "NA", "Mode": "NA", "Memory Start Offset": "NA", "Memory End Offset": "NA", "Remarks": "Unreadable entries are skipped. Unwritable entries are not written or verified. Entries in the skip list are fully skipped. Default checks are not performed for three specific registers. A soft reset routine exists but is not executed.", "Test Steps / Procedure": "1) Read each listed register that is readable and compare with its documented default, excluding three specified registers.\n2) For each of six data patterns, write to each writable and not-skipped register.\n3) Read back each such register and compare with the expected result formed by combining the written bits with preserved default bits under the read and write masks.\n4) Record any mismatches and determine the final result based on accumulated failures.", "Impacted Registers": "PCIE_CAP_ID_PCIE_NEXT_CAP_PTR_PCIE_CAP_REG, DBI_USP_DEVICE_CONTROL_DEVICE_STATUS, DBI_USP_PL_DEBUG1_OFF", "Validation / Acceptance Criteria": "1) Each readable register, except the excluded ones, matches its default value to pass; any mismatch fails this check.\n2) For each writable and readable register, the read-back equals the masked combination of written data and preserved defaults to pass; any mismatch fails this check.\n3) The test passes only if no default or write/read mismatches occur.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "pcie1_dbi_usp_reg_wr_rd_test", "Hidden_Test_Description": "Verifies default values and masked write-read behavior for PCIe1 DBI USP registers over 775 entries. Arrays (defined in test_define.c): addr_array[775], default_value_array[775], read_mask_array[775], write_mask_array[775], skip_array[775]. Execution: test_case() -> chk_rst_val() -> chk_rd_wr() -> finish().", "Hidden_Remarks": "1) If read_mask_array[i] == 0x00000000, reading is skipped for that entry. 2) If write_mask_array[i] == 0x00000000, both writing and readback verification are skipped. 3) If skip_array[i] == 1, the entry is skipped entirely. 4) Default value checks are skipped when addr_array[i] equals mizar_PCIE1_DBI_USP_CAP_ID_NXT_PTR_REG, mizar_PCIE1_DBI_USP_DEVICE_CONTROL_DEVICE_STATUS, or mizar_PCIE1_DBI_USP_PL_DEBUG1_OFF. 5) soft_reset_chk() exists but is not invoked.", "Hidden_Test_Steps_Procedure": "Globals: int data_rd, data_wr; int def_fail_cnt = 0, wr_fail_cnt = 0; #define SOFT_RST_REG_ADDRESS 0x00000000; #define SOFT_RST_REG_DATA 0x00000000.\nFunction test_case(): 1) Call chk_rst_val(). 2) If DEBUG_DISPLAY, print \"********* Default value check end ***\". 3) Call chk_rd_wr(). 4) If DEBUG_DISPLAY, print \" Write & Read from registers end ***\". 5) // soft_reset_chk() is commented out. 6) If (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0).\nFunction chk_rst_val(): For i = 0..CNT-1 (CNT = 775): a) addr = addr_array[i]. b) If (read_mask_array[i] == 0x00000000) { if DEBUG_DISPLAY, printf(\"RST : This address 0x%x is not readable, hence skipped for reading \\\n\", addr); continue; } c) If (addr_array[i] == mizar_PCIE1_DBI_USP_CAP_ID_NXT_PTR_REG) || (addr_array[i] == mizar_PCIE1_DBI_USP_DEVICE_CONTROL_DEVICE_STATUS) || (addr_array[i] == mizar_PCIE1_DBI_USP_PL_DEBUG1_OFF) { continue; } d) data_rd = read_reg(addr). e) If (data_rd == default_value_array[i]) { if DEBUG_DISPLAY, printf(\"RST : PASS Reading Default value from Address :0x%x Expected : 0x%x\\tRead_data : 0x%x\\n\", addr, default_value_array[i], data_rd); } else { def_fail_cnt++; printf(\"RST : Failed Default value mismatch Addr :0x%x Expected : 0x%x\\tRead_data : 0x%x\\n\", addr, default_value_array[i], data_rd); }\nFunction chk_rd_wr(): 1) Define int chk_val[6] = {0xffffffff, 0xaaaaaaaa, 0x55555555, 0x00000000, 0xA5A5A5A5, 0xffff0000}. 2) For j = 0..5: a) data_wr = chk_val[j]. b) Write loop for i = 0..CNT-1: i. addr = addr_array[i]. ii. If (skip_array[i] == 1) { if DEBUG_DISPLAY, printf(\"Read_write : Writing into this Address : 0x%x is skipped because address present in skip_array \\\n\", addr); continue; } iii. If (write_mask_array[i] == 0x00000000) { if DEBUG_DISPLAY, printf(\"Read_write : This address 0x%x is not writable, hence skipped for writing \\\n\", addr); continue; } iv. Else { write_reg(addr, data_wr); if DEBUG_DISPLAY, printf(\"Read_write : Writing into register Address : 0x%x\\tdata :0x%x\\n\", addr, data_wr); } c) Read/verify loop for i = 0..CNT-1: i. addr = addr_array[i]. ii. If (skip_array[i] == 1) { if DEBUG_DISPLAY, printf(\"Read_write : Reading from this Address : 0x%x is skipped because address present in skip_array \\\n\", addr); continue; } iii. If (write_mask_array[i] == 0x00000000) { if DEBUG_DISPLAY, printf(\"Read_write : This address 0x%x is not Writable , hence skipped for reading \\\n\", addr); continue; } iv. If (read_mask_array[i] == 0x00000000) { if DEBUG_DISPLAY, printf(\"Read_write : This address 0x%x is not Readable , hence skipped for reading \\\n\", addr); continue; } v. Else { data_rd = read_reg(addr); wr_n = (write_mask_array[i] ^ 0xffffffff); exp_val = ((data_wr & read_mask_array[i] & write_mask_array[i]) | (wr_n & read_mask_array[i] & default_value_array[i])); if (data_rd == exp_val) { if DEBUG_DISPLAY, printf(\"Read_write : PASS : For Address %x, Expected value=0x%x\\tRead value=0x%x\\n\", addr, exp_val, data_rd); } else { wr_fail_cnt++; printf(\"Read_write : Failed : Write Read mismatch For Address %x, Expected value=0x%x\\tRead value=0x%x\\n\", addr, exp_val, data_rd); } }\nFunction soft_reset_chk() [not called]: default_value = read_reg(SOFT_RST_REG_ADDRESS); write_reg(SOFT_RST_REG_ADDRESS, SOFT_RST_REG_DATA); wait_on(1000); write_reg(SOFT_RST_REG_ADDRESS, default_value); wait_on(1000).", "Hidden_Impacted_Registers": "mizar_PCIE1_DBI_USP_CAP_ID_NXT_PTR_REG, mizar_PCIE1_DBI_USP_DEVICE_CONTROL_DEVICE_STATUS, mizar_PCIE1_DBI_USP_PL_DEBUG1_OFF", "Hidden_Validation_Acceptance_Criteria": "1) Default value check: For each i with read_mask_array[i] != 0 and addr_array[i] not equal to {mizar_PCIE1_DBI_USP_CAP_ID_NXT_PTR_REG, mizar_PCIE1_DBI_USP_DEVICE_CONTROL_DEVICE_STATUS, mizar_PCIE1_DBI_USP_PL_DEBUG1_OFF}, verify read_reg(addr_array[i]) == default_value_array[i]; otherwise increment def_fail_cnt. 2) Write-read check: For each pattern in chk_val[] and each i with skip_array[i] != 1, write_mask_array[i] != 0, and read_mask_array[i] != 0, verify read_reg(addr_array[i]) == ((data_wr & read_mask_array[i] & write_mask_array[i]) | ((write_mask_array[i] ^ 0xffffffff) & read_mask_array[i] & default_value_array[i])); otherwise increment wr_fail_cnt. 3) Final result by finish(): pass if (def_fail_cnt == 0 && wr_fail_cnt == 0); fail otherwise." }, "TC2": { "Index": "2", "SS / Module": "PCIE", "Feature": "Register default and masked write-read verification", "Test Case Name": "pcie1_sii_rc_reg_wr_rd_test", "Test Description": "Checks reset defaults and verifies masked write/read behavior for SII RC registers.", "Speed": "NA", "Mode": "NA", "Memory Start Offset": "0xE68C1000", "Memory End Offset": "NA", "Remarks": "Unreadable entries are skipped. Unwritable entries are not written or verified. Entries in the skip list are fully skipped. Default checks are not performed for the PHY reset control register. A soft reset routine exists but is not executed.", "Test Steps / Procedure": "1) Read each listed register that is readable and compare with its documented default, excluding the PHY reset control register.\n2) For each of six data patterns, write to each writable and not-skipped register.\n3) Read back each such register and compare with the expected result formed by combining the written bits with preserved default bits under the read and write masks.\n4) Record any mismatches and determine the final result based on accumulated failures.", "Impacted Registers": "SII_PHY_RST_CONTROL", "Validation / Acceptance Criteria": "1) Each readable register, except the excluded one, matches its default value to pass; any mismatch fails this check.\n2) For each writable and readable register, the read-back equals the masked combination of written data and preserved defaults to pass; any mismatch fails this check.\n3) The test passes only if no default or write/read mismatches occur.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "pcie1_sii_rc_reg_wr_rd_test", "Hidden_Test_Description": "Verifies default values and masked write-read behavior for PCIe1 SII RC registers over 153 entries. Arrays (defined in test_define.c): addr_array[153], default_value_array[153], read_mask_array[153], write_mask_array[153], skip_array[153]. Execution: test_case() -> chk_rst_val() -> chk_rd_wr() -> finish().", "Hidden_Remarks": "1) If read_mask_array[i] == 0x00000000, reading is skipped. 2) If write_mask_array[i] == 0x00000000, both writing and readback verification are skipped. 3) If skip_array[i] == 1, the entry is skipped entirely. 4) Default value checks are skipped when addr_array[i] equals mizar_PCIE1_SII_PHY_RST_CONTROL. 5) soft_reset_chk() exists but is not invoked.", "Hidden_Test_Steps_Procedure": "Globals: int data_rd, data_wr; int def_fail_cnt = 0, wr_fail_cnt = 0; #define SOFT_RST_REG_ADDRESS 0x00000000; #define SOFT_RST_REG_DATA 0x00000000.\nFunction test_case(): 1) Call chk_rst_val(). 2) If DEBUG_DISPLAY, print \" Default value check end ***\". 3) Call chk_rd_wr(). 4) If DEBUG_DISPLAY, print \" Write & Read from registers end ************\". 5) // soft_reset_chk() is commented out. 6) If (def_fail_cnt > 0 || wr_fail_cnt > 0) finish(1); else finish(0).\nFunction chk_rst_val(): For i = 0..CNT-1 (CNT = 153): a) addr = addr_array[i]. b) If (read_mask_array[i] == 0x00000000) { if DEBUG_DISPLAY, printf(\"RST : This address 0x%x is not readable, hence skipped for reading \\\n