name: Generate Excel from JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'data/source.json'
      - 'tools/json_to_xlsx.py'
      - '.github/workflows/generate-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.2

      - name: Generate Excel
        env:
          JSON_SOURCE: data/source.json
          XLSX_TARGET: TestRepo/gpio/GPIO_TestCase.xlsx
        run: |
          python tools/json_to_xlsx.py

      - name: Commit Excel artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- TestRepo/gpio/GPIO_TestCase.xlsx)" ]; then
            git add TestRepo/gpio/GPIO_TestCase.xlsx
            git commit -m "Add generated Excel file from JSON input"
            git push
          else
            echo "No changes to commit"
          fi
