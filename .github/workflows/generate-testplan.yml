name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytz

      - name: Write input JSON to workspace (not committed)
        shell: bash
        run: |
          mkdir -p ./_work
          cat > ./_work/input.json << 'JSON'
          [ { "Index": 1, "SS / Module": "GPIO", "Feature": "GPIO negative edge interrupt", "Test Case Name": "test_gpio_nedge_random_pads_en", "Test Description": "Validates negative edge interrupt behavior on randomly selected GPIO pads and verifies group and system interrupt clearing.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "NA", "Memory End Offset": "NA", "Remarks": "Requires one GPIO instance define. Uses random pad selection within a fixed range. Relies on an external flag for synchronization. Uses a shared memory location to drive edges.", "Test Steps / Procedure": "1) Enable the interrupt controller for the selected instance\n2) Enable the system interrupt for the selected instance\n3) Configure a pad for input with negative edge interrupt\n4) Enable the group interrupt bit for the pad\n5) Drive a transition on the external stimulus source\n6) Wait for the interrupt to be serviced\n7) Read the pad register to check input and raw status\n8) Read the group status to confirm the bit is set\n9) Disable the group interrupt and clear the pad interrupt\n10) Read the pad register to confirm the interrupt is cleared\n11) Read the group status to confirm it is cleared\n12) Clear the system raw status for the selected instance", "Impacted Registers": "NA", "Validation / Acceptance Criteria": "1) Pad input reflects expected level during the edge → Status is set\n2) Raw interrupt status for the pad is set → Interrupt occurred\n3) Group status bit for the pad is set → Group interrupt occurred\n4) After clearing the pad, the pad status shows cleared value → Interrupt cleared\n5) After clearing, the group status reads zero → Group interrupt cleared\n6) After clearing, the system raw status reads zero → System status cleared", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_nedge_random_pads_en", "Hidden_Test_Description": "Enable input mode and negative-edge interrupt on randomly selected GPIO pads (8–39), trigger transitions through writes to 0xA0243ffc, validate pad input state and raw/group interrupt status on interrupt, then clear pad, group, and system interrupt statuses.", "Hidden_Remarks": "Requires GPIO0 or GPIO1 to be defined to select IRQ 87 or 88.\nUses address 0xA0243ffc to drive pad transitions.\nPads under test are 8 through 39 of group 0; selection is random and unique.\nUses int_pend as a flag to wait for the interrupt.", "Hidden_Test_Steps_Procedure": "#ifdef GPIO0: GIC_EnableIRQ(87); #ifdef GPIO1: GIC_EnableIRQ(88);\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); #ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR);\nsrand(time(NULL)); write_reg(0xA0243ffc, 0xffffffff);\nFor i = 0..31: pick unique pad_num in [0..31]; wr_val = 1 << pad_num; write_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4), 0x00140000); wait_on(50); write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 1 << pad_num); wait_on(10); write_reg(0xA0243ffc, ~(wr_val)); wait_on(10); write_reg(0xA0243ffc, 0xffffffff); int_pend = 1; while (int_pend == 0x1) { printf("Waiting for interrupt"); wait_on(10); }\nDefault_IRQHandler: wr_val = 1 << pad_num; int_pend = 0; rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4)); if ((rdata & 0x1) != 0) { /* DIN OK / } else { printf("ERROR: DIN mismatch"); test_err++; }\nIf ((rdata & 0x2) != 0x0) { rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & (1 << pad_num)) != 0) { / group intr OK / } else { printf("ERROR: Group Interrupt not occured"); test_err++; }\nwrite_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000); write_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4), 0x00110001); wait_on(2); rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4)); if (rdata == 0x100001) { / pad intr cleared / } else { printf("ERROR: Interrupt clear failed : %x", rdata); test_err++; }\nrdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp == 0x0) { / group intr cleared / } else { printf("ERROR: Group Interrupt clear failed: %x", rdata_grp); test_err++; }\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n#ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n} else { printf("Interrupt Not occured"); test_err++; }\n#ifdef GPIO0: GIC_ClearIRQ(87); #ifdef GPIO1: GIC_ClearIRQ(88);\nfinish(test_err);", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Hidden_Validation_Acceptance_Criteria": "In Default_IRQHandler: (rdata & 0x1) != 0 indicates DIN value matches expected during negedge; else test_err++.\n(rdata & 0x2) != 0x0 indicates raw interrupt raised; else print \"Interrupt Not occured\" and test_err++.\n(rdata_grp & (1 << pad_num)) != 0 indicates group interrupt raised; else test_err++.\nAfter clearing: read pad reg equals 0x100001 indicates interrupt cleared; else test_err++.\nAfter clearing: group status equals 0x0 indicates group interrupt cleared; else test_err++.\nAfter clearing system raw: reading MIZAR_LSS_SYSREG_RAW_STCR1 with respective mask yields zero for that bit; else test_err++." }, { "Index": 2, "SS / Module": "GPIO", "Feature": "GPIO negative edge interrupt", "Test Case Name": "test_gpio_nedge_walking_zeros_pattern", "Test Description": "Tests negative-edge interrupt behavior across GPIO pads 8–39 using a walking-zeros stimulus and validates pad, group, and system interrupt handling.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "Uses either GPIO0 or GPIO1 instance interrupts. External source drives transitions via a fixed address. Pads 8–39 are configured for input and negative-edge triggering. Waits on a shared flag set in the handler.", "Test Steps / Procedure": "1) Enable the instance interrupt in INTREN1lss.\n2) Configure negative-edge triggering on per-pad registers starting from GPIO_8.\n3) Set input mode using GPIO_IO_CTRL_GROUP1, GPIO_IO_CTRL_GROUP2, GPIO_IO_CTRL_GROUP3, and GPIO_IO_CTRL_GROUP4.\n4) Enable group interrupt bits in INTR1_INTR_EN1.\n5) For each pad 8–39, drive a falling-edge stimulus and wait for the interrupt to occur.\n6) In the handler, read the per-pad register (starting at GPIO_8) and verify input and raw status bits.\n7) Read INTR1_INTR_STS1 to confirm the group status bit is set, then clear the per-pad interrupt and verify it is cleared.\n8) Confirm INTR1_INTR_STS1 is cleared and then clear RAWSTCR1lss for the instance.", "Impacted Registers": "INTREN1lss, GPIO_8, INTR1_INTR_EN1, INTR1_INTR_STS1, RAWSTCR1lss, GPIO_IO_CTRL_GROUP1, GPIO_IO_CTRL_GROUP2, GPIO_IO_CTRL_GROUP3, GPIO_IO_CTRL_GROUP4", "Validation / Acceptance Criteria": "1) Per-pad input bit set during a falling edge capture → Input state reflects the expected level.\n2) Per-pad raw status bit set on a falling edge → Interrupt occurred for the pad.\n3) Group status bit set for the active pad in INTR1_INTR_STS1 → Group interrupt occurred.\n4) After writing the clear sequence to the per-pad register → Readback equals the cleared value.\n5) After clearing, INTR1_INTR_STS1 reads zero → Group interrupt cleared.\n6) After clearing RAWSTCR1lss for the instance → The corresponding system raw status bit reads zero.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_nedge_walking_zeros_pattern", "Hidden_Test_Description": "Validates GPIO negative-edge interrupts on pads 8–39 using a walking-zeros pattern generated by writes to 0xA0243ffc. Configures input mode and negative-edge triggering, enables group interrupts, then for each pad generates a falling edge, waits for the interrupt, checks pad input/raw bits, verifies group status, clears pad interrupt, confirms group clear, and clears system raw status.", "Hidden_Remarks": "#ifdef GPIO0 uses IRQ 87; #ifdef GPIO1 uses IRQ 88. External stimulus at address 0xA0243ffc creates walking-zeros pattern. Pads 8–39 are configured via per-pad registers and GPIO_IO_CTRL_GROUP1..4 set to 0x000000FF. Group interrupt enable is set to 0xFFFFFFFF. Synchronization via int_pend flag.", "Hidden_Test_Steps_Procedure": "#ifdef GPIO0: GIC_EnableIRQ(87); #ifdef GPIO1: GIC_EnableIRQ(88);\nSet test_err = 0;\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR);\n#ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR);\nFor i = 0..31: write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00040000); // enable negedge (bit 17 = 1)\nwait_on(10);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP2, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP3, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP4, 0x000000FF);\nwait_on(10);\nwrite_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF);\nFor i = 0..31:\n wr_val = 1 << i;\n write_reg(0xA0243ffc, 0xFFFFFFFF);\n wait_on(30);\n write_reg(0xA0243ffc, ~(wr_val));\n wait_on(30);\n int_pend = 1;\n while (int_pend == 1) { printf("Waiting for interrupt"); wait_on(10); }\nfinish(test_err);\n\nDefault_IRQHandler:\nwr_val = 1 << i;\nint_pend = 0;\nwrite_reg(0xA0243ffc, 0xFFFFFFFF);\nrdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4));\nif ((rdata & 0x1) != 0) { / DIN OK / } else { printf("ERROR: DIN mismatch read_data = %0x", rdata); test_err++; }\nif ((rdata & 0x2) != 0x0) {\n rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1);\n if ((rdata_grp & (1 << i)) != 0) { / group intr OK / } else { printf("ERROR: Group Interrupt not occured"); test_err++; }\n write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00110001);\n wait_on(2);\n rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4));\n if (rdata == 0x100001) { / pad intr cleared / } else { printf("ERROR: Interrupt clear failed : %x", rdata); test_err++; }\n rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1);\n if (rdata_grp == 0x0) { / group intr cleared / } else { printf("ERROR: Group Interrupt clear failed: %x", rdata_grp); test_err++; }\n #ifdef GPIO0\n write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR);\n rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1);\n if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n #endif\n #ifdef GPIO1\n write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR);\n rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1);\n if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR) == 0) { / sysreg cleared */ } else { printf("sysreg status not cleared"); test_err++; }\n #endif\n} else {\n printf("Interrupt Not occured");\n test_err++;\n}\n#ifdef GPIO0: GIC_ClearIRQ(87); #ifdef GPIO1: GIC_ClearIRQ(88);", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR, MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, MIZAR_GPIO_GPIO_IO_CTRL_GROUP2, MIZAR_GPIO_GPIO_IO_CTRL_GROUP3, MIZAR_GPIO_GPIO_IO_CTRL_GROUP4", "Hidden_Validation_Acceptance_Criteria": "1) If (rdata & 0x1) != 0 → DIN value matches during negedge; else increment test_err.\n2) If (rdata & 0x2) != 0x0 → Raw interrupt raised; else print \"Interrupt Not occured\" and increment test_err.\n3) If (rdata_grp & (1 << i)) != 0 → Group interrupt raised; else increment test_err.\n4) After write_reg(..., 0x00110001) and readback → rdata == 0x100001 indicates pad interrupt cleared; else increment test_err.\n5) rdata_grp == 0x0 after clearing → Group interrupt cleared; else increment test_err.\n6) After write to MIZAR_LSS_SYSREG_RAW_STCR1 with respective mask and readback → masked bit reads zero; else increment test_err." }, { "Index": 3, "SS / Module": "GPIO", "Feature": "Interrupts based on negative edge detection at GPIO input", "Test Case Name": "test_gpio_negedge_intr_en", "Test Description": "Enable input mode and negative-edge interrupts on GPIO pads 8–39, trigger falling edges via a memory-mapped stimulus, handle the interrupt, check pad input and raw/group status, then clear pad and system status.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "#ifdef GPIO0 uses GIC IRQ 87 and clears RAW_STCR1 with the GPIO0 bit; #ifdef GPIO1 uses GIC IRQ 88 and clears RAW_STCR1 with the GPIO1 bit. Uses 0xA0243ffc to generate stimulus. Pads 8–39 are configured via the per‑pad register base. int_pend flag synchronizes main loop and ISR.", "Test Steps / Procedure": "Initialization:\n- Set test_err = 0.\n- If GPIO0: call GIC_EnableIRQ(87).\n- If GPIO1: call GIC_EnableIRQ(88).\n- If GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR).\n- If GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).\n- write_reg(0xA0243ffc, 0xffffffff).\n\nMain loop for i = 0..31 (pads 8–39):\n- addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n- write_reg(addr1, 0x00140000). // configure input + negedge\n- wait_on(50).\n- wr_val = (1 << i).\n- write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val). // enable group interrupt bit\n- wait_on(10).\n- write_reg(0xA0243ffc, 0xffffffff).\n- wait_on(30).\n- write_reg(0xA0243ffc, ~(wr_val)). // generate falling edge on selected pad\n- int_pend = 1.\n- while (int_pend) { wait_on(10); }\n\nAfter loop:\n- finish(test_err).\n\nDefault_IRQHandler:\n- int_pend = 0.\n- write_reg(0xA0243ffc, 0xffffffff). // restore stimulus\n- raddr = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n- rdata = read_reg(raddr).\n- If ((rdata & 0x1) == 0x0): test_err++.\n- If ((rdata & 0x2) != 0x0):\n - rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n - If ((rdata_grp & wr_val) == 0): test_err++.\n - raddr2 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n - write_reg(raddr2, 0x00110001). // clear per‑pad interrupt\n - rdata = read_reg(raddr2).\n - If (rdata != 0x100001): test_err++.\n - rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n - If (rdata_grp != 0x0): test_err++.\n - If GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87).\n - If GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88).\n- Else: // raw status not set\n - test_err++.", "Hidden_Impacted_Registers": "INTR_EN1, GP0_INTR1_INTR_EN1, GP0_INTR1_INTR_STS1, RAW_STCR1, gp0_intr2_intr_en1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Validation / Acceptance Criteria": "1) If per‑pad input bit is set when the interrupt fires → Input state is valid; else increment error counter.\n2) If per‑pad raw status bit is set → Interrupt occurred; else increment error counter.\n3) If group status bit corresponding to the active pad is set → Group interrupt occurred; else increment error counter.\n4) After writing the per‑pad clear value, readback equals the cleared value (0x100001) → Per‑pad interrupt cleared; else increment error counter.\n5) After clearing, group status register reads 0x0 → Group interrupt cleared; else increment error counter.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_negedge_intr_en", "Hidden_Test_Description": "Enable input mode and negative-edge interrupts for GPIOs 8–39; for each pad enable its group interrupt bit, drive a falling edge using writes to 0xA0243ffc, wait on int_pend for ISR, read per-pad register to verify DIN and raw status, read group status to confirm the bit is set, clear per-pad interrupt via 0x00110001 and verify readback equals 0x100001, confirm group status is 0x0, and clear system raw status and IRQ for the instance.", "Hidden_Remarks": "#ifdef GPIO0 uses IRQ 87 and RAW_STCR1 GPIO0 mask; #ifdef GPIO1 uses IRQ 88 and RAW_STCR1 GPIO1 mask. Uses 0xA0243ffc as external stimulus. Pads 8–39 accessed via MIZAR_GPIO_GP0_GPIO_8 + (i4). Synchronization via int_pend flag.", "Hidden_Test_Steps_Procedure": "test_err = 0; If GPIO0: GIC_EnableIRQ(87); If GPIO1: GIC_EnableIRQ(88); If GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); If GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR); write_reg(0xA0243ffc, 0xffffffff); For i = 0..31: addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i4); write_reg(addr1, 0x00140000); wait_on(50); wr_val = 1 << i; write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val); wait_on(10); write_reg(0xA0243ffc, 0xffffffff); wait_on(30); write_reg(0xA0243ffc, ~(wr_val)); int_pend = 1; while (int_pend) { wait_on(10); } finish(test_err); Default_IRQHandler: int_pend = 0; write_reg(0xA0243ffc, 0xffffffff); raddr = MIZAR_GPIO_GP0_GPIO_8 + (i4); rdata = read_reg(raddr); if ((rdata & 0x1) == 0x0) { test_err++; } if ((rdata & 0x2) != 0x0) { rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & wr_val) == 0) { test_err++; } raddr2 = MIZAR_GPIO_GP0_GPIO_8 + (i4); write_reg(raddr2, 0x00110001); rdata = read_reg(raddr2); if (rdata != 0x100001) { test_err++; } rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp != 0x0) { test_err++; } ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87); ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88); } else { test_err++; }", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Hidden_Validation_Acceptance_Criteria": "If ((rdata & 0x1) != 0x0) then input state is valid; else test_err++. If ((rdata & 0x2) != 0x0) then raw interrupt occurred; else test_err++. If ((rdata_grp & wr_val) != 0) then group interrupt occurred; else test_err++. After write_reg(per‑pad, 0x00110001) then readback rdata == 0x100001; else test_err++. After clearing, rdata_grp == 0x0; else test_err++." } ]
          JSON

      - name: Generate, format, validate, and save Excel
        shell: bash
        run: |
          python - << 'PY'
          import json, os, re, zipfile
          from datetime import datetime
          from pathlib import Path
          import pytz
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, Alignment, PatternFill, Border, Side
          from openpyxl.utils import get_column_letter
          from openpyxl.worksheet.datavalidation import DataValidation

          # Load and validate JSON
          with open('./_work/input.json','r', encoding='utf-8') as f:
            data = json.load(f)
          if not isinstance(data, list) or len(data) == 0:
            raise SystemExit('Invalid or empty JSON array')
          for idx, rec in enumerate(data):
            if not isinstance(rec, dict):
              raise SystemExit(f'JSON element at index {idx} is not an object')

          # Build schema preserving first-seen key order
          seen = set()
          headers = []
          for rec in data:
            for k in rec.keys():
              if k not in seen:
                seen.add(k)
                headers.append(k)

          # Workbook and Data sheet
          wb = Workbook()
          ws = wb.active
          ws.title = 'Data'

          # Write headers
          for c, h in enumerate(headers, 1):
            ws.cell(row=1, column=c, value=h)

          # Write rows
          for r, rec in enumerate(data, 2):
            for c, h in enumerate(headers, 1):
              v = rec.get(h, '')
              ws.cell(row=r, column=c, value=v if v is not None else '')

          # Base formatting on Data
          header_font = Font(bold=True)
          header_fill = PatternFill(start_color='4472C4', end_color='4472C4', fill_type='solid')
          header_align = Alignment(horizontal='center', vertical='center', wrap_text=True)
          for c in range(1, len(headers)+1):
            cell = ws.cell(row=1, column=c)
            cell.font = header_font
            cell.fill = header_fill
            cell.alignment = header_align
          ws.freeze_panes = 'A2'

          # Column width heuristic (max length among cell lines)
          def text_len(v):
            s = '' if v is None else str(v)
            return max((len(line) for line in s.splitlines() or ['']), default=0)
          for c in range(1, len(headers)+1):
            maxlen = text_len(headers[c-1])
            for r in range(2, ws.max_row+1):
              maxlen = max(maxlen, text_len(ws.cell(row=r, column=c).value))
            width = min(max(maxlen + 2, 8), 80)
            ws.column_dimensions[get_column_letter(c)].width = width

          # Create META sheet and copy META columns
          META_COLS = [
            'Hidden_Test_Case_Name',
            'Hidden_Test_Description',
            'Hidden_Remarks',
            'Hidden_Test_Steps_Procedure',
            'Hidden_Impacted_Registers',
            'Hidden_Validation_Acceptance_Criteria',
          ]
          ws_meta = wb.create_sheet('Meta_data_sheet')
          for c, h in enumerate(META_COLS, 1):
            ws_meta.cell(row=1, column=c, value=h)
          for r, rec in enumerate(data, 2):
            for c, h in enumerate(META_COLS, 1):
              ws_meta.cell(row=r, column=c, value=rec.get(h, '') if rec.get(h, '') is not None else '')
          ws_meta.sheet_state = 'veryHidden'

          # Prepare MAIN columns and rebuild Data sheet in-place
          MAIN_COLS = [
            'Index',
            'SS / Module',
            'Feature',
            'Test Case Name',
            'Test Description',
            'Speed',
            'Mode',
            'Memory Start Offset',
            'Memory End Offset',
            'Remarks',
            'Test Steps / Procedure',
            'Impacted Registers',
            'Validation / Acceptance Criteria',
            'Code Generation (Required / Not)'
          ]

          # Capture rows for MAIN_COLS only
          rows = []
          rows.append(MAIN_COLS[:])
          for rec in data:
            row = []
            for h in MAIN_COLS:
              row.append(rec.get(h, '') if rec.get(h, '') is not None else '')
            rows.append(row)

          # Clear ws and write MAIN content
          ws.delete_rows(1, ws.max_row)
          for r_idx, row in enumerate(rows, 1):
            for c_idx, val in enumerate(row, 1):
              ws.cell(row=r_idx, column=c_idx, value=val)

          # Rename Data to TestPlan
          ws.title = 'TestPlan'

          # Strict formatting for TestPlan
          # Header styling
          for c in range(1, len(MAIN_COLS)+1):
            cell = ws.cell(row=1, column=c)
            cell.font = header_font
            cell.fill = header_fill
            cell.alignment = header_align
          ws.freeze_panes = 'A2'

          # Wrap text for specific columns and set default data alignment
          WRAP_COLS = {
            'Test Description',
            'Remarks',
            'Test Steps / Procedure',
            'Validation / Acceptance Criteria',
          }
          col_index = {name: idx+1 for idx, name in enumerate(MAIN_COLS)}

          # Numbering inside cells for steps and acceptance criteria on TestPlan only
          def normalize_numbering(txt):
            if txt is None:
              return ''
            s = str(txt).replace('\r\n','\n').replace('\r','\n')
            # split by lines, keep non-empty
            lines = [ln for ln in s.split('\n') if ln.strip()]
            if not lines:
              return ''
            out = []
            for i, ln in enumerate(lines, 1):
              t = ln.strip()
              t = re.sub(r'^\s*(?:\d+[\).]\s*|[-*•]\s*)', '', t)
              out.append(f"{i}. {t}")
            return '\n'.join(out)

          max_row = ws.max_row
          max_col = ws.max_column

          # Default alignment for all data cells: top-left
          for r in range(2, max_row+1):
            for c in range(1, max_col+1):
              ws.cell(row=r, column=c).alignment = Alignment(vertical='top', horizontal='left', wrap_text=False)

          # Apply wrapping and numbering for WRAP_COLS
          for r in range(2, max_row+1):
            for name in WRAP_COLS:
              c = col_index[name]
              cell = ws.cell(row=r, column=c)
              if name in {'Test Steps / Procedure', 'Validation / Acceptance Criteria'}:
                cell.value = normalize_numbering(cell.value)
              cell.alignment = Alignment(wrap_text=True, vertical='top', horizontal='left')

          # Align Index as center
          idx_c = col_index['Index']
          for r in range(2, max_row+1):
            ws.cell(row=r, column=idx_c).alignment = Alignment(horizontal='center', vertical='top')

          # Borders for all populated cells
          thin = Side(style='thin', color='000000')
          border = Border(left=thin, right=thin, top=thin, bottom=thin)
          for r in range(1, max_row+1):
            for c in range(1, max_col+1):
              ws.cell(row=r, column=c).border = border

          # Autofit columns based on content (after formatting)
          def text_len_any(v):
            s = '' if v is None else str(v)
            return max((len(line) for line in s.split('\n') or ['']), default=0)
          for c in range(1, max_col+1):
            header = ws.cell(row=1, column=c).value
            maxlen = text_len_any(header)
            for r in range(2, max_row+1):
              v = ws.cell(row=r, column=c).value
              maxlen = max(maxlen, text_len_any(v))
            ws.column_dimensions[get_column_letter(c)].width = min(max(maxlen + 2, 12), 100)

          # Autofit row heights based on wrapped line counts for wrapped columns
          wrapped_cols_idx = [col_index[n] for n in WRAP_COLS]
          for r in range(2, max_row+1):
            max_lines = 1
            for c in wrapped_cols_idx:
              v = ws.cell(row=r, column=c).value
              lines = str(v).split('\n') if v is not None else ['']
              max_lines = max(max_lines, len(lines))
            ws.row_dimensions[r].height = 16 * max_lines + 2

          # Data validation only for Code Generation (Required / Not)
          cg_col = col_index['Code Generation (Required / Not)']
          dv = DataValidation(type='list', formula1='"Required,Blank,Not Required"', allow_blank=True)
          ws.add_data_validation(dv)
          dv.add(f"{get_column_letter(cg_col)}2:{get_column_letter(cg_col)}{max_row}")

          # Safety check: only TestPlan (visible) and Meta_data_sheet (veryHidden)
          names = wb.sheetnames
          if 'Data' in names:
            # Should not happen because we renamed; remove to enforce rule
            del wb['Data']
          names = wb.sheetnames
          if set(names) != {'TestPlan', 'Meta_data_sheet'}:
            raise SystemExit(f'Unexpected sheets present: {names}')
          if wb['Meta_data_sheet'].sheet_state != 'veryHidden':
            raise SystemExit('Meta_data_sheet is not Very Hidden')

          # Save with IST timestamp
          tz = pytz.timezone('Asia/Kolkata')
          now = datetime.now(tz)
          out_dir = Path('Test_Output')/'GPIO'/'TestPlan'
          out_dir.mkdir(parents=True, exist_ok=True)
          out_name = f"GPIO_TestPlan_{now.strftime('%Y%m%d')}_{now.strftime('%H%M%S')}.xlsx"
          out_path = out_dir / out_name
          wb.save(out_path.as_posix())

          # Validate as true XLSX (ZIP and loadable)
          if not zipfile.is_zipfile(out_path.as_posix()):
            raise SystemExit('Generated file is not a valid XLSX (zip)')
          _ = load_workbook(out_path.as_posix(), read_only=True)

          print(f"Excel saved: {out_path.as_posix()}")
          PY

      - name: Commit only the finalized Excel file
        if: ${{ success() }}
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Test_Output/GPIO/TestPlan/*.xlsx
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push origin HEAD:main
          fi
