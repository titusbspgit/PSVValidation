name: Generate and Commit TestPlan Excel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/generate-testplan.yml
      - .github/testplan_input.json
      - scripts/generate_testplan.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Excel from JSON
        env:
          INPUT_JSON_PATH: .github/testplan_input.json
          OUTPUT_DIR: Test_Output/USB/TestPlan/
          IP_NAME: USB
        run: |
          python scripts/generate_testplan.py
      - name: Commit generated Excel
        shell: bash
        run: |
          set -e
          FILE=$(ls -t Test_Output/USB/TestPlan/USB_TestPlan_*.xlsx | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No Excel file generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Added generated TestPlan Excel" || echo "No changes to commit"
          git push
