name: Generate GPIO TestPlan XLSX

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/trigger/gpio-testplan-run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Compute IST timestamp
        id: ts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tzdata
          TZ=Asia/Kolkata date +'%Y%m%d_%H%M%S' > ist_ts.txt
          echo "ist_ts=$(cat ist_ts.txt)" >> "$GITHUB_OUTPUT"
      - name: Generate TestPlan XLSX
        env:
          FIXED_IST_TS: ${{ steps.ts.outputs.ist_ts }}
        run: |
          python tools/generate_testplan.py
      - name: Commit XLSX artifact only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -l Test_Output/GPIO/TestPlan || true
          # Add and commit only the generated .xlsx file(s)
          if ls Test_Output/GPIO/TestPlan/*.xlsx 1> /dev/null 2>&1; then
            git add Test_Output/GPIO/TestPlan/*.xlsx
            git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
            git push
          else
            echo "No XLSX generated" >&2
            exit 1
