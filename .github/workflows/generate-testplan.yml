name: Generate TestPlan Excel

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    env:
      IP_NAME: GPIO
      OUTPUT_DIR: Test_Output/GPIO/TestPlan
      JSON_RAW: |
        [ { "Index": 1, "SS / Module": "GPIO", "Feature": "GPIO negative edge interrupt", "Test Case Name": "test_gpio_nedge_random_pads_en", "Test Description": "Validates negative edge interrupt behavior on randomly selected GPIO pads and verifies group and system interrupt clearing.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "NA", "Memory End Offset": "NA", "Remarks": "Requires one GPIO instance define. Uses random pad selection within a fixed range. Relies on an external flag for synchronization. Uses a shared memory location to drive edges.", "Test Steps / Procedure": "1) Enable the interrupt controller for the selected instance\n2) Enable the system interrupt for the selected instance\n3) Configure a pad for input with negative edge interrupt\n4) Enable the group interrupt bit for the pad\n5) Drive a transition on the external stimulus source\n6) Wait for the interrupt to be serviced\n7) Read the pad register to check input and raw status\n8) Read the group status to confirm the bit is set\n9) Disable the group interrupt and clear the pad interrupt\n10) Read the pad register to confirm the interrupt is cleared\n11) Read the group status to confirm it is cleared\n12) Clear the system raw status for the selected instance", "Impacted Registers": "NA", "Validation / Acceptance Criteria": "1) Pad input reflects expected level during the edge → Status is set\n2) Raw interrupt status for the pad is set → Interrupt occurred\n3) Group status bit for the pad is set → Group interrupt occurred\n4) After clearing the pad, the pad status shows cleared value → Interrupt cleared\n5) After clearing, the group status reads zero → Group interrupt cleared\n6) After clearing, the system raw status reads zero → System status cleared", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_nedge_random_pads_en", "Hidden_Test_Description": "Enable input mode and negative-edge interrupt on randomly selected GPIO pads (8–39), trigger transitions through writes to 0xA0243ffc, validate pad input state and raw/group interrupt status on interrupt, then clear pad, group, and system interrupt statuses.", "Hidden_Remarks": "Requires GPIO0 or GPIO1 to be defined to select IRQ 87 or 88.\nUses address 0xA0243ffc to drive pad transitions.\nPads under test are 8 through 39 of group 0; selection is random and unique.\nUses int_pend as a flag to wait for the interrupt.", "Hidden_Test_Steps_Procedure": "#ifdef GPIO0: GIC_EnableIRQ(87); #ifdef GPIO1: GIC_EnableIRQ(88);\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); #ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR);\nsrand(time(NULL)); write_reg(0xA0243ffc, 0xffffffff);\nFor i = 0..31: pick unique pad_num in [0..31]; wr_val = 1 << pad_num; write_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4), 0x00140000); wait_on(50); write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 1 << pad_num); wait_on(10); write_reg(0xA0243ffc, ~(wr_val)); wait_on(10); write_reg(0xA0243ffc, 0xffffffff); int_pend = 1; while (int_pend == 0x1) { printf("Waiting for interrupt"); wait_on(10); }\nDefault_IRQHandler: wr_val = 1 << pad_num; int_pend = 0; rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4)); if ((rdata & 0x1) != 0) { /* DIN OK / } else { printf("ERROR: DIN mismatch"); test_err++; }\nIf ((rdata & 0x2) != 0x0) { rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & (1 << pad_num)) != 0) { / group intr OK / } else { printf("ERROR: Group Interrupt not occured"); test_err++; }\nwrite_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0x00000000); write_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4), 0x00110001); wait_on(2); rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (pad_num * 4)); if (rdata == 0x100001) { / pad intr cleared / } else { printf("ERROR: Interrupt clear failed : %x", rdata); test_err++; }\nrdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp == 0x0) { / group intr cleared / } else { printf("ERROR: Group Interrupt clear failed: %x", rdata_grp); test_err++; }\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n#ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1); if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n} else { printf("Interrupt Not occured"); test_err++; }\n#ifdef GPIO0: GIC_ClearIRQ(87); #ifdef GPIO1: GIC_ClearIRQ(88);\nfinish(test_err);", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Hidden_Validation_Acceptance_Criteria": "In Default_IRQHandler: (rdata & 0x1) != 0 indicates DIN value matches expected during negedge; else test_err++.\n(rdata & 0x2) != 0x0 indicates raw interrupt raised; else print \"Interrupt Not occured\" and test_err++.\n(rdata_grp & (1 << pad_num)) != 0 indicates group interrupt raised; else test_err++.\nAfter clearing: read pad reg equals 0x100001 indicates interrupt cleared; else test_err++.\nAfter clearing: group status equals 0x0 indicates group interrupt cleared; else test_err++.\nAfter clearing system raw: reading MIZAR_LSS_SYSREG_RAW_STCR1 with respective mask yields zero for that bit; else test_err++." }, { "Index": 2, "SS / Module": "GPIO", "Feature": "GPIO negative edge interrupt", "Test Case Name": "test_gpio_nedge_walking_zeros_pattern", "Test Description": "Tests negative-edge interrupt behavior across GPIO pads 8–39 using a walking-zeros stimulus and validates pad, group, and system interrupt handling.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "Uses either GPIO0 or GPIO1 instance interrupts. External source drives transitions via a fixed address. Pads 8–39 are configured for input and negative-edge triggering. Waits on a shared flag set in the handler.", "Test Steps / Procedure": "1) Enable the instance interrupt in INTREN1lss.\n2) Configure negative-edge triggering on per-pad registers starting from GPIO_8.\n3) Set input mode using GPIO_IO_CTRL_GROUP1, GPIO_IO_CTRL_GROUP2, GPIO_IO_CTRL_GROUP3, and GPIO_IO_CTRL_GROUP4.\n4) Enable group interrupt bits in INTR1_INTR_EN1.\n5) For each pad 8–39, drive a falling-edge stimulus and wait for the interrupt to occur.\n6) In the handler, read the per-pad register (starting at GPIO_8) and verify input and raw status bits.\n7) Read INTR1_INTR_STS1 to confirm the group status bit is set, then clear the per-pad interrupt and verify it is cleared.\n8) Confirm INTR1_INTR_STS1 is cleared and then clear RAWSTCR1lss for the instance.", "Impacted Registers": "INTREN1lss, GPIO_8, INTR1_INTR_EN1, INTR1_INTR_STS1, RAWSTCR1lss, GPIO_IO_CTRL_GROUP1, GPIO_IO_CTRL_GROUP2, GPIO_IO_CTRL_GROUP3, GPIO_IO_CTRL_GROUP4", "Validation / Acceptance Criteria": "1) Per-pad input bit set during a falling edge capture → Input state reflects the expected level.\n2) Per-pad raw status bit set on a falling edge → Interrupt occurred for the pad.\n3) Group status bit set for the active pad in INTR1_INTR_STS1 → Group interrupt occurred.\n4) After writing the clear sequence to the per-pad register → Readback equals the cleared value.\n5) After clearing, INTR1_INTR_STS1 reads zero → Group interrupt cleared.\n6) After clearing RAWSTCR1lss for the instance → The corresponding system raw status bit reads zero.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_nedge_walking_zeros_pattern", "Hidden_Test_Description": "Validates GPIO negative-edge interrupts on pads 8–39 using a walking-zeros pattern generated by writes to 0xA0243ffc. Configures input mode and negative-edge triggering, enables group interrupts, then for each pad generates a falling edge, waits for the interrupt, checks pad input/raw bits, verifies group status, clears pad interrupt, confirms group clear, and clears system raw status.", "Hidden_Remarks": "#ifdef GPIO0 uses IRQ 87; #ifdef GPIO1 uses IRQ 88. External stimulus at address 0xA0243ffc creates walking-zeros pattern. Pads 8–39 are configured via per-pad registers and GPIO_IO_CTRL_GROUP1..4 set to 0x000000FF. Group interrupt enable is set to 0xFFFFFFFF. Synchronization via int_pend flag.", "Hidden_Test_Steps_Procedure": "#ifdef GPIO0: GIC_EnableIRQ(87); #ifdef GPIO1: GIC_EnableIRQ(88);\nSet test_err = 0;\n#ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR);\n#ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR);\nFor i = 0..31: write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00040000); // enable negedge (bit 17 = 1)\nwait_on(10);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP2, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP3, 0x000000FF);\nwrite_reg(MIZAR_GPIO_GPIO_IO_CTRL_GROUP4, 0x000000FF);\nwait_on(10);\nwrite_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, 0xFFFFFFFF);\nFor i = 0..31:\n wr_val = 1 << i;\n write_reg(0xA0243ffc, 0xFFFFFFFF);\n wait_on(30);\n write_reg(0xA0243ffc, ~(wr_val));\n wait_on(30);\n int_pend = 1;\n while (int_pend == 1) { printf("Waiting for interrupt"); wait_on(10); }\nfinish(test_err);\n\nDefault_IRQHandler:\nwr_val = 1 << i;\nint_pend = 0;\nwrite_reg(0xA0243ffc, 0xFFFFFFFF);\nrdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4));\nif ((rdata & 0x1) != 0) { / DIN OK / } else { printf("ERROR: DIN mismatch read_data = %0x", rdata); test_err++; }\nif ((rdata & 0x2) != 0x0) {\n rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1);\n if ((rdata_grp & (1 << i)) != 0) { / group intr OK / } else { printf("ERROR: Group Interrupt not occured"); test_err++; }\n write_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4), 0x00110001);\n wait_on(2);\n rdata = read_reg(MIZAR_GPIO_GP0_GPIO_8 + (i * 4));\n if (rdata == 0x100001) { / pad intr cleared / } else { printf("ERROR: Interrupt clear failed : %x", rdata); test_err++; }\n rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1);\n if (rdata_grp == 0x0) { / group intr cleared / } else { printf("ERROR: Group Interrupt clear failed: %x", rdata_grp); test_err++; }\n #ifdef GPIO0\n write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR);\n rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1);\n if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO0_INTR) == 0) { / sysreg cleared / } else { printf("sysreg status not cleared"); test_err++; }\n #endif\n #ifdef GPIO1\n write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR);\n rdata = read_reg(MIZAR_LSS_SYSREG_RAW_STCR1);\n if ((rdata & LSS_SYSREG_RAW_STCR1_GPIO1_INTR) == 0) { / sysreg cleared */ } else { printf("sysreg status not cleared"); test_err++; }\n #endif\n} else {\n printf("Interrupt Not occured");\n test_err++;\n}\n#ifdef GPIO0: GIC_ClearIRQ(87); #ifdef GPIO1: GIC_ClearIRQ(88);", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR, MIZAR_GPIO_GPIO_IO_CTRL_GROUP1, MIZAR_GPIO_GPIO_IO_CTRL_GROUP2, MIZAR_GPIO_GPIO_IO_CTRL_GROUP3, MIZAR_GPIO_GPIO_IO_CTRL_GROUP4", "Hidden_Validation_Acceptance_Criteria": "1) If (rdata & 0x1) != 0 → DIN value matches during negedge; else increment test_err.\n2) If (rdata & 0x2) != 0x0 → Raw interrupt raised; else print \"Interrupt Not occured\" and increment test_err.\n3) If (rdata_grp & (1 << i)) != 0 → Group interrupt raised; else increment test_err.\n4) After write_reg(..., 0x00110001) and readback → rdata == 0x100001 indicates pad interrupt cleared; else increment test_err.\n5) rdata_grp == 0x0 after clearing → Group interrupt cleared; else increment test_err.\n6) After write to MIZAR_LSS_SYSREG_RAW_STCR1 with respective mask and readback → masked bit reads zero; else increment test_err." }, { "Index": 3, "SS / Module": "GPIO", "Feature": "Interrupts based on negative edge detection at GPIO input", "Test Case Name": "test_gpio_negedge_intr_en", "Test Description": "Enable input mode and negative-edge interrupts on GPIO pads 8–39, trigger falling edges via a memory-mapped stimulus, handle the interrupt, check pad input and raw/group status, then clear pad and system status.", "Speed": "NA", "Mode": "ISR", "Memory Start Offset": "0xA0243ffc", "Memory End Offset": "0xA0243ffc", "Remarks": "#ifdef GPIO0 uses GIC IRQ 87 and clears RAW_STCR1 with the GPIO0 bit; #ifdef GPIO1 uses GIC IRQ 88 and clears RAW_STCR1 with the GPIO1 bit. Uses 0xA0243ffc to generate stimulus. Pads 8–39 are configured via the per‑pad register base. int_pend flag synchronizes main loop and ISR.", "Test Steps / Procedure": "Initialization:\n- Set test_err = 0.\n- If GPIO0: call GIC_EnableIRQ(87).\n- If GPIO1: call GIC_EnableIRQ(88).\n- If GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR).\n- If GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR).\n- write_reg(0xA0243ffc, 0xffffffff).\n\nMain loop for i = 0..31 (pads 8–39):\n- addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n- write_reg(addr1, 0x00140000). // configure input + negedge\n- wait_on(50).\n- wr_val = (1 << i).\n- write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val). // enable group interrupt bit\n- wait_on(10).\n- write_reg(0xA0243ffc, 0xffffffff).\n- wait_on(30).\n- write_reg(0xA0243ffc, ~(wr_val)). // generate falling edge on selected pad\n- int_pend = 1.\n- while (int_pend) { wait_on(10); }\n\nAfter loop:\n- finish(test_err).\n\nDefault_IRQHandler:\n- int_pend = 0.\n- write_reg(0xA0243ffc, 0xffffffff). // restore stimulus\n- raddr = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n- rdata = read_reg(raddr).\n- If ((rdata & 0x1) == 0x0): test_err++.\n- If ((rdata & 0x2) != 0x0):\n - rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n - If ((rdata_grp & wr_val) == 0): test_err++.\n - raddr2 = MIZAR_GPIO_GP0_GPIO_8 + (i * 4).\n - write_reg(raddr2, 0x00110001). // clear per‑pad interrupt\n - rdata = read_reg(raddr2).\n - If (rdata != 0x100001): test_err++.\n - rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1).\n - If (rdata_grp != 0x0): test_err++.\n - If GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87).\n - If GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88).\n- Else: // raw status not set\n - test_err++.", "Impacted Registers": "INTR_EN1, GP0_INTR1_INTR_EN1, GP0_INTR1_INTR_STS1, RAW_STCR1, gp0_intr2_intr_en1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Validation / Acceptance Criteria": "1) If per‑pad input bit is set when the interrupt fires → Input state is valid; else increment error counter.\n2) If per‑pad raw status bit is set → Interrupt occurred; else increment error counter.\n3) If group status bit corresponding to the active pad is set → Group interrupt occurred; else increment error counter.\n4) After writing the per‑pad clear value, readback equals the cleared value (0x100001) → Per‑pad interrupt cleared; else increment error counter.\n5) After clearing, group status register reads 0x0 → Group interrupt cleared; else increment error counter.", "Code Generation (Required / Not)": "", "Hidden_Test_Case_Name": "test_gpio_negedge_intr_en", "Hidden_Test_Description": "Enable input mode and negative-edge interrupts for GPIOs 8–39; for each pad enable its group interrupt bit, drive a falling edge using writes to 0xA0243ffc, wait on int_pend for ISR, read per-pad register to verify DIN and raw status, read group status to confirm the bit is set, clear per-pad interrupt via 0x00110001 and verify readback equals 0x100001, confirm group status is 0x0, and clear system raw status and IRQ for the instance.", "Hidden_Remarks": "#ifdef GPIO0 uses IRQ 87 and RAW_STCR1 GPIO0 mask; #ifdef GPIO1 uses IRQ 88 and RAW_STCR1 GPIO1 mask. Uses 0xA0243ffc as external stimulus. Pads 8–39 accessed via MIZAR_GPIO_GP0_GPIO_8 + (i4). Synchronization via int_pend flag.", "Hidden_Test_Steps_Procedure": "test_err = 0; If GPIO0: GIC_EnableIRQ(87); If GPIO1: GIC_EnableIRQ(88); If GPIO0: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR); If GPIO1: write_reg(MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO1_INTR); write_reg(0xA0243ffc, 0xffffffff); For i = 0..31: addr1 = MIZAR_GPIO_GP0_GPIO_8 + (i4); write_reg(addr1, 0x00140000); wait_on(50); wr_val = 1 << i; write_reg(MIZAR_GPIO_GP0_INTR1_INTR_EN1, wr_val); wait_on(10); write_reg(0xA0243ffc, 0xffffffff); wait_on(30); write_reg(0xA0243ffc, ~(wr_val)); int_pend = 1; while (int_pend) { wait_on(10); } finish(test_err); Default_IRQHandler: int_pend = 0; write_reg(0xA0243ffc, 0xffffffff); raddr = MIZAR_GPIO_GP0_GPIO_8 + (i4); rdata = read_reg(raddr); if ((rdata & 0x1) == 0x0) { test_err++; } if ((rdata & 0x2) != 0x0) { rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if ((rdata_grp & wr_val) == 0) { test_err++; } raddr2 = MIZAR_GPIO_GP0_GPIO_8 + (i4); write_reg(raddr2, 0x00110001); rdata = read_reg(raddr2); if (rdata != 0x100001) { test_err++; } rdata_grp = read_reg(MIZAR_GPIO_GP0_INTR1_INTR_STS1); if (rdata_grp != 0x0) { test_err++; } ifdef GPIO0: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR); GIC_ClearIRQ(87); ifdef GPIO1: write_reg(MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO1_INTR); GIC_ClearIRQ(88); } else { test_err++; }", "Hidden_Impacted_Registers": "MIZAR_LSS_SYSREG_INTR_EN1, LSS_SYSREG_INTR_EN1_GPIO0_INTR, LSS_SYSREG_INTR_EN1_GPIO1_INTR, MIZAR_GPIO_GP0_GPIO_8, MIZAR_GPIO_GP0_INTR1_INTR_EN1, MIZAR_GPIO_GP0_INTR1_INTR_STS1, MIZAR_LSS_SYSREG_RAW_STCR1, LSS_SYSREG_RAW_STCR1_GPIO0_INTR, LSS_SYSREG_RAW_STCR1_GPIO1_INTR", "Hidden_Validation_Acceptance_Criteria": "If ((rdata & 0x1) != 0x0) then input state is valid; else test_err++. If ((rdata & 0x2) != 0x0) then raw interrupt occurred; else test_err++. If ((rdata_grp & wr_val) != 0) then group interrupt occurred; else test_err++. After write_reg(per‑pad, 0x00110001) then readback rdata == 0x100001; else test_err++. After clearing, rdata_grp == 0x0; else test_err++." } ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Compute IST timestamp
        run: |
          echo "IST_DATE=$(TZ=Asia/Kolkata date +%Y%m%d)" >> $GITHUB_ENV
          echo "IST_TIME=$(TZ=Asia/Kolkata date +%H%M%S)" >> $GITHUB_ENV

      - name: Generate Excel
        env:
          IST_DATE: ${{ env.IST_DATE }}
          IST_TIME: ${{ env.IST_TIME }}
          IP_NAME: ${{ env.IP_NAME }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          JSON_RAW: ${{ env.JSON_RAW }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          JSON_B64=$(python - <<'PY'
import base64, os, sys
raw = os.environ.get('JSON_RAW', '')
if not raw.strip():
    print('JSON_RAW missing', file=sys.stderr)
    sys.exit(1)
print(base64.b64encode(raw.encode('utf-8')).decode('ascii'))
PY
)
          python scripts/generate_testplan.py \
            --ip-name "$IP_NAME" \
            --output-dir "$OUTPUT_DIR" \
            --date "$IST_DATE" \
            --time "$IST_TIME" \
            --json-b64 "$JSON_B64"

      - name: Commit Excel artifact
        env:
          IST_DATE: ${{ env.IST_DATE }}
          IST_TIME: ${{ env.IST_TIME }}
          IP_NAME: ${{ env.IP_NAME }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          set -e
          FILE_NAME="${IP_NAME}_TestPlan_${IST_DATE}_${IST_TIME}.xlsx"
          FILE_PATH="${OUTPUT_DIR}/${FILE_NAME}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "Expected Excel not found: $FILE_PATH" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "Final formatted Excel generated from JSON input" || echo "No changes to commit"
          git push

