name: Generate GPIO TestPlan Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_testplan.py'
      - '.github/workflows/generate-testplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl==3.1.2
      - name: Generate Excel from JSON
        run: |
          python scripts/generate_testplan.py
      - name: Validate generated XLSX
        run: |
          python - <<'PY'
          import os, re, zipfile, sys
          out_dir = 'Test_Output/GPIO/TestPlan'
          pattern = re.compile(r'^GPIO_TestPlan_\d{8}_\d{6}\.xlsx$')
          files = [f for f in os.listdir(out_dir) if pattern.match(f)]
          if not files:
              print('No generated Excel found to validate.', file=sys.stderr)
              sys.exit(1)
          files.sort()
          latest = files[-1]
          path = os.path.join(out_dir, latest)
          with zipfile.ZipFile(path, 'r') as zf:
              names = set(zf.namelist())
              required = {'[Content_Types].xml', 'xl/workbook.xml'}
              has_sheet = any(n.startswith('xl/worksheets/sheet') and n.endswith('.xml') for n in names)
              if not required.issubset(names) or not has_sheet:
                  print('XLSX OOXML validation failed.', file=sys.stderr)
                  sys.exit(2)
          print('Validated:', path)
          PY
      - name: Commit finalized Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Test_Output/GPIO/TestPlan/GPIO_TestPlan_*.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Final formatted Excel generated from JSON input"
            git push
          fi
