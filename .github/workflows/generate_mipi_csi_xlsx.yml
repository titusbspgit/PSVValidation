name: Generate MIPI CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261009_auto.py'
  workflow_dispatch:

jobs:
  generate-xlsx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate XLSX workbook
        run: python Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261009_auto.py

      - name: Read generated filename
        id: get_filename
        run: |
          FILENAME=$(cat xlsx_filename.txt)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Copy XLSX to output directory
        run: |
          cp ${{ steps.get_filename.outputs.filename }} Test_Output/MIPI/TestPlan/

      - name: Commit and push XLSX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Test_Output/MIPI/TestPlan/${{ steps.get_filename.outputs.filename }}
          git commit -m "Added generated TestPlan Excel - ${{ steps.get_filename.outputs.filename }}"
          git push
