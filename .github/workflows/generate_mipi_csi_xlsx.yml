name: Generate MIPI CSI TestPlan XLSX

on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261009_direct.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_mipi_csi_testplan_20261009_direct.py
        env:
          OUTPUT_DIR: .
      - name: Commit and push XLSX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Test_Output/MIPI/TestPlan/*.xlsx'
          git commit -m 'Added generated TestPlan Excel' || echo 'No changes'
          git push
