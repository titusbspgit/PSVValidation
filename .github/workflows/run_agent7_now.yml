name: Run Agent7 USB TestPlan Generator NOW

on:
  push:
    paths:
      - '.github/workflows/run_agent7_now.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Generate and commit XLSX
        run: |
          cd Test_Output/USB/TestPlan
          python agent7_generate_xlsx.py
          XLSX=$(ls -t USB_TestPlan_*.xlsx 2>/dev/null | head -1)
          echo "Generated: $XLSX ($(stat -c%s $XLSX) bytes)"
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "Test_Output/USB/TestPlan/$XLSX"
          git commit -m "Added generated TestPlan Excel - $XLSX"
          git push
