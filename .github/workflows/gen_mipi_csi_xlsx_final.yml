name: Generate MIPI_CSI TestPlan XLSX Final
on:
  push:
    paths:
      - 'Test_Output/MIPI/TestPlan/generate_mipi_csi_testplan_20261009_final.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Generate XLSX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd Test_Output/MIPI/TestPlan
          python generate_mipi_csi_testplan_20261009_final.py
      - name: Commit XLSX
        run: |
          cd Test_Output/MIPI/TestPlan
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx"
          git diff --cached --quiet || git commit -m "Added generated TestPlan Excel"
          git push
