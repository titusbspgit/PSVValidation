name: Generate Excel from JSON
on:
  push:
    branches: [ main ]
    paths:
      - 'data/json_data.json'
      - 'scripts/json_to_xlsx.py'
      - '.github/workflows/generate-xlsx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        run: python scripts/json_to_xlsx.py
      - name: Commit Excel
        uses: EndBug/add-and-commit@v9
        with:
          add: 'Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx'
          message: 'Add generated Excel file from JSON input'
          default_author: github_actions
