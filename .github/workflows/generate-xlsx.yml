# trigger run
name: Generate Excel from JSON

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/input.json
      - scripts/json_to_xlsx.py
      - .github/workflows/generate-xlsx.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Generate Excel
        env:
          INPUT_JSON_PATH: scripts/input.json
          OUTPUT_FILE_PATH: Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx
          OUTPUT_FILE_NAME: GPIO_TestPlan_1.xlsx
        run: python scripts/json_to_xlsx.py
      - name: Commit and push generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Test_Output/GPIO/TestPlan/GPIO_TestPlan_1.xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated Excel file from JSON input (automated)"
            git push origin HEAD:main
          fi
